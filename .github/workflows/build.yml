n(){fa.removeEventListener('file-attachment-accepted',onAcc);if(!acc&&!document.querySelector('.js-upload-manifest-file,.js-upload-progress')){var inp=fa.querySelector('input[type="file"]')||document.querySelector('#upload-manifest-files-input,input[type="file"]');if(inp){try{var rDt2=new DataTransfer();for(var i=0;i<list.length;i++)rDt2.items.add(list[i].file);inp.files=rDt2.files;inp.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}}},350);return 'OK:'+list.length;};return 'INIT';})();""")
