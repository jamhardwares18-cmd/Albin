name: Build YT Browser Downloader APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Generate Android App Source
        run: |
          mkdir -p app/src/main/java/com/example/ytdownloader app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "YTDownloader"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.ytdownloader'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.ytdownloader"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
                  ndk { abiFilters 'arm64-v8a' }
              }
              buildTypes { debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths><external-path name="external_files" path="." /></paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:allowBackup="true"
                  android:label="YT Downloader"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytdownloader/Engine.kt
          package com.example.ytdownloader

          import android.content.*
          import android.net.Uri
          import android.os.*
          import android.provider.MediaStore
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatDelegate
          import com.yausername.youtubedl_android.*
          import org.json.*
          import java.io.*
          import java.net.*
          import java.util.*
          import java.util.concurrent.*

          data class BookmarkItem(val title: String, val url: String)
          data class BrowserTab(val id: String, var title: String, var url: String, val webView: WebView, val detectedMedia: LinkedHashSet<String> = LinkedHashSet())
          data class VideoQualityOption(val id: String, val label: String, val subLabel: String, val formatId: String, val ext: String, val sizeBytes: Long, val isAudioOnly: Boolean, val needsAudioMerge: Boolean, val isOriginal: Boolean, val directHttpUrl: String? = null)
          data class DownloadTask(val id: String, val title: String, val sourceUrl: String, val videoKey: String, val qualityId: String, val qualityLabel: String, var status: String, var progress: Int = 0, var detail: String = "", var processId: String? = null, @Volatile var isCancelled: Boolean = false, @Volatile var isFinished: Boolean = false, var isSuccess: Boolean = false)
          data class DownloadedRecord(val id: String, val title: String, val sourceUrl: String, val videoKey: String, val qualityId: String, val qualityLabel: String, val sizeText: String, val relativePath: String, val contentUri: String?, val mimeType: String, val timestamp: Long)

          fun formatSizeMb(bytes: Long): String {
              if (bytes <= 0L) return "Size N/A"
              val mb = bytes.toDouble() / (1024.0 * 1024.0)
              return when {
                  mb >= 100.0 -> String.format(Locale.US, "%.0f MB", mb)
                  mb >= 1.0 -> String.format(Locale.US, "%.1f MB", mb)
                  else -> String.format(Locale.US, "%.0f KB", bytes.toDouble() / 1024.0)
              }
          }

          object AppStorage {
              private lateinit var prefs: SharedPreferences
              fun init(ctx: Context) {
                  if (!::prefs.isInitialized) {
                      prefs = ctx.applicationContext.getSharedPreferences("ytdl_prefs", Context.MODE_PRIVATE)
                      if (!prefs.getBoolean("bm_init", false)) {
                          saveBookmarks(listOf(BookmarkItem("YouTube", "https://m.youtube.com"), BookmarkItem("Google", "https://www.google.com")))
                          prefs.edit().putBoolean("bm_init", true).apply()
                      }
                  }
              }
              fun getThemeMode() = prefs.getInt("theme", 0)
              fun setThemeMode(m: Int) = prefs.edit().putInt("theme", m).apply()
              fun applySavedTheme() {
                  AppCompatDelegate.setDefaultNightMode(when (getThemeMode()) { 1 -> AppCompatDelegate.MODE_NIGHT_NO; 2 -> AppCompatDelegate.MODE_NIGHT_YES; else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM })
              }
              fun isDesktopMode() = prefs.getBoolean("desktop", false)
              fun setDesktopMode(v: Boolean) = prefs.edit().putBoolean("desktop", v).apply()
              fun getHomeUrl() = prefs.getString("home", "https://m.youtube.com") ?: "https://m.youtube.com"
              fun setHomeUrl(u: String) = prefs.edit().putString("home", u.trim().ifEmpty { "https://m.youtube.com" }).apply()
              fun normalizeUrlKey(u: String) = u.trim().substringBefore("#")

              fun getBookmarks(): MutableList<BookmarkItem> {
                  val list = mutableListOf<BookmarkItem>()
                  try {
                      val arr = JSONArray(prefs.getString("bookmarks", "[]") ?: "[]")
                      for (i in 0 until arr.length()) arr.getJSONObject(i).let { list.add(BookmarkItem(it.optString("t"), it.optString("u"))) }
                  } catch (_: Exception) {}
                  return list
              }
              private fun saveBookmarks(list: List<BookmarkItem>) {
                  val arr = JSONArray()
                  list.forEach { arr.put(JSONObject().apply { put("t", it.title); put("u", it.url) }) }
                  prefs.edit().putString("bookmarks", arr.toString()).apply()
              }
              fun addBookmark(t: String, u: String) { val l = getBookmarks(); l.removeAll { it.url == u }; l.add(0, BookmarkItem(t.ifBlank { u }, u)); saveBookmarks(l) }
              fun removeBookmark(u: String) { val l = getBookmarks(); l.removeAll { it.url == u }; saveBookmarks(l) }
              fun isBookmarked(u: String) = getBookmarks().any { it.url == u }

              private fun getKeySet(): MutableSet<String> {
                  val s = LinkedHashSet<String>()
                  try { val a = JSONArray(prefs.getString("dl_keys", "[]") ?: "[]"); for (i in 0 until a.length()) s.add(a.getString(i)) } catch (_: Exception) {}
                  return s
              }
              private fun saveKeySet(s: Set<String>) { val a = JSONArray(); s.forEach { a.put(it) }; prefs.edit().putString("dl_keys", a.toString()).apply() }
              fun isQualityDownloaded(vk: String, qid: String) = getKeySet().contains("$vk||$qid")
              fun markQualityDownloaded(vk: String, qid: String) { val s = getKeySet(); s.add("$vk||$qid"); saveKeySet(s) }
              fun unmarkQualityDownloaded(vk: String, qid: String) { val s = getKeySet(); s.remove("$vk||$qid"); saveKeySet(s) }

              fun getDownloadedRecords(): MutableList<DownloadedRecord> {
                  val list = mutableListOf<DownloadedRecord>()
                  try {
                      val arr = JSONArray(prefs.getString("dl_recs", "[]") ?: "[]")
                      for (i in 0 until arr.length()) arr.getJSONObject(i).let {
                          list.add(DownloadedRecord(it.optString("id"), it.optString("t"), it.optString("u"), it.optString("vk"), it.optString("qid"), it.optString("ql"), it.optString("sz"), it.optString("rp"), it.optString("cu").ifEmpty { null }, it.optString("mt", "*/*"), it.optLong("ts", 0L)))
                      }
                  } catch (_: Exception) {}
                  return list
              }
              private fun saveRecords(list: List<DownloadedRecord>) {
                  val arr = JSONArray()
                  list.forEach { r -> arr.put(JSONObject().apply { put("id", r.id); put("t", r.title); put("u", r.sourceUrl); put("vk", r.videoKey); put("qid", r.qualityId); put("ql", r.qualityLabel); put("sz", r.sizeText); put("rp", r.relativePath); put("cu", r.contentUri ?: ""); put("mt", r.mimeType); put("ts", r.timestamp) }) }
                  prefs.edit().putString("dl_recs", arr.toString()).apply()
              }
              fun addDownloadedRecord(r: DownloadedRecord) { val l = getDownloadedRecords(); l.add(0, r); saveRecords(l) }
              fun removeDownloadedRecord(r: DownloadedRecord) {
                  val l = getDownloadedRecords(); l.removeAll { it.id == r.id }; saveRecords(l)
                  if (r.videoKey.isNotEmpty() && r.qualityId.isNotEmpty()) unmarkQualityDownloaded(r.videoKey, r.qualityId)
              }
              fun clearAllHistory() { prefs.edit().putString("dl_recs", "[]").putString("dl_keys", "[]").apply() }
              fun saveTabs(urls: List<String>, active: Int) { val a = JSONArray(); urls.forEach { a.put(it) }; prefs.edit().putString("tabs", a.toString()).putInt("atab", active).apply() }
              fun getSavedTabs(): Pair<List<String>, Int> {
                  val l = mutableListOf<String>()
                  try { val a = JSONArray(prefs.getString("tabs", "[]") ?: "[]"); for (i in 0 until a.length()) a.getString(i).let { if (it.isNotBlank()) l.add(it) } } catch (_: Exception) {}
                  return Pair(l, prefs.getInt("atab", 0))
              }
          }

          object FolderDownloader {
              data class DirItem(val url: String, val relPath: String, val depth: Int)
              data class FileItem(val url: String, val relFolder: String, val fileName: String)
              data class SavedFileResult(val relativePath: String, val contentUri: String?, val mimeType: String, val totalBytes: Long)
              data class FolderResult(val rootFolderName: String, val filesDownloaded: Int, val totalBytes: Long, val firstContentUri: String?)
              private val linkRegex = Regex("""<a\s+[^>]*href\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))""", RegexOption.IGNORE_CASE)

              fun sanitizeName(raw: String, fallback: String = "item"): String {
                  val d = try { URLDecoder.decode(raw, "UTF-8") } catch (_: Exception) { raw }
                  val c = d.replace(Regex("""[\\/:*?"<>|\u0000-\u001F]"""), "_").trim().trim('.')
                  return if (c.isEmpty() || c == "..") fallback else c
              }
              private fun lastSeg(u: String, fb: String) = try { val s = (URI(u).rawPath ?: "").trimEnd('/').substringAfterLast('/', ""); if (s.isEmpty()) fb else sanitizeName(s, fb) } catch (_: Exception) { fb }
              private fun openConn(u: String, cookies: String?, ua: String) = (URL(u).openConnection() as HttpURLConnection).apply {
                  connectTimeout = 15000; readTimeout = 30000; instanceFollowRedirects = true
                  setRequestProperty("User-Agent", ua); if (!cookies.isNullOrBlank()) setRequestProperty("Cookie", cookies)
              }

              fun downloadRecursive(ctx: Context, startUrl: String, cookies: String?, ua: String, onProg: (String, Int) -> Unit, isCanc: () -> Boolean): FolderResult {
                  onProg("Scanning folder & subfolders...", 5)
                  val c0 = openConn(startUrl, cookies, ua)
                  val code = c0.responseCode; val finalUrl = c0.url.toString().substringBefore("#")
                  val ct0 = (c0.contentType ?: "").lowercase(); val disp0 = c0.getHeaderField("Content-Disposition") ?: ""
                  if (code >= 400) { c0.disconnect(); throw RuntimeException("HTTP $code") }
                  if (!ct0.contains("text/html") || disp0.contains("attachment", true)) {
                      val fn = headerFilename(disp0, finalUrl)
                      val sv = c0.inputStream.use { saveStreamToDownloads(ctx, it, "", fn, ct0, c0.contentLengthLong, { p -> onProg("Downloading $fn ($p%)", p) }, isCanc) }
                      c0.disconnect(); return FolderResult(fn, 1, sv.totalBytes, sv.contentUri)
                  }
                  val html0 = c0.inputStream.bufferedReader().use { it.readText() }; c0.disconnect()
                  val rootName = lastSeg(finalUrl, sanitizeName(URI(finalUrl).host ?: "WebFolder", "WebFolder"))
                  val rootPrefix = if (finalUrl.endsWith("/")) finalUrl else finalUrl.substringBeforeLast('/') + "/"
                  val dq = java.util.ArrayDeque<DirItem>(); val visited = HashSet<String>(); val files = ArrayList<FileItem>()
                  visited.add(finalUrl); parseDir(html0, finalUrl, rootPrefix, rootName, 0, dq, visited, files)
                  var scanned = 1
                  while (dq.isNotEmpty() && scanned < 200) {
                      if (isCanc()) throw InterruptedException("Cancelled")
                      val d = dq.removeFirst(); scanned++; onProg("Scanning ${d.relPath} (${files.size} files)...", 10)
                      try {
                          val c = openConn(d.url, cookies, ua)
                          if (c.responseCode < 400) {
                              val ru = c.url.toString().substringBefore("#"); val ct = (c.contentType ?: "").lowercase()
                              if (ct.contains("text/html")) { val h = c.inputStream.bufferedReader().use { it.readText() }; c.disconnect(); parseDir(h, ru, rootPrefix, d.relPath, d.depth, dq, visited, files) }
                              else { c.disconnect(); files.add(FileItem(ru, d.relPath.substringBeforeLast('/', rootName), lastSeg(ru, "file_${files.size}"))) }
                          } else c.disconnect()
                      } catch (_: Exception) {}
                  }
                  if (files.isEmpty()) throw RuntimeException("No downloadable files found in folder.")
                  var ok = 0; var bytes = 0L; var firstUri: String? = null
                  files.forEachIndexed { i, fi ->
                      if (isCanc()) throw InterruptedException("Cancelled")
                      onProg("(${i + 1}/${files.size}) ${fi.relFolder}/${fi.fileName}", (15 + ((i.toFloat() / files.size) * 85f).toInt()).coerceIn(15, 99))
                      try {
                          val c = openConn(fi.url, cookies, ua)
                          if (c.responseCode in 200..299) {
                              val ct = (c.contentType ?: "").lowercase(); val disp = c.getHeaderField("Content-Disposition") ?: ""
                              if (!(ct.contains("text/html") && !disp.contains("attachment", true) && !fi.fileName.endsWith(".html", true) && !fi.fileName.endsWith(".htm", true))) {
                                  val fn = if (disp.isNotBlank()) headerFilename(disp, fi.url, fi.fileName) else fi.fileName
                                  val sv = c.inputStream.use { saveStreamToDownloads(ctx, it, fi.relFolder, fn, ct, c.contentLengthLong, {}, isCanc) }
                                  ok++; bytes += sv.totalBytes; if (firstUri == null) firstUri = sv.contentUri
                              }
                          }
                          c.disconnect()
                      } catch (e: InterruptedException) { throw e } catch (_: Exception) {}
                  }
                  onProg("Done: $ok files saved in $rootName", 100)
                  return FolderResult(rootName, ok, bytes, firstUri)
              }

              private fun parseDir(html: String, baseUrl: String, rootPrefix: String, relPath: String, depth: Int, dq: java.util.ArrayDeque<DirItem>, visited: HashSet<String>, files: MutableList<FileItem>) {
                  val base = try { URI(baseUrl) } catch (_: Exception) { return }
                  val seen = HashSet<String>()
                  for (m in linkRegex.findAll(html)) {
                      val href = (m.groupValues[1].ifEmpty { m.groupValues[2].ifEmpty { m.groupValues[3] } }).trim().replace("&amp;", "&")
                      if (href.isEmpty() || href.startsWith("#") || href.startsWith("?") || href.startsWith("javascript:", true) || href.startsWith("mailto:", true) || href == "." || href == "./" || href == ".." || href == "../") continue
                      val res = try { base.resolve(href).toString().substringBefore("#") } catch (_: Exception) { continue }
                      if (!res.startsWith(rootPrefix) || res.substringBefore('?') == baseUrl.substringBefore('?')) continue
                      val ru = try { URI(res) } catch (_: Exception) { continue }
                      if ((ru.rawPath ?: "").endsWith("/") && ru.query.isNullOrEmpty()) {
                          if (visited.add(res) && depth < 10) dq.addLast(DirItem(res, "$relPath/${lastSeg(res, "Sub")}", depth + 1))
                      } else if (seen.add(res)) files.add(FileItem(res, relPath, lastSeg(res, "file_${files.size + 1}")))
                  }
              }

              fun downloadSingleDirectFile(ctx: Context, url: String, cookies: String?, ua: String, sugName: String?, onProg: (String, Int) -> Unit, isCanc: () -> Boolean): SavedFileResult {
                  val c = openConn(url, cookies, ua)
                  if (c.responseCode >= 400) { c.disconnect(); throw RuntimeException("HTTP ${c.responseCode}") }
                  val ct = (c.contentType ?: "application/octet-stream").substringBefore(";").trim()
                  val fn = headerFilename(c.getHeaderField("Content-Disposition") ?: "", c.url.toString(), sugName)
                  val sv = c.inputStream.use { saveStreamToDownloads(ctx, it, "", fn, ct, c.contentLengthLong, { p -> onProg("Downloading $fn ($p%)", p) }, isCanc) }
                  c.disconnect(); return sv
              }

              private fun headerFilename(disp: String, url: String, fb: String? = null): String {
                  val m = Regex("""filename\*?=(?:UTF-8''|"?)([^";]+)""", RegexOption.IGNORE_CASE).find(disp)
                  if (m != null && m.groupValues[1].trim().trim('"').isNotEmpty()) return sanitizeName(m.groupValues[1].trim().trim('"'))
                  if (!fb.isNullOrBlank()) return sanitizeName(fb)
                  return lastSeg(url, "dl_${System.currentTimeMillis()}")
              }

              fun saveStreamToDownloads(ctx: Context, inp: InputStream, subFolder: String, fileName: String, mimeHint: String, expLen: Long, onPct: (Int) -> Unit, isCanc: () -> Boolean): SavedFileResult {
                  val cleanSub = subFolder.trim('/').split('/').filter { it.isNotBlank() }.joinToString("/") { sanitizeName(it, "Folder") }
                  val cleanName = sanitizeName(fileName, "file"); val mime = guessMime(cleanName, mimeHint)
                  val relDir = if (cleanSub.isEmpty()) "${Environment.DIRECTORY_DOWNLOADS}/YTDownloader" else "${Environment.DIRECTORY_DOWNLOADS}/YTDownloader/$cleanSub"
                  val buf = ByteArray(16 * 1024); var readTotal = 0L; var lastPct = -1
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val r = ctx.contentResolver
                      val cv = ContentValues().apply { put(MediaStore.Downloads.DISPLAY_NAME, cleanName); put(MediaStore.Downloads.MIME_TYPE, mime); put(MediaStore.Downloads.RELATIVE_PATH, relDir); put(MediaStore.Downloads.IS_PENDING, 1) }
                      val uri = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: throw RuntimeException("MediaStore error")
                      try {
                          r.openOutputStream(uri)?.use { out ->
                              while (true) {
                                  if (isCanc()) throw InterruptedException("Cancelled")
                                  val n = inp.read(buf); if (n == -1) break
                                  out.write(buf, 0, n); readTotal += n
                                  if (expLen > 0) ((readTotal * 100) / expLen).toInt().coerceIn(0, 100).let { if (it != lastPct) { lastPct = it; onPct(it) } }
                              }
                          }
                          cv.clear(); cv.put(MediaStore.Downloads.IS_PENDING, 0); r.update(uri, cv, null, null)
                      } catch (e: Exception) { r.delete(uri, null, null); throw e }
                      return SavedFileResult("$relDir/$cleanName", uri.toString(), mime, readTotal)
                  } else {
                      val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), if (cleanSub.isEmpty()) "YTDownloader" else "YTDownloader/$cleanSub")
                      if (!dir.exists()) dir.mkdirs()
                      val dest = File(dir, cleanName)
                      try {
                          FileOutputStream(dest).use { out ->
                              while (true) {
                                  if (isCanc()) throw InterruptedException("Cancelled")
                                  val n = inp.read(buf); if (n == -1) break
                                  out.write(buf, 0, n); readTotal += n
                                  if (expLen > 0) ((readTotal * 100) / expLen).toInt().coerceIn(0, 100).let { if (it != lastPct) { lastPct = it; onPct(it) } }
                              }
                          }
                      } catch (e: Exception) { dest.delete(); throw e }
                      return SavedFileResult(dest.absolutePath, null, mime, readTotal)
                  }
              }

              fun guessMime(fn: String, hint: String) = when (fn.substringAfterLast('.', "").lowercase()) {
                  "mp4" -> "video/mp4"; "mkv" -> "video/x-matroska"; "webm" -> "video/webm"; "m4a" -> "audio/mp4"; "mp3" -> "audio/mpeg"
                  "jpg", "jpeg" -> "image/jpeg"; "png" -> "image/png"; "pdf" -> "application/pdf"; "zip" -> "application/zip"; "apk" -> "application/vnd.android.package-archive"
                  else -> if (hint.contains("/") && !hint.contains("html")) hint.substringBefore(";").trim() else "application/octet-stream"
              }
          }

          object DownloadCenter {
              val tasks = CopyOnWriteArrayList<DownloadTask>()
              private val exec = Executors.newFixedThreadPool(3)
              private val handler = Handler(Looper.getMainLooper())
              var onStateChanged: (() -> Unit)? = null
              fun activeCount() = tasks.count { !it.isFinished }
              fun isQualityDownloading(vk: String, qid: String) = tasks.any { !it.isFinished && it.videoKey == vk && it.qualityId == qid }
              private fun notifyUI() { handler.post { onStateChanged?.invoke() } }

              fun cancelTask(id: String) {
                  val t = tasks.find { it.id == id } ?: return
                  t.isCancelled = true; t.status = "Cancelling..."
                  t.processId?.let { pid -> Thread { try { YoutubeDL.getInstance().destroyProcessById(pid) } catch (_: Exception) {} }.start() }
                  notifyUI()
              }
              fun clearFinishedTasks() { tasks.removeAll { it.isFinished }; notifyUI() }

              fun enqueueVideoQualityDownload(ctx: Context, vk: String, title: String, pageUrl: String, q: VideoQualityOption, cookies: String?, ua: String) {
                  val app = ctx.applicationContext; val tid = UUID.randomUUID().toString(); val pid = "yt_${System.currentTimeMillis()}_${tasks.size}"
                  val task = DownloadTask(tid, title, pageUrl, vk, q.id, q.label, "Queued", 0, formatSizeMb(q.sizeBytes), pid)
                  tasks.add(0, task); notifyUI()
                  exec.execute {
                      val workDir = File(app.getExternalFilesDir(null), "work_$tid"); workDir.mkdirs()
                      try {
                          if (task.isCancelled) throw InterruptedException("Cancelled")
                          task.status = "Downloading"; notifyUI()
                          if (q.directHttpUrl != null) {
                              val sv = FolderDownloader.downloadSingleDirectFile(app, q.directHttpUrl, cookies, ua, "${FolderDownloader.sanitizeName(title, "video")}_${q.label}.${q.ext.ifBlank { "mp4" }}", { s, p -> task.progress = p; task.detail = s; notifyUI() }, { task.isCancelled })
                              AppStorage.markQualityDownloaded(vk, q.id)
                              AppStorage.addDownloadedRecord(DownloadedRecord(tid, title, pageUrl, vk, q.id, q.label, formatSizeMb(sv.totalBytes), sv.relativePath, sv.contentUri, sv.mimeType, System.currentTimeMillis()))
                              task.progress = 100; task.status = "Completed"; task.detail = "Saved (${formatSizeMb(sv.totalBytes)}) ✓✓"; task.isSuccess = true; task.isFinished = true; notifyUI(); return@execute
                          }
                          val req = YoutubeDLRequest(pageUrl).apply {
                              addOption("-o", "${workDir.absolutePath}/%(title).70s_${FolderDownloader.sanitizeName(q.label, q.id)}.%(ext)s")
                              addOption("--no-playlist"); addOption("--no-mtime")
                              if (q.isAudioOnly) { addOption("-f", "ba/b"); addOption("-x"); addOption("--audio-format", q.ext) }
                              else if (q.needsAudioMerge) { addOption("-f", "${q.formatId}+ba[ext=m4a]/${q.formatId}+ba/b"); addOption("--merge-output-format", "mp4") }
                              else addOption("-f", q.formatId)
                          }
                          YoutubeDL.getInstance().execute(req, pid) { p, eta, line ->
                              if (task.isCancelled) return@execute
                              if (p >= 0f) { task.progress = p.toInt().coerceIn(0, 99); task.detail = "${task.progress}% • ETA ${eta}s" }
                              else if (line.isNotBlank()) task.detail = line.take(80)
                              notifyUI()
                          }
                          if (task.isCancelled) throw InterruptedException("Cancelled")
                          val out = workDir.listFiles()?.firstOrNull { it.isFile && !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") } ?: throw RuntimeException("Output file missing")
                          val sv = FileInputStream(out).use { FolderDownloader.saveStreamToDownloads(app, it, "", out.name, FolderDownloader.guessMime(out.name, ""), out.length(), {}, { task.isCancelled }) }
                          AppStorage.markQualityDownloaded(vk, q.id)
                          AppStorage.addDownloadedRecord(DownloadedRecord(tid, title, pageUrl, vk, q.id, q.label, formatSizeMb(sv.totalBytes), sv.relativePath, sv.contentUri, sv.mimeType, System.currentTimeMillis()))
                          task.progress = 100; task.status = "Completed"; task.detail = "Saved (${formatSizeMb(sv.totalBytes)}) ✓✓"; task.isSuccess = true; task.isFinished = true
                      } catch (_: InterruptedException) { task.status = "Cancelled"; task.detail = "Stopped"; task.isFinished = true }
                      catch (e: Exception) { task.status = if (task.isCancelled) "Cancelled" else "Failed"; task.detail = (e.message ?: "Error").take(120); task.isFinished = true }
                      finally { workDir.deleteRecursively(); notifyUI() }
                  }
              }

              fun enqueueFolderDownload(ctx: Context, folderUrl: String, cookies: String?, ua: String) {
                  val app = ctx.applicationContext; val tid = UUID.randomUUID().toString()
                  val sn = FolderDownloader.sanitizeName(folderUrl.trimEnd('/').substringAfterLast('/', "Folder"), "Folder")
                  val task = DownloadTask(tid, "📁 $sn", folderUrl, "", "", "Folder", "Scanning", 0, "Scanning...")
                  tasks.add(0, task); notifyUI()
                  exec.execute {
                      try {
                          val res = FolderDownloader.downloadRecursive(app, folderUrl, cookies, ua, { m, p -> task.status = "Downloading"; task.progress = p; task.detail = m; notifyUI() }, { task.isCancelled })
                          AppStorage.addDownloadedRecord(DownloadedRecord(tid, "📁 ${res.rootFolderName} (${res.filesDownloaded} files)", folderUrl, "", "", "Folder", formatSizeMb(res.totalBytes), "Download/YTDownloader/${res.rootFolderName}", res.firstContentUri, "*/*", System.currentTimeMillis()))
                          task.progress = 100; task.status = "Completed"; task.detail = "${res.filesDownloaded} files saved"; task.isSuccess = true; task.isFinished = true
                      } catch (_: InterruptedException) { task.status = "Cancelled"; task.detail = "Stopped"; task.isFinished = true }
                      catch (e: Exception) { task.status = "Failed"; task.detail = (e.message ?: "Error").take(120); task.isFinished = true }
                      finally { notifyUI() }
                  }
              }

              fun enqueueDirectFileDownload(ctx: Context, url: String, sugName: String?, cookies: String?, ua: String) {
                  val app = ctx.applicationContext; val tid = UUID.randomUUID().toString()
                  val lbl = sugName ?: url.substringAfterLast('/').substringBefore('?').ifBlank { "File" }
                  val task = DownloadTask(tid, lbl, url, "", "", "File", "Downloading", 0, "Connecting...")
                  tasks.add(0, task); notifyUI()
                  exec.execute {
                      try {
                          val sv = FolderDownloader.downloadSingleDirectFile(app, url, cookies, ua, sugName, { m, p -> task.progress = p; task.detail = m; notifyUI() }, { task.isCancelled })
                          AppStorage.addDownloadedRecord(DownloadedRecord(tid, lbl, url, "", "", "File", formatSizeMb(sv.totalBytes), sv.relativePath, sv.contentUri, sv.mimeType, System.currentTimeMillis()))
                          task.progress = 100; task.status = "Completed"; task.detail = "Saved (${formatSizeMb(sv.totalBytes)})"; task.isSuccess = true; task.isFinished = true
                      } catch (_: InterruptedException) { task.status = "Cancelled"; task.detail = "Stopped"; task.isFinished = true }
                      catch (e: Exception) { task.status = "Failed"; task.detail = (e.message ?: "Error").take(120); task.isFinished = true }
                      finally { notifyUI() }
                  }
              }
          }
