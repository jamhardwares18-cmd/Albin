                  activeBatchCancel?.set(true)
                  try { dlWv?.destroy() } catch (e: Exception) { }
                  dlWv = null
                  super.onDestroy()
              }

              // ---------- helpers ----------

              private fun click(id: Int, f: (View) -> Unit) {
                  findViewById<View>(id).setOnClickListener { f(it) }
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              private fun dlg() = AlertDialog.Builder(
                  this,
                  if (dark) android.R.style.Theme_Material_Dialog_Alert else android.R.style.Theme_Material_Light_Dialog_Alert
              )

              private fun shape(fill: Int, r: Int, stroke: Int = 0, sw: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dp(r).toFloat()
                  if (sw > 0) g.setStroke(sw, stroke)
                  return g
              }

              private fun currentWebUa(): String =
                  tabs.getOrNull(cur)?.web?.settings?.userAgentString ?: MOBILE_UA

              private fun sanitizeName(s: String): String =
                  s.replace(Regex("[\\\\/:*?\"<>|\\r\\n\\t]+"), " ").replace(Regex("\\s+"), " ").trim().take(120)

              private fun sanitizeFolder(f: String): String =
                  f.split("/").map { sanitizeName(it) }.filter { it.isNotEmpty() && it != "." && it != ".." }.joinToString("/")

              private fun isJunkTitle(s: String): Boolean {
                  val l = s.trim().lowercase(Locale.US)
                  if (l.length <= 2) return true
                  if (l in JUNK_TITLE_WORDS) return true
                  if (SIZE_ONLY_RE.matches(l)) return true
                  return false
              }

              private fun urlExt(u: String): String {
                  val path = u.substringBefore('#').substringBefore('?')
                  val seg = path.substringAfterLast('/', "")
                  return if (seg.contains('.')) seg.substringAfterLast('.').lowercase(Locale.US) else ""
              }

              private fun isAudioUrl(u: String): Boolean = urlExt(u) in AUDIO_EXTS

              private fun normUrl(u: String): String {
                  val clean = u.substringBefore('#').trim()
                  val uri = Uri.parse(clean)
                  val host = (uri.host ?: "").lowercase(Locale.US).removePrefix("www.")
                  val rawPath = Uri.decode(uri.path ?: "")
                  val path = when {
                      rawPath.isEmpty() -> "/"
                      rawPath.length > 1 -> rawPath.trimEnd('/')
                      else -> rawPath
                  }
                  val rawQ = uri.encodedQuery
                  val q = if (!rawQ.isNullOrEmpty()) Uri.decode(rawQ) else ""
                  return "$host$path" + (if (q.isNotEmpty()) "?$q" else "")
              }

              private fun sameHost(a: String, b: String): Boolean {
                  val ha = (Uri.parse(a).host ?: "").lowercase(Locale.US).removePrefix("www.")
                  val hb = (Uri.parse(b).host ?: "").lowercase(Locale.US).removePrefix("www.")
                  return ha.isNotEmpty() && ha == hb
              }

              private fun guessNameFromUrl(u: String): String {
                  val seg = Uri.parse(u).lastPathSegment ?: "Folder"
                  val base = seg.substringBeforeLast('.')
                  return sanitizeName(Uri.decode(base).replace('_', ' ').replace('-', ' ')).ifEmpty { "Folder" }
              }

              private fun dirSignature(u: String): String {
                  val uri = Uri.parse(u)
                  val qDir = uri.getQueryParameter("dir") ?: uri.getQueryParameter("folder")
                      ?: uri.getQueryParameter("path") ?: uri.getQueryParameter("album")
                  if (!qDir.isNullOrEmpty()) return Uri.decode(qDir).trim('/').lowercase(Locale.US)
                  return Uri.decode(uri.path ?: "").trim('/').lowercase(Locale.US)
              }

              private fun isChildPath(childUrl: String, baseUrl: String): Boolean {
                  val c = dirSignature(childUrl)
                  val b = dirSignature(baseUrl)
                  return b.isNotEmpty() && c.length > b.length && c.startsWith("$b/")
              }

              private fun isParentUrl(candidateUrl: String, baseUrl: String): Boolean {
                  val c = dirSignature(candidateUrl)
                  val b = dirSignature(baseUrl)
                  if (c.isEmpty() && b.isNotEmpty()) return true
                  return b.isNotEmpty() && c.length < b.length && b.startsWith("$c/")
              }

              private fun isLikelyChildFolder(a: Element, href: String, baseUrl: String): Boolean {
                  if (isChildPath(href, baseUrl)) return true
                  val box = a.closest("tr, li, div") ?: a
                  val imgs = if (box.select("a").size <= 2) box.select("img") else a.select("img")
                  for (img in imgs) {
                      val h = (img.attr("src") + " " + img.attr("alt") + " " + img.attr("title")).lowercase(Locale.US)
                      if (h.contains("folder") || h.contains("dir")) return true
                  }
                  return false
              }

              // ---------- orientation & landscape scroll bars ----------

              private fun applyOrientation() {
                  requestedOrientation = when (orient) {
                      1 -> ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      2 -> ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      else -> ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  }
                  updateSettingsUi()
              }

              private fun setBarsHidden(hide: Boolean) {
                  val wantHide = hide &&
                      resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE &&
                      tabs.getOrNull(cur)?.home == false &&
                      dlPage.visibility != View.VISIBLE &&
                      setPage.visibility != View.VISIBLE &&
                      tabsPage.visibility != View.VISIBLE
                  if (barsHidden == wantHide) return
                  barsHidden = wantHide
                  val vis = if (wantHide) View.GONE else View.VISIBLE
                  topBar.visibility = vis
                  bottomBar.visibility = vis
                  lastBarToggle = System.currentTimeMillis()
              }

              // ---------- theme ----------

              private fun applyTheme() {
                  col = if (dark) DARK else LIGHT
                  themeTree(findViewById(R.id.root))
                  window.statusBarColor = col.bg
                  window.navigationBarColor = col.bg
                  bars()
                  for (t in tabs) applyWeb(t.web)
                  refreshDl()
                  if (tabsPage.visibility == View.VISIBLE) tabsAdapter.notifyDataSetChanged()
                  updateSettingsUi()
              }

              private fun bars() {
                  var f = View.SYSTEM_UI_FLAG_VISIBLE
                  if (!dark) f = f or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  window.decorView.systemUiVisibility = f
              }

              private fun themeTree(v: View) {
                  val tag = v.tag as? String
                  when (tag) {
                      "bg" -> v.setBackgroundColor(col.bg)
                      "pill" -> v.background = shape(col.pill, 24)
                      "card" -> v.background = shape(col.card, 24)
                      "outline" -> v.background = shape(Color.TRANSPARENT, 28, col.stroke, dp(1))
                      "tab" -> v.background = shape(Color.TRANSPARENT, 6, col.text, dp(2))
                  }
                  if (v is EditText) {
                      v.setTextColor(col.text)
                      v.setHintTextColor(col.sec)
                  } else if (v is TextView && tag != "logo") {
                      v.setTextColor(
                          when (tag) {
                              "sec" -> col.sec
                              "accent" -> 0xFF2D7FF9.toInt()
                              else -> col.text
                          }
                      )
                  }
                  if (v is ImageButton) v.setColorFilter(col.text)
                  if (v is ViewGroup) {
                      for (i in 0 until v.childCount) themeTree(v.getChildAt(i))
                  }
              }

              private fun updateSettingsUi() {
                  val folder = prefs.getString("folder", "") ?: ""
                  findViewById<TextView>(R.id.folderVal).text =
                      if (folder.isEmpty()) "Downloads (default)" else (Uri.parse(folder).lastPathSegment ?: folder)
                  findViewById<TextView>(R.id.themeVal).text =
                      when (theme) { 1 -> "Light (day)"; 2 -> "Dark (night)"; else -> "Auto (follow system)" }
                  findViewById<TextView>(R.id.orientVal).text =
                      when (orient) { 1 -> "Landscape"; 2 -> "Portrait"; else -> "Auto (follow phone)" }
                  findViewById<TextView>(R.id.desktopVal).text = if (desktop) "ON" else "OFF"
                  findViewById<TextView>(R.id.cookiesVal).text =
                      if (cookiesOn) "ON" else "OFF - turn ON if you see sign in / not a bot errors"
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (theme == 0) applyTheme()
                  if (newConfig.orientation != Configuration.ORIENTATION_LANDSCAPE) {
                      setBarsHidden(false)
                  }
                  if (tabsPage.visibility == View.VISIBLE) {
                      tabsGrid.numColumns = if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) 3 else 2
                      tabsAdapter.notifyDataSetChanged()
                  }
              }

              // ---------- JS bridge for direct MP3 clicks ----------

              inner class JsBridge(private val profile: String) {
                  @JavascriptInterface
                  fun onAudioLink(url: String, title: String) {
                      if (url.isBlank()) return
                      runOnUiThread {
                          val t = tabs.find { it.profile == profile }
                          val page = t?.web?.url ?: url
                          val ua = t?.web?.settings?.userAgentString ?: currentWebUa()
                          startDirectNamed(url, title, page, profile, "", true, ua)
                      }
                  }

                  @JavascriptInterface
                  fun setPendingName(title: String) {
                      val clean = sanitizeName(title)
                      if (!isJunkTitle(clean)) {
                          pendingClickName = clean
                          pendingClickTime = System.currentTimeMillis()
                      }
                  }
              }

              private fun injectSiteHelper(w: WebView?) {
                  if (w == null) return
                  val js = """
                  (function(){
                    if (window.__abhHooked) return;
                    window.__abhHooked = true;
                    function isAudioHref(h) {
                      if (!h) return false;
                      var p = h.split('#')[0].split('?')[0].toLowerCase();
                      return /\.(mp3|m4a|flac|wav|aac|ogg|opus)$/.test(p);
                    }
                    function isDlHref(h) {
                      if (!h) return false;
                      var l = h.toLowerCase();
                      return isAudioHref(h) || l.indexOf('download') >= 0 || l.indexOf('dl=') >= 0 || l.indexOf('file=') >= 0 || l.indexOf('/dl/') >= 0;
                    }
                    function isPlayElem(el) {
                      if (!el) return false;
                      var s = ((el.alt||'') + ' ' + (el.title||'') + ' ' + (el.className||'') + ' ' + (el.id||'') + ' ' + (el.src||'')).toLowerCase();
                      return s.indexOf('play') >= 0 && s.indexOf('down') < 0 && s.indexOf('dl') < 0;
                    }
                    function isJunkTxt(s) {
                      if (!s) return true;
                      var l = s.trim().toLowerCase();
                      if (l.length <= 2) return true;
                      if (/^(play|dl|download|save|add|mp3|song|track|audio|listen)$/.test(l)) return true;
                      if (/^[0-9]+(\.[0-9]+)?\s*(mb|kb|gb|kbps)?$/.test(l)) return true;
                      return false;
                    }
                    function normKey(s) {
                      return (s || '').toLowerCase().replace(/\.[a-z0-9]{2,4}$/, '').replace(/[^a-z0-9]/g, '');
                    }
                    function findSingleRow(el) {
                      var cur = el ? el.parentElement : null;
                      var depth = 0;
                      while (cur && depth < 6) {
                        var tag = (cur.tagName || '').toUpperCase();
                        if (tag === 'TR' || tag === 'LI' || tag === 'DIV' || tag === 'P') {
                          if (cur.querySelectorAll('a').length <= 6 && cur.querySelectorAll('tr').length <= 1) {
                            return cur;
                          }
                          return null;
                        }
                        cur = cur.parentElement;
                        depth++;
                      }
                      return null;
                    }
                    function inlineTitle(el) {
                      if (!el) return '';
                      var best = '';
                      var stopTags = {BR:1,TR:1,LI:1,DIV:1,P:1,HR:1,TABLE:1};
                      function scanDir(forward) {
                        var n = forward ? el.nextSibling : el.previousSibling;
                        var steps = 0;
                        while (n && steps < 10) {
                          if (n.nodeType === 1 && stopTags[n.tagName]) break;
                          var txt = (n.textContent || '').trim();
                          if (!isJunkTxt(txt) && txt.length > best.length) best = txt;
                          n = forward ? n.nextSibling : n.previousSibling;
                          steps++;
                        }
                      }
                      scanDir(true);
                      if (!best) scanDir(false);
                      return best;
                    }
                    function rowTitle(row, skipA, refEl) {
                      if (!row) return inlineTitle(refEl);
                      var best = '';
                      var as = row.querySelectorAll('a');
                      for (var i = 0; i < as.length; i++) {
                        if (as[i] === skipA) continue;
                        var txt = (as[i].innerText || as[i].textContent || '').trim();
                        if (!isJunkTxt(txt) && txt.length > best.length) best = txt;
                      }
                      if (best) return best;
                      var cells = row.querySelectorAll('td, th, span, font, b, strong, p, div');
                      for (var j = 0; j < cells.length; j++) {
                        var t = (cells[j].innerText || cells[j].textContent || '').trim();
                        if (!isJunkTxt(t) && t.length > best.length && t.indexOf('\n') < 0) best = t;
                      }
                      if (best) return best;
                      var parts = (row.innerText || row.textContent || '').split(/[\n\t]+/);
                      for (var k = 0; k < parts.length; k++) {
                        var p = parts[k].trim();
                        if (!isJunkTxt(p) && p.length > best.length) best = p;
                      }
                      return best;
                    }
                    function findRowDlLink(row, skipA) {
                      if (!row) return null;
                      var links = row.querySelectorAll('a[href]');
                      if (links.length === 0 || links.length > 6) return null;
                      for (var i = 0; i < links.length; i++) {
                        var sib = links[i];
                        if (sib === skipA) continue;
                        var img = sib.querySelector('img');
                        var imgHint = img ? ((img.src||'') + ' ' + (img.alt||'') + ' ' + (img.title||'')).toLowerCase() : '';
                        if (sib.href && (isDlHref(sib.href) || imgHint.indexOf('dl') >= 0 || imgHint.indexOf('down') >= 0 || imgHint.indexOf('save') >= 0)) {
                          return sib;
                        }
                      }
                      return null;
                    }
                    function findMp3InAttr(el) {
                      if (!el) return '';
                      var attrs = ['data-src','data-url','data-file','data-mp3','data-audio','onclick'];
                      for (var i = 0; i < attrs.length; i++) {
                        var v = el.getAttribute(attrs[i]) || '';
                        var m = v.match(/https?:\/\/[^'"\s)]+\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\?[^'"\s)]*)?/i);
                        if (m) return m[0];
                        var m2 = v.match(/['"]([^'"]+\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\?[^'"]*)?)['"]/i);
                        if (m2) {
                          try { return new URL(m2[1], location.href).href; } catch(e) {}
                        }
                      }
                      return '';
                    }
                    function findUrlInEl(el) {
                      if (!el) return '';
                      var a = el.closest ? el.closest('a[href]') : null;
                      if (a && a.href && a.href.indexOf('http') === 0) return a.href;
                      var oc = el.getAttribute ? (el.getAttribute('onclick') || '') : '';
                      if (!oc && el.parentElement) oc = el.parentElement.getAttribute('onclick') || '';
                      var m = oc.match(/['"]((?:https?:\/\/|\/|\?)[^'"]+)['"]/);
                      if (m) {
                        try { return new URL(m[1], location.href).href; } catch(e) {}
                      }
                      return '';
                    }
                    function findAudioOnPageByTitle(title) {
                      var key = normKey(title);
                      if (!key || key.length < 3) return '';
                      var as = document.querySelectorAll('a[href]');
                      for (var i = 0; i < as.length; i++) {
                        var h = as[i].href;
                        if (!isAudioHref(h)) continue;
                        var seg = decodeURIComponent(h.split('#')[0].split('?')[0].split('/').pop() || '');
                        var fk = normKey(seg);
                        if (fk && (fk === key || fk.indexOf(key) >= 0 || key.indexOf(fk) >= 0)) return h;
                      }
                      var re = /['"]([^'"\s<>]+\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\?[^'"\s<>]*)?)['"]/ig;
                      var scripts = document.scripts;
                      for (var s = 0; s < scripts.length; s++) {
                        var txt = scripts[s].textContent || '';
                        if (txt.length > 300000) continue;
                        re.lastIndex = 0;
                        var m;
                        while ((m = re.exec(txt)) !== null) {
                          var raw = m[1];
                          var seg2 = decodeURIComponent(raw.split('#')[0].split('?')[0].split('/').pop() || '');
                          var fk2 = normKey(seg2);
                          if (fk2 && (fk2 === key || fk2.indexOf(key) >= 0 || key.indexOf(fk2) >= 0)) {
                            try { return new URL(raw, location.href).href; } catch(e) {}
                          }
                        }
                      }
                      return '';
                    }
                    document.addEventListener('touchstart', function(e) {
                      var t = e.target;
                      var a = t && t.closest ? t.closest('a') : null;
                      var row = findSingleRow(a || t);
                      var u = (a && a.href && a.href.indexOf('http') === 0) ? a.href : findUrlInEl(t);
                      var txt = a ? (a.innerText || a.textContent || a.title || '').trim() : '';
                      if (isJunkTxt(txt)) txt = rowTitle(row, a, a || t);
                      window.__abhLastUrl = u || '';
                      window.__abhLastText = txt || '';
                    }, true);
                    document.addEventListener('click', function(e) {
                      var t = e.target;
                      if (!t || !t.closest) return;
                      var a = t.closest('a');
                      var row = findSingleRow(a || t);
                      var dlSibInRow = row ? findRowDlLink(row, a) : null;
                      if (dlSibInRow && (isPlayElem(t) || (a && isPlayElem(a)))) return;
                      if (a && a.href) {
                        var txt = (a.innerText || a.textContent || a.title || '').trim();
                        var rowName = !isJunkTxt(txt) ? txt : rowTitle(row, a, a);
                        if (isAudioHref(a.href)) {
                          e.preventDefault();
                          e.stopPropagation();
                          ABH.onAudioLink(a.href, rowName);
                          return;
                        }
                        var embedded = findMp3InAttr(a) || findMp3InAttr(t);
                        if (embedded) {
                          e.preventDefault();
                          e.stopPropagation();
                          ABH.onAudioLink(embedded, rowName);
                          return;
                        }
                        var hrefL = (a.getAttribute('href') || '').trim().toLowerCase();
                        var isScriptOrHash = !hrefL || hrefL === '#' || hrefL.indexOf('javascript:') === 0 || hrefL.indexOf('play') >= 0;
                        if (dlSibInRow && (isScriptOrHash || row.querySelector('img[src*="play" i], img[alt*="play" i]') || isAudioHref(dlSibInRow.href))) {
                          e.preventDefault();
                          e.stopPropagation();
                          ABH.onAudioLink(dlSibInRow.href, rowName);
                          return;
                        }
                        if (isScriptOrHash && !isJunkTxt(rowName)) {
                          var matched = findAudioOnPageByTitle(rowName);
                          if (matched) {
                            e.preventDefault();
                            e.stopPropagation();
                            ABH.onAudioLink(matched, rowName);
                            return;
                          }
                        }
                        if (rowName) ABH.setPendingName(rowName);
                      } else {
                        var mp3 = findMp3InAttr(t) || (row ? findMp3InAttr(row) : '');
                        if (mp3) {
                          e.preventDefault();
                          e.stopPropagation();
                          var name2 = (t.innerText || t.textContent || '').trim();
                          ABH.onAudioLink(mp3, !isJunkTxt(name2) ? name2 : rowTitle(row, null, t));
                          return;
                        }
                        var clickedTxt = (t.innerText || t.textContent || '').trim();
                        if (!isJunkTxt(clickedTxt)) {
                          if (dlSibInRow && (row.querySelector('img[src*="play" i], img[alt*="play" i]') || isAudioHref(dlSibInRow.href))) {
                            e.preventDefault();
                            e.stopPropagation();
                            ABH.onAudioLink(dlSibInRow.href, rowTitle(row, null, t) || clickedTxt);
                            return;
                          }
                          var matched2 = findAudioOnPageByTitle(clickedTxt);
                          if (matched2) {
                            e.preventDefault();
                            e.stopPropagation();
                            ABH.onAudioLink(matched2, clickedTxt);
                          }
                        }
                      }
                    }, true);
                  })();
                  """.trimIndent()
                  w.evaluateJavascript(js, null)
              }

              // ---------- tabs & web ----------

              private fun applyWeb(w: WebView) {
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.userAgentString = if (desktop) DESKTOP_UA else null
                  s.useWideViewPort = desktop
                  s.loadWithOverviewMode = desktop
                  s.setSupportZoom(true)
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  if (Build.VERSION.SDK_INT >= 33) {
                      s.isAlgorithmicDarkeningAllowed = dark
                  } else {
                      s.forceDark = if (dark) WebSettings.FORCE_DARK_ON else WebSettings.FORCE_DARK_OFF
                  }
              }

              private fun toggleDesktop() {
                  desktop = !desktop
                  prefs.edit().putBoolean("desktop", desktop).apply()
                  for (t in tabs) applyWeb(t.web)
                  if (!tabs[cur].home) tabs[cur].web.reload()
                  updateSettingsUi()
                  toast(if (desktop) "Desktop mode ON" else "Desktop mode OFF")
              }

              @SuppressLint("SetJavaScriptEnabled", "ClickableViewAccessibility")
              // profile = null: brand new separate login space. profile = "": the shared default one.
              private fun newTab(profile: String? = null) {
                  val w = WebView(this)
                  var pname = profile ?: (if (multiProfile) "t" + System.currentTimeMillis() + tabs.size else "")
                  if (pname.isNotEmpty()) {
                      if (multiProfile) {
                          try { WebViewCompat.setProfile(w, pname) } catch (e: Exception) { pname = "" }
                      } else {
                          pname = ""
                      }
                  }
                  val pf = pname
                  applyWeb(w)
                  w.addJavascriptInterface(JsBridge(pf), "ABH")
                  var touchLastY = 0f
                  var scrollAcc = 0f
                  w.setOnTouchListener { _, ev ->
                      if (ev.pointerCount > 1) {
                          scrollAcc = 0f
                          return@setOnTouchListener false
                      }
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              touchLastY = ev.rawY
                              scrollAcc = 0f
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE &&
                                  tabs.getOrNull(cur)?.home == false
                              ) {
                                  val dy = ev.rawY - touchLastY
                                  touchLastY = ev.rawY
                                  if ((dy > 0 && scrollAcc < 0) || (dy < 0 && scrollAcc > 0)) scrollAcc = 0f
                                  scrollAcc += dy
                                  val now = System.currentTimeMillis()
                                  val thresh = dp(28).toFloat()
                                  if (now - lastBarToggle > 250) {
                                      if (scrollAcc < -thresh && !barsHidden) {
                                          setBarsHidden(true)
                                          scrollAcc = 0f
                                      } else if (scrollAcc > thresh && barsHidden) {
                                          setBarsHidden(false)
                                          scrollAcc = 0f
                                      }
                                  }
                              }
                          }
                      }
                      false
                  }
                  w.setOnLongClickListener {
                      val r = w.hitTestResult
                      val ex = r.extra
                      var vid = ""
                      val t = r.type
                      if (ex != null && ex.startsWith("http") &&
                          (t == WebView.HitTestResult.SRC_ANCHOR_TYPE || t == WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE ||
                              t == WebView.HitTestResult.IMAGE_TYPE)
                      ) {
                          if (isYt(ex)) vid = ytId(ex)
                          if (vid.isEmpty()) {
                              val m = Regex("/(?:vi|vi_webp|an_webp)/([A-Za-z0-9_-]{11})/").find(ex)
                              if (m != null) vid = m.groupValues[1]
                          }
                      }
                      if (vid.isNotEmpty()) {
                          longPressVideo("https://www.youtube.com/watch?v=" + vid)
                          true
                      } else {
                          val infoJs = "(function(){var as=document.querySelectorAll('a[href]');var ls=[];" +
                              "for(var i=0;i<as.length;i++){var h=as[i].href;if(h&&h.indexOf('http')===0)ls.push(h.split('#')[0]);}" +
                              "return JSON.stringify({t:window.__abhLastText||'',u:window.__abhLastUrl||'',links:ls});})();"
                          val pageUrl = w.url ?: ""
                          val webUa = w.settings.userAgentString ?: MOBILE_UA
                          val hitUrl = if (ex != null && (ex.startsWith("http://") || ex.startsWith("https://"))) ex else ""
                          w.evaluateJavascript(infoJs) { raw ->
                              var linkText = ""
                              var jsUrl = ""
                              val pageLinks = HashSet<String>()
                              try {
                                  val jsStr = JSONTokener(raw).nextValue() as? String
                                  if (!jsStr.isNullOrEmpty()) {
                                      val o = JSONObject(jsStr)
                                      jsUrl = o.optString("u", "")
                                      if (hitUrl.isEmpty() || jsUrl.isEmpty() || normUrl(jsUrl) == normUrl(hitUrl)) {
                                          linkText = o.optString("t", "")
                                      }
                                      val arr = o.optJSONArray("links")
                                      if (arr != null) {
                                          for (i in 0 until arr.length()) pageLinks.add(normUrl(arr.getString(i)))
                                      }
                                  }
                              } catch (e: Exception) { }
                              val targetUrl = hitUrl.ifEmpty { if (jsUrl.startsWith("http")) jsUrl else "" }
                              if (targetUrl.isNotEmpty()) {
                                  handleLongPressLink(targetUrl, linkText, pageUrl, pageLinks, pf, webUa)
                              }
                          }
                          hitUrl.isNotEmpty()
                      }
                  }
                  w.setDownloadListener { url, userAgent, contentDisposition, mimetype, _ ->
                      startDirect(url, userAgent, contentDisposition, mimetype, w.url ?: url, pf)
                  }
                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val u = request?.url?.toString() ?: return false
                          if (isAudioUrl(u)) {
                              val titleHint = if (System.currentTimeMillis() - pendingClickTime < 5000) pendingClickName else ""
                              val ua = view?.settings?.userAgentString ?: currentWebUa()
                              startDirectNamed(u, titleHint, view?.url ?: u, pf, "", true, ua)
                              return true
                          }
                          return false
                      }

                      override fun doUpdateVisitedHistory(view: WebView?, url: String?, isReload: Boolean) {
                          if (view != null && tabs.getOrNull(cur)?.web == view && url != null) urlBox.setText(url)
                          forceDesktopViewport(view)
                          injectSiteHelper(view)
                      }

                      override fun onPageCommitVisible(view: WebView?, url: String?) {
                          forceDesktopViewport(view)
                          injectSiteHelper(view)
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          forceDesktopViewport(view)
                          injectSiteHelper(view)
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View?, callback: WebChromeClient.CustomViewCallback?) {
                          if (view == null) return
                          customView = view
                          customCb = callback
                          (window.decorView as FrameLayout).addView(
                              view, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                          )
                          window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      }

                      override fun onHideCustomView() { hideCustom() }

                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          if (view != null && tabs.getOrNull(cur)?.web == view) {
                              pageBar.progress = newProgress
                              pageBar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
                          }
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: WebChromeClient.FileChooserParams?
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = filePathCallback
                          return try {
                              startActivityForResult(fileChooserParams!!.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }
                  val tab = Tab(w)
                  tab.profile = pf
                  tabs.add(tab)
              }

              private fun forceDesktopViewport(w: WebView?) {
                  if (!desktop || w == null) return
                  val js = "(function(){" +
                      "function fix(){var ms=document.querySelectorAll('meta[name=viewport]');var m=ms[0];" +
                      "if(!m){m=document.createElement('meta');m.setAttribute('name','viewport');(document.head||document.documentElement).appendChild(m);}" +
                      "for(var i=1;i<ms.length;i++){ms[i].parentNode.removeChild(ms[i]);}" +
                      "if(m.getAttribute('content')!=='width=1024')m.setAttribute('content','width=1024');}" +
                      "fix();" +
                      "if(!window.__abhDesk){window.__abhDesk=1;new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['content','name']});}" +
                      "})();"
                  w.evaluateJavascript(js, null)
              }

              private fun hideCustom() {
                  val v = customView ?: return
                  (window.decorView as FrameLayout).removeView(v)
                  customCb?.onCustomViewHidden()
                  customView = null
                  customCb = null
                  bars()
              }

              private fun captureThumb(t: Tab) {
                  if (t.home) return
                  val v = t.web
                  if (v.width <= 0 || v.height <= 0) return
                  try {
                      val targetW = 360
                      val scale = targetW.toFloat() / v.width.toFloat()
                      val targetH = (v.height * scale).toInt().coerceIn(120, 640)
                      val bmp = Bitmap.createBitmap(targetW, targetH, Bitmap.Config.RGB_565)
                      val c = Canvas(bmp)
                      c.scale(scale, scale)
                      v.draw(c)
                      t.thumb = bmp
                  } catch (e: Exception) { }
              }

              private fun showTab(i: Int) {
                  if (cur != i && cur in tabs.indices) captureThumb(tabs[cur])
                  cur = i
                  for (j in content.childCount - 1 downTo 0) {
                      if (content.getChildAt(j) is WebView) content.removeViewAt(j)
                  }
                  content.addView(
                      tabs[i].web, 0,
                      FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  )
                  refresh()
              }

              private fun refresh() {
                  val t = tabs[cur]
                  home.visibility = if (t.home) View.VISIBLE else View.GONE
                  urlBox.setText(if (t.home) "" else (t.web.url ?: ""))
                  tabCount.text = tabs.size.toString()
                  val pr = t.web.progress
                  pageBar.progress = pr
                  pageBar.visibility = if (!t.home && pr in 1..99) View.VISIBLE else View.GONE
                  setBarsHidden(false)
                  updateFab()
              }

              private fun open(raw: String) {
                  val s = raw.trim()
                  if (s.isEmpty()) return
                  val url = when {
                      s.startsWith("http://") || s.startsWith("https://") -> s
                      !s.contains(" ") && s.contains(".") -> "https://$s"
                      else -> "https://www.google.com/search?q=" + Uri.encode(s)
                  }
                  val t = tabs[cur]
                  t.home = false
                  t.web.loadUrl(url)
                  refresh()
                  urlBox.setText(url)
              }

              private fun showTabs() {
                  if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
                  tabsGrid.numColumns = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) 3 else 2
                  findViewById<TextView>(R.id.tabsTitle).text = "Tabs (${tabs.size})"
                  tabsAdapter.notifyDataSetChanged()
                  showPage(tabsPage)
              }

              private fun closeTab(pos: Int) {
                  if (pos !in tabs.indices) return
                  if (tabs.size > 1) {
                      val removed = tabs.removeAt(pos)
                      content.removeView(removed.web)
                      removed.web.destroy()
                      deleteProfileLater(removed.profile)
                      val next = when {
                          cur == pos -> minOf(pos, tabs.size - 1)
                          cur > pos -> cur - 1
                          else -> cur
                      }
                      if (cur == pos) cur = -1
                      showTab(next)
                  } else {
                      tabs[0].home = true
                      tabs[0].thumb = null
                      refresh()
                      hidePages()
                      return
                  }
                  findViewById<TextView>(R.id.tabsTitle).text = "Tabs (${tabs.size})"
                  tabsAdapter.notifyDataSetChanged()
              }

