                      override fun onReceivedTitle(v: WebView?, t: String?) { tabs.find { it.webView == v }?.let { if (!t.isNullOrBlank()) it.title = t } }
                      override fun onShowCustomView(v: View?, cb: CustomViewCallback?) {
