          import kotlin.math.abs

          class Pal(val bg: Int, val pill: Int, val card: Int, val text: Int, val sec: Int, val stroke: Int)

          val DARK = Pal(0xFF121214.toInt(), 0xFF3C3C42.toInt(), 0xFF232328.toInt(), 0xFFFFFFFF.toInt(), 0xFF9AA0A6.toInt(), 0xFF8A8A90.toInt())
          val LIGHT = Pal(0xFFFFFFFF.toInt(), 0xFFECEDF1.toInt(), 0xFFF1F3F4.toInt(), 0xFF1B1B1F.toInt(), 0xFF5F6368.toInt(), 0xFF7A7A80.toInt())
          const val DESKTOP_UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          const val REQ_FILE = 77
          const val REQ_TREE = 78

          class Tab(val web: WebView) {
              var home = true
              var profile = ""   // separate cookie/login storage for this tab (empty = shared default)
              var thumb: Bitmap? = null
          }

          class DlItem(var title: String, var state: Int, var progress: Int, var uri: String?, var mime: String?, var msg: String) {
              var name: String = ""
              var id: String = System.nanoTime().toString()
              var kind = 0            // 0 = yt-dlp (video/audio), 1 = direct file link
              var link = ""
              var page = ""
              var audio = false
              var fmt = ""
              var ua: String? = null
              var total = 0L
              var done = 0L
              var sizeLabel = ""
              @Volatile var stop = 0  // 1 = pause, 2 = cancel/delete
              @Volatile var gen = 0
              var vid = ""
              var qkey = ""
              var qtag = ""
              var profile = ""   // tab profile whose cookies this download may use
          }

          class Q(val label: String, val fmt: String, val audio: Boolean, val bytes: Long, val key: String, val tag: String)

          val SIZE_RE = Regex("([0-9.]+)%\\s+of\\s+~?\\s*([0-9.]+\\s*[KMGT]?i?B)")

          class MainActivity : Activity() {

              private val tabs = mutableListOf<Tab>()
              private val items = mutableListOf<DlItem>()
              private var cur = 0
              private var dlTab = 0
              @Volatile private var qPid = ""
              private var ready = false
              private var desktop = false
              private var theme = 0
              private var orient = 0
              private var cookiesOn = false
              private var col = DARK
              private var barsHidden = false
              private var lastBarToggle = 0L
              private var customView: View? = null
              private var customCb: WebChromeClient.CustomViewCallback? = null
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private val exec = Executors.newSingleThreadExecutor()
              private val prefs by lazy { getSharedPreferences("s", MODE_PRIVATE) }

              private lateinit var topBar: View
              private lateinit var bottomBar: View
              private lateinit var urlBox: EditText
              private lateinit var homeSearch: EditText
              private lateinit var content: FrameLayout
              private lateinit var home: View
              private lateinit var tabCount: TextView
              private lateinit var fab: View
              private lateinit var pageBar: ProgressBar
              private lateinit var dlPage: View
              private lateinit var setPage: View
              private lateinit var tabsPage: View
              private lateinit var dlList: ListView
              private lateinit var dlAdapter: DlAdapter
              private lateinit var tabsGrid: GridView
              private lateinit var tabsAdapter: TabsAdapter

              private val dark: Boolean
                  get() = when (theme) {
                      1 -> false
                      2 -> true
                      else -> (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  topBar = findViewById(R.id.topBar)
                  bottomBar = findViewById(R.id.bottomBar)
                  urlBox = findViewById(R.id.url)
                  homeSearch = findViewById(R.id.homeSearch)
                  content = findViewById(R.id.content)
                  home = findViewById(R.id.home)
                  tabCount = findViewById(R.id.tabCount)
                  fab = findViewById(R.id.fab)
                  pageBar = findViewById(R.id.pageBar)
                  dlPage = findViewById(R.id.dlPage)
                  setPage = findViewById(R.id.setPage)
                  tabsPage = findViewById(R.id.tabsPage)
                  dlList = findViewById(R.id.dlList)
                  tabsGrid = findViewById(R.id.tabsGrid)

                  theme = prefs.getInt("theme", 0)
                  orient = prefs.getInt("orient", 0)
                  desktop = prefs.getBoolean("desktop", false)
                  cookiesOn = prefs.getBoolean("cookies", false)
                  loadItems()

                  dlAdapter = DlAdapter()
                  dlList.adapter = dlAdapter
                  dlList.emptyView = findViewById(R.id.dlEmpty)
                  dlList.setOnItemClickListener { _, _, p, _ ->
                      val d = shown().getOrNull(p)
                      if (d != null && d.state == 2) openFile(d)
                  }

                  tabsAdapter = TabsAdapter()
                  tabsGrid.adapter = tabsAdapter

                  val goAction = TextView.OnEditorActionListener { v, _, _ ->
                      open(v.text.toString())
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                          .hideSoftInputFromWindow(v.windowToken, 0)
                      v.clearFocus()
                      true
                  }
                  urlBox.setOnEditorActionListener(goAction)
                  homeSearch.setOnEditorActionListener(goAction)

                  click(R.id.qGoogle) { open("https://www.google.com") }
                  click(R.id.qYouTube) { open("https://m.youtube.com") }
                  click(R.id.qWiki) { open("https://www.wikipedia.org") }
                  click(R.id.qGit) { open("https://github.com") }

                  click(R.id.reload) { if (!tabs[cur].home) tabs[cur].web.reload() }
                  click(R.id.star) { addBookmark() }
                  click(R.id.bDl) { showPage(dlPage) }
                  click(R.id.tabActive) { dlTab = 0; refreshDl() }
                  click(R.id.tabDone) { dlTab = 1; refreshDl() }
                  click(R.id.dlBack) { hidePages() }
                  click(R.id.setBack) { hidePages() }
                  click(R.id.tabsBack) { hidePages() }
                  click(R.id.tabsAdd) {
                      if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
                      newTab()
                      showTab(tabs.size - 1)
                      hidePages()
                  }

                  click(R.id.bBack) { onBackPressed() }
                  click(R.id.bFwd) {
                      val t = tabs[cur]
                      if (t.home && t.web.url != null) { t.home = false; refresh() }
                      else if (t.web.canGoForward()) t.web.goForward()
                  }
                  click(R.id.bHome) { tabs[cur].home = true; refresh() }
                  click(R.id.bAdd) {
                      if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
                      newTab()
                      showTab(tabs.size - 1)
                  }
                  click(R.id.bTabs) { showTabs() }
                  click(R.id.bMenu) { showMenu(it) }

                  click(R.id.rowFolder) { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT_TREE), REQ_TREE) }
                  click(R.id.rowFolderReset) {
                      prefs.edit().remove("folder").apply()
                      updateSettingsUi()
                      toast("Using default Downloads folder")
                  }
                  click(R.id.rowTheme) {
                      dlg().setTitle("Theme")
                          .setSingleChoiceItems(arrayOf("Auto (follow system)", "Light (day)", "Dark (night)"), theme) { dialog, i ->
                              theme = i
                              prefs.edit().putInt("theme", i).apply()
                              dialog.dismiss()
                              applyTheme()
                          }
                          .show()
                  }
                  click(R.id.rowOrientation) {
                      dlg().setTitle("Screen orientation")
                          .setSingleChoiceItems(arrayOf("Auto (follow phone)", "Landscape", "Portrait"), orient) { dialog, i ->
                              orient = i
                              prefs.edit().putInt("orient", i).apply()
                              dialog.dismiss()
                              applyOrientation()
                          }
                          .show()
                  }
                  click(R.id.rowDesktop) { toggleDesktop() }
                  click(R.id.rowCookies) {
                      cookiesOn = !cookiesOn
                      prefs.edit().putBoolean("cookies", cookiesOn).apply()
                      updateSettingsUi()
                  }
                  click(R.id.rowUpdate) {
                      toast("Updating downloader engine...")
                      Thread { updateEngine(true) }.start()
                  }

                  setupFab()
                  restoreTabs()
                  cleanupProfiles()
                  if (!multiProfile && !prefs.getBoolean("mpWarned", false)) {
                      prefs.edit().putBoolean("mpWarned", true).apply()
                      toast("Separate logins per tab need a newer Android System WebView. Update it in Play Store.")
                  }
                  applyOrientation()
                  applyTheme()

                  if (intent?.action == Intent.ACTION_SEND) {
                      val txt = intent.getStringExtra(Intent.EXTRA_TEXT) ?: ""
                      val m = Regex("https?://\\S+").find(txt)
                      open(m?.value ?: txt)
                  }

                  Thread {
                      try {
                          YoutubeDL.getInstance().init(application)
                          FFmpeg.getInstance().init(application)
                          ready = true
                      } catch (e: Exception) {
                          runOnUiThread { toast("Downloader init failed: ${e.message}") }
                      }
                      if (ready) updateEngine(false)
                  }.start()
              }

              // ---------- helpers ----------

              private fun click(id: Int, f: (View) -> Unit) {
                  findViewById<View>(id).setOnClickListener { f(it) }
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              private fun dlg() = AlertDialog.Builder(
                  this,
                  if (dark) android.R.style.Theme_Material_Dialog_Alert else android.R.style.Theme_Material_Light_Dialog_Alert
              )

              private fun shape(fill: Int, r: Int, stroke: Int = 0, sw: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dp(r).toFloat()
                  if (sw > 0) g.setStroke(sw, stroke)
                  return g
              }

              // ---------- orientation & landscape scroll bars ----------

              private fun applyOrientation() {
                  requestedOrientation = when (orient) {
                      1 -> ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      2 -> ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      else -> ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  }
                  updateSettingsUi()
              }

              private fun setBarsHidden(hide: Boolean) {
                  val wantHide = hide &&
                      resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE &&
                      tabs.getOrNull(cur)?.home == false &&
                      dlPage.visibility != View.VISIBLE &&
                      setPage.visibility != View.VISIBLE &&
                      tabsPage.visibility != View.VISIBLE
                  if (barsHidden == wantHide) return
                  barsHidden = wantHide
                  val vis = if (wantHide) View.GONE else View.VISIBLE
                  topBar.visibility = vis
                  bottomBar.visibility = vis
                  lastBarToggle = System.currentTimeMillis()
              }

              // ---------- theme ----------

              private fun applyTheme() {
                  col = if (dark) DARK else LIGHT
                  themeTree(findViewById(R.id.root))
                  window.statusBarColor = col.bg
                  window.navigationBarColor = col.bg
                  bars()
                  for (t in tabs) applyWeb(t.web)
                  refreshDl()
                  if (tabsPage.visibility == View.VISIBLE) tabsAdapter.notifyDataSetChanged()
                  updateSettingsUi()
              }

              private fun bars() {
                  var f = View.SYSTEM_UI_FLAG_VISIBLE
                  if (!dark) f = f or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  window.decorView.systemUiVisibility = f
              }

              private fun themeTree(v: View) {
                  val tag = v.tag as? String
                  when (tag) {
                      "bg" -> v.setBackgroundColor(col.bg)
                      "pill" -> v.background = shape(col.pill, 24)
                      "card" -> v.background = shape(col.card, 24)
                      "outline" -> v.background = shape(Color.TRANSPARENT, 28, col.stroke, dp(1))
                      "tab" -> v.background = shape(Color.TRANSPARENT, 6, col.text, dp(2))
                  }
                  if (v is EditText) {
                      v.setTextColor(col.text)
                      v.setHintTextColor(col.sec)
                  } else if (v is TextView && tag != "logo") {
                      v.setTextColor(if (tag == "sec") col.sec else col.text)
                  }
                  if (v is ImageButton) v.setColorFilter(col.text)
                  if (v is ViewGroup) {
                      for (i in 0 until v.childCount) themeTree(v.getChildAt(i))
                  }
              }

              private fun updateSettingsUi() {
                  val folder = prefs.getString("folder", "") ?: ""
                  findViewById<TextView>(R.id.folderVal).text =
                      if (folder.isEmpty()) "Downloads (default)" else (Uri.parse(folder).lastPathSegment ?: folder)
                  findViewById<TextView>(R.id.themeVal).text =
                      when (theme) { 1 -> "Light (day)"; 2 -> "Dark (night)"; else -> "Auto (follow system)" }
                  findViewById<TextView>(R.id.orientVal).text =
                      when (orient) { 1 -> "Landscape"; 2 -> "Portrait"; else -> "Auto (follow phone)" }
                  findViewById<TextView>(R.id.desktopVal).text = if (desktop) "ON" else "OFF"
                  findViewById<TextView>(R.id.cookiesVal).text =
                      if (cookiesOn) "ON" else "OFF - turn ON if you see sign in / not a bot errors"
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (theme == 0) applyTheme()
                  if (newConfig.orientation != Configuration.ORIENTATION_LANDSCAPE) {
                      setBarsHidden(false)
                  }
                  if (tabsPage.visibility == View.VISIBLE) {
                      tabsGrid.numColumns = if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) 3 else 2
                      tabsAdapter.notifyDataSetChanged()
                  }
              }

              // ---------- tabs & web ----------

              private fun applyWeb(w: WebView) {
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.userAgentString = if (desktop) DESKTOP_UA else null
                  s.useWideViewPort = desktop
                  s.loadWithOverviewMode = desktop
                  s.setSupportZoom(true)
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  if (Build.VERSION.SDK_INT >= 33) {
                      s.isAlgorithmicDarkeningAllowed = dark
                  } else {
                      s.forceDark = if (dark) WebSettings.FORCE_DARK_ON else WebSettings.FORCE_DARK_OFF
                  }
              }

              private fun toggleDesktop() {
                  desktop = !desktop
                  prefs.edit().putBoolean("desktop", desktop).apply()
                  for (t in tabs) applyWeb(t.web)
                  if (!tabs[cur].home) tabs[cur].web.reload()
                  updateSettingsUi()
                  toast(if (desktop) "Desktop mode ON" else "Desktop mode OFF")
              }

              @SuppressLint("SetJavaScriptEnabled", "ClickableViewAccessibility")
              // profile = null: brand new separate login space. profile = "": the shared default one.
              private fun newTab(profile: String? = null) {
                  val w = WebView(this)
                  var pname = profile ?: (if (multiProfile) "t" + System.currentTimeMillis() + tabs.size else "")
                  if (pname.isNotEmpty()) {
                      if (multiProfile) {
                          try { WebViewCompat.setProfile(w, pname) } catch (e: Exception) { pname = "" }
                      } else {
                          pname = ""
                      }
                  }
                  val pf = pname
                  applyWeb(w)
                  var touchLastY = 0f
                  var scrollAcc = 0f
                  w.setOnTouchListener { _, ev ->
                      if (ev.pointerCount > 1) {
                          scrollAcc = 0f
                          return@setOnTouchListener false
                      }
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              touchLastY = ev.rawY
                              scrollAcc = 0f
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE &&
                                  tabs.getOrNull(cur)?.home == false
                              ) {
                                  val dy = ev.rawY - touchLastY
                                  touchLastY = ev.rawY
                                  if ((dy > 0 && scrollAcc < 0) || (dy < 0 && scrollAcc > 0)) scrollAcc = 0f
                                  scrollAcc += dy
                                  val now = System.currentTimeMillis()
                                  val thresh = dp(28).toFloat()
                                  if (now - lastBarToggle > 250) {
                                      if (scrollAcc < -thresh && !barsHidden) {
                                          setBarsHidden(true)
                                          scrollAcc = 0f
                                      } else if (scrollAcc > thresh && barsHidden) {
                                          setBarsHidden(false)
                                          scrollAcc = 0f
                                      }
                                  }
                              }
                          }
                      }
                      false
                  }
                  w.setOnLongClickListener {
                      val r = w.hitTestResult
                      val ex = r.extra
                      var vid = ""
                      val t = r.type
                      if (ex != null && ex.startsWith("http") &&
                          (t == WebView.HitTestResult.SRC_ANCHOR_TYPE || t == WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE ||
                              t == WebView.HitTestResult.IMAGE_TYPE)
                      ) {
                          // A link to a video, or (for a thumbnail) the thumbnail picture address, which contains the video id.
                          if (isYt(ex)) vid = ytId(ex)
                          if (vid.isEmpty()) {
                              val m = Regex("/(?:vi|vi_webp|an_webp)/([A-Za-z0-9_-]{11})/").find(ex)
                              if (m != null) vid = m.groupValues[1]
                          }
                      }
                      if (vid.isNotEmpty()) {
                          longPressVideo("https://www.youtube.com/watch?v=" + vid)
                          true
                      } else {
                          false
                      }
                  }
                  w.setDownloadListener { url, userAgent, contentDisposition, mimetype, _ ->
                      startDirect(url, userAgent, contentDisposition, mimetype, w.url ?: url, pf)
                  }
                  w.webViewClient = object : WebViewClient() {
                      override fun doUpdateVisitedHistory(view: WebView?, url: String?, isReload: Boolean) {
                          if (view != null && tabs.getOrNull(cur)?.web == view && url != null) urlBox.setText(url)
                          forceDesktopViewport(view)
                      }

                      override fun onPageCommitVisible(view: WebView?, url: String?) {
                          forceDesktopViewport(view)
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          forceDesktopViewport(view)
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View?, callback: WebChromeClient.CustomViewCallback?) {
                          if (view == null) return
                          customView = view
                          customCb = callback
                          (window.decorView as FrameLayout).addView(
                              view, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                          )
                          window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      }

                      override fun onHideCustomView() { hideCustom() }

                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          if (view != null && tabs.getOrNull(cur)?.web == view) {
                              pageBar.progress = newProgress
                              pageBar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
                          }
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: WebChromeClient.FileChooserParams?
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = filePathCallback
                          return try {
                              startActivityForResult(fileChooserParams!!.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }
                  val tab = Tab(w)
                  tab.profile = pf
                  tabs.add(tab)
              }

              private fun forceDesktopViewport(w: WebView?) {
                  if (!desktop || w == null) return
                  val js = "(function(){" +
                      "function fix(){var ms=document.querySelectorAll('meta[name=viewport]');var m=ms[0];" +
                      "if(!m){m=document.createElement('meta');m.setAttribute('name','viewport');(document.head||document.documentElement).appendChild(m);}" +
                      "for(var i=1;i<ms.length;i++){ms[i].parentNode.removeChild(ms[i]);}" +
                      "if(m.getAttribute('content')!=='width=1024')m.setAttribute('content','width=1024');}" +
                      "fix();" +
                      "if(!window.__abhDesk){window.__abhDesk=1;new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['content','name']});}" +
                      "})();"
                  w.evaluateJavascript(js, null)
              }

              private fun hideCustom() {
                  val v = customView ?: return
                  (window.decorView as FrameLayout).removeView(v)
                  customCb?.onCustomViewHidden()
                  customView = null
                  customCb = null
                  bars()
              }

              private fun captureThumb(t: Tab) {
                  if (t.home) return
                  val v = t.web
                  if (v.width <= 0 || v.height <= 0) return
                  try {
                      val targetW = 360
                      val scale = targetW.toFloat() / v.width.toFloat()
                      val targetH = (v.height * scale).toInt().coerceIn(120, 640)
                      val bmp = Bitmap.createBitmap(targetW, targetH, Bitmap.Config.RGB_565)
                      val c = Canvas(bmp)
                      c.scale(scale, scale)
                      v.draw(c)
                      t.thumb = bmp
                  } catch (e: Exception) { }
              }

              private fun showTab(i: Int) {
                  if (cur != i && cur in tabs.indices) captureThumb(tabs[cur])
                  cur = i
                  for (j in content.childCount - 1 downTo 0) {
                      if (content.getChildAt(j) is WebView) content.removeViewAt(j)
                  }
                  content.addView(
                      tabs[i].web, 0,
                      FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  )
                  refresh()
              }

              private fun refresh() {
                  val t = tabs[cur]
                  home.visibility = if (t.home) View.VISIBLE else View.GONE
                  urlBox.setText(if (t.home) "" else (t.web.url ?: ""))
                  tabCount.text = tabs.size.toString()
                  val pr = t.web.progress
                  pageBar.progress = pr
                  pageBar.visibility = if (!t.home && pr in 1..99) View.VISIBLE else View.GONE
                  setBarsHidden(false)
                  updateFab()
              }

              private fun open(raw: String) {
                  val s = raw.trim()
                  if (s.isEmpty()) return
                  val url = when {
                      s.startsWith("http://") || s.startsWith("https://") -> s
                      !s.contains(" ") && s.contains(".") -> "https://$s"
                      else -> "https://www.google.com/search?q=" + Uri.encode(s)
                  }
                  val t = tabs[cur]
                  t.home = false
                  t.web.loadUrl(url)
                  refresh()
                  urlBox.setText(url)
              }

              private fun showTabs() {
                  if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
                  tabsGrid.numColumns = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) 3 else 2
                  findViewById<TextView>(R.id.tabsTitle).text = "Tabs (${tabs.size})"
                  tabsAdapter.notifyDataSetChanged()
                  showPage(tabsPage)
              }

              private fun closeTab(pos: Int) {
                  if (pos !in tabs.indices) return
                  if (tabs.size > 1) {
                      val removed = tabs.removeAt(pos)
                      content.removeView(removed.web)
                      removed.web.destroy()
                      deleteProfileLater(removed.profile)
                      val next = when {
                          cur == pos -> minOf(pos, tabs.size - 1)
                          cur > pos -> cur - 1
                          else -> cur
                      }
                      showTab(next)
                  } else {
                      tabs[0].home = true
                      tabs[0].thumb = null
                      refresh()
                      hidePages()
                      return
                  }
                  findViewById<TextView>(R.id.tabsTitle).text = "Tabs (${tabs.size})"
                  tabsAdapter.notifyDataSetChanged()
              }

              inner class TabsAdapter : BaseAdapter() {
                  override fun getCount() = tabs.size
                  override fun getItem(position: Int): Any = tabs[position]
                  override fun getItemId(position: Int) = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val t = tabs[position]
                      val isCur = position == cur
                      val card = LinearLayout(this@MainActivity)
                      card.orientation = LinearLayout.VERTICAL
                      card.background = shape(
                          col.card, 14,
                          if (isCur) 0xFF2D7FF9.toInt() else col.stroke,
                          if (isCur) dp(2) else dp(1)
                      )
                      card.setPadding(dp(2), dp(2), dp(2), dp(2))

                      val header = LinearLayout(this@MainActivity)
                      header.orientation = LinearLayout.HORIZONTAL
                      header.gravity = Gravity.CENTER_VERTICAL
                      header.setPadding(dp(10), dp(4), dp(4), dp(4))

                      val title = TextView(this@MainActivity)
                      title.layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      title.text = if (t.home) "Home" else (t.web.title?.takeIf { it.isNotBlank() } ?: t.web.url ?: "Tab")
                      title.textSize = 13f
                      title.maxLines = 1
                      title.ellipsize = TextUtils.TruncateAt.END
                      title.setTextColor(col.text)
                      if (isCur) title.setTypeface(null, Typeface.BOLD)

                      val closeBtn = TextView(this@MainActivity)
                      closeBtn.text = "\u2715"
                      closeBtn.textSize = 14f
                      closeBtn.setTextColor(col.sec)
                      closeBtn.setPadding(dp(8), dp(4), dp(8), dp(4))
                      closeBtn.setOnClickListener { closeTab(position) }

                      header.addView(title)
                      header.addView(closeBtn)
                      card.addView(header)

                      val previewBox = FrameLayout(this@MainActivity)
                      val prevH = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) dp(125) else dp(165)
                      previewBox.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, prevH)
                      previewBox.background = shape(col.bg, 10)

                      val bmp = t.thumb
                      if (!t.home && bmp != null) {
                          val iv = ImageView(this@MainActivity)
                          iv.layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                          iv.scaleType = ImageView.ScaleType.CENTER_CROP
                          iv.setImageBitmap(bmp)
                          previewBox.addView(iv)
                      } else if (t.home) {
                          val iv = ImageView(this@MainActivity)
                          val lp = FrameLayout.LayoutParams(dp(56), dp(56))
                          lp.gravity = Gravity.CENTER
                          iv.layoutParams = lp
                          iv.setImageResource(R.drawable.ic_logo)
                          previewBox.addView(iv)
                      } else {
                          val tv = TextView(this@MainActivity)
                          val lp = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          lp.gravity = Gravity.CENTER
                          tv.layoutParams = lp
                          tv.setPadding(dp(12), dp(8), dp(12), dp(8))
                          tv.text = Uri.parse(t.web.url ?: "").host ?: "Tab"
                          tv.textSize = 13f
                          tv.setTextColor(col.sec)
                          previewBox.addView(tv)
                      }

                      card.addView(previewBox)
                      card.setOnClickListener {
                          showTab(position)
                          hidePages()
                      }
                      return card
                  }
              }

              // ---------- keep tabs when the app is closed / reopened ----------

              override fun onStop() {
                  super.onStop()
                  if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
                  saveTabs()
              }

              private fun saveTabs() {
                  try {
                      val dir = File(filesDir, "tabs")
                      dir.mkdirs()
                      dir.listFiles()?.forEach { it.delete() }
                      val arr = JSONArray()
                      for (i in 0 until tabs.size) {
                          val t = tabs[i]
                          val url = t.web.url ?: ""
                          arr.put(JSONObject().put("home", t.home).put("url", url).put("profile", t.profile))
                          if (url.isNotEmpty()) {
                              try {
                                  val b = Bundle()
                                  t.web.saveState(b)
                                  val p = Parcel.obtain()
                                  p.writeBundle(b)
                                  File(dir, "t" + i + ".bin").writeBytes(p.marshall())
                                  p.recycle()
                              } catch (e: Exception) { }
                          }
                          val bmp = t.thumb
                          if (bmp != null) {
                              try {
                                  FileOutputStream(File(dir, "thumb$i.jpg")).use { out ->
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 75, out)
                                  }
                              } catch (e: Exception) { }
                          }
                      }
                      for (t in tabs) {
                          try { cookiesFor(t.profile).flush() } catch (e: Exception) { }
                      }
                      prefs.edit().putString("tabs", arr.toString()).putInt("cur", cur).apply()
                  } catch (e: Exception) { }
              }

              private fun restoreTabs() {
                  try {
                      val arr = JSONArray(prefs.getString("tabs", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          newTab(o.optString("profile", ""))
                          val t = tabs[tabs.size - 1]
                          t.home = o.optBoolean("home", true)
                          val tf = File(filesDir, "tabs/thumb$i.jpg")
                          if (tf.exists()) {
                              try { t.thumb = BitmapFactory.decodeFile(tf.absolutePath) } catch (e: Exception) { }
                          }
                          val url = o.optString("url")
                          if (url.isNotEmpty()) {
                              var restored = false
                              val f = File(filesDir, "tabs/t" + i + ".bin")
                              if (f.exists()) {
                                  try {
                                      val bytes = f.readBytes()
                                      val p = Parcel.obtain()
                                      p.unmarshall(bytes, 0, bytes.size)
                                      p.setDataPosition(0)
                                      val b = p.readBundle(MainActivity::class.java.classLoader)
                                      p.recycle()
                                      if (b != null && t.web.restoreState(b) != null) restored = true
                                  } catch (e: Exception) { }
                              }
                              if (!restored) t.web.loadUrl(url)
                          }
                      }
                  } catch (e: Exception) { }
                  if (tabs.isEmpty()) newTab()
                  showTab(prefs.getInt("cur", 0).coerceIn(0, tabs.size - 1))
              }

              // ---------- separate logins per tab ----------

              private val multiProfile: Boolean by lazy {
                  try { WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE) } catch (e: Exception) { false }
              }

              private fun cookiesFor(profile: String): CookieManager {
                  if (profile.isNotEmpty() && multiProfile) {
                      try {
                          return ProfileStore.getInstance().getOrCreateProfile(profile).cookieManager
                      } catch (e: Exception) { }
                  }
                  return CookieManager.getInstance()
              }

              // Remove the stored logins of tabs that no longer exist.
              private fun cleanupProfiles() {
                  if (!multiProfile) return
                  try {
                      val store = ProfileStore.getInstance()
                      val used = tabs.map { it.profile }.toSet()
                      for (n in store.allProfileNames) {
                          if (n != "Default" && n !in used) {
                              try { store.deleteProfile(n) } catch (e: Exception) { }
                          }
                      }
                  } catch (e: Exception) { }
              }

              private fun deleteProfileLater(name: String) {
                  if (name.isEmpty() || !multiProfile) return
                  Handler(Looper.getMainLooper()).postDelayed({
                      try { ProfileStore.getInstance().deleteProfile(name) } catch (e: Exception) { }
                  }, 2000)
              }

              // ---------- pages ----------

              private fun showPage(p: View) {
                  setBarsHidden(false)
                  p.visibility = View.VISIBLE
                  if (p === setPage) updateSettingsUi()
                  updateFab()
              }

              private fun hidePages() {
                  dlPage.visibility = View.GONE
                  setPage.visibility = View.GONE
                  tabsPage.visibility = View.GONE
                  updateFab()
              }

              private fun updateFab() {
                  val show = !tabs[cur].home &&
                      dlPage.visibility != View.VISIBLE &&
                      setPage.visibility != View.VISIBLE &&
                      tabsPage.visibility != View.VISIBLE
                  fab.visibility = if (show) View.VISIBLE else View.GONE
              }

              override fun onBackPressed() {
                  if (customView != null) { hideCustom(); return }
                  if (dlPage.visibility == View.VISIBLE || setPage.visibility == View.VISIBLE || tabsPage.visibility == View.VISIBLE) {
                      hidePages()
                      return
                  }
                  val t = tabs[cur]
                  if (!t.home && t.web.canGoBack()) t.web.goBack()
                  else if (!t.home) { t.home = true; refresh() }
                  else super.onBackPressed()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == REQ_FILE) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCb = null
                  } else if (requestCode == REQ_TREE) {
                      val u = data?.data
                      if (resultCode == RESULT_OK && u != null) {
                          try {
                              contentResolver.takePersistableUriPermission(
                                  u, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              )
                          } catch (e: Exception) { }
                          prefs.edit().putString("folder", u.toString()).apply()
                          updateSettingsUi()
                          toast("Download folder changed")
                      }
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              // ---------- floating download button ----------

              @SuppressLint("ClickableViewAccessibility")
              private fun setupFab() {
                  var dx = 0f
                  var dy = 0f
                  var sx = 0f
                  var sy = 0f
                  var drag = false
                  var moved = false
                  val h = Handler(Looper.getMainLooper())
                  val longPress = Runnable {
                      drag = true
                      fab.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                      fab.animate().scaleX(1.2f).scaleY(1.2f).setDuration(100).start()
                  }
                  fab.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY
                              dx = v.x - e.rawX; dy = v.y - e.rawY
                              drag = false; moved = false
                              h.postDelayed(longPress, 400)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!drag && (abs(e.rawX - sx) > 20 || abs(e.rawY - sy) > 20)) {
                                  h.removeCallbacks(longPress)
                                  moved = true
                              }
                              if (drag) {
                                  val p = v.parent as View
                                  v.x = (e.rawX + dx).coerceIn(0f, (p.width - v.width).toFloat())
                                  v.y = (e.rawY + dy).coerceIn(0f, (p.height - v.height).toFloat())
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              h.removeCallbacks(longPress)
                              v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                              if (!drag && !moved) askDownload()
                              drag = false
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              h.removeCallbacks(longPress)
                              v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                              drag = false
                          }
                      }
                      true
                  }
              }

              // ---------- bookmarks & menu ----------

              private fun addBookmark() {
                  val t = tabs[cur]
                  val u = if (t.home) null else t.web.url
                  if (u == null) { toast("Open a page first"); return }
                  val set = prefs.getStringSet("bmk", emptySet())!!.toMutableSet()
                  set.add(u)
                  prefs.edit().putStringSet("bmk", set).apply()
                  toast("Bookmarked")
              }

              private fun showMenu(anchor: View) {
                  val themed = ContextThemeWrapper(
                      this,
                      if (dark) android.R.style.Theme_Material else android.R.style.Theme_Material_Light
                  )
                  val pm = PopupMenu(themed, anchor)
                  pm.menu.add(0, 1, 0, if (desktop) "Desktop mode: ON" else "Desktop mode: OFF")
                  pm.menu.add(0, 6, 1, if (orient == 1) "Landscape mode: ON" else "Landscape mode: OFF")
                  pm.menu.add(0, 2, 2, "Downloads")
                  pm.menu.add(0, 3, 3, "Bookmarks")
                  pm.menu.add(0, 4, 4, "Share link")
                  pm.menu.add(0, 5, 5, "Settings")
                  pm.setOnMenuItemClickListener {
                      when (it.itemId) {
                          1 -> toggleDesktop()
                          6 -> {
                              orient = if (orient == 1) 0 else 1
                              prefs.edit().putInt("orient", orient).apply()
                              applyOrientation()
                              toast(if (orient == 1) "Landscape mode ON" else "Screen orientation: Auto")
                          }
                          2 -> showPage(dlPage)
                          3 -> {
                              val list = prefs.getStringSet("bmk", emptySet())!!.toTypedArray()
                              dlg().setTitle("Bookmarks")
                                  .setItems(list) { _, i -> open(list[i]) }
                                  .setNeutralButton("Clear all") { _, _ -> prefs.edit().remove("bmk").apply() }
                                  .show()
                          }
                          4 -> {
                              val t = tabs[cur]
                              val u = if (t.home) null else t.web.url
                              if (u != null) {
                                  val i = Intent(Intent.ACTION_SEND)
                                  i.type = "text/plain"
                                  i.putExtra(Intent.EXTRA_TEXT, u)
                                  startActivity(Intent.createChooser(i, "Share"))
                              }
                          }
                          5 -> showPage(setPage)
                      }
                      true
                  }
                  pm.show()
              }

              // ---------- downloads ----------

              private fun fmtSize(b: Long): String = when {
                  b >= 1073741824L -> String.format(Locale.US, "%.2f GB", b / 1073741824.0)
                  b >= 1048576L -> String.format(Locale.US, "%.1f MB", b / 1048576.0)
                  b >= 1024L -> String.format(Locale.US, "%.0f KB", b / 1024.0)
                  else -> b.toString() + " B"
              }

              private val ytRe = Regex("(?:[?&]v=|youtu\\.be/|/shorts/|/embed/|/live/)([A-Za-z0-9_-]{11})")

              private fun isYt(link: String): Boolean {
                  val h = Uri.parse(link).host ?: return false
                  return h.endsWith("youtube.com") || h == "youtu.be"
              }

              private fun ytId(link: String): String =
                  if (!isYt(link)) "" else (ytRe.find(link)?.groupValues?.get(1) ?: "")

              private fun vidOf(link: String): String = ytId(link).ifEmpty { link }

              private fun normalUrl(link: String): String {
                  val id = ytId(link)
                  return if (id.isEmpty()) link else "https://www.youtube.com/watch?v=" + id
              }

              private fun fileExists(d: DlItem): Boolean {
                  val u = d.uri ?: return false
                  return try {
                      contentResolver.openAssetFileDescriptor(Uri.parse(u), "r")?.use { true } ?: false
                  } catch (e: Exception) {
                      false
                  }
              }

              // 2 = already downloaded (file still exists), 1 = download in progress, 0 = free
              private fun qStatus(vid: String, key: String): Int {
                  for (d in items) {
                      if (d.kind == 0 && d.vid == vid && d.qkey == key) {
                          if (d.state == 2) {
                              if (fileExists(d)) return 2
                          } else if (d.state != 3) {
                              return 1
                          }
                      }
                  }
                  return 0
              }

              private fun askDownload() {
                  val t = tabs[cur]
                  val page = if (t.home) null else t.web.url
                  if (page == null) { toast("Open a video page first"); return }
                  if (!ready) { toast("Downloader is starting, try again in a moment"); return }
                  if (isYt(page) && ytId(page).isEmpty()) {
                      toast("Open a video first, then tap download")
                      return
                  }
                  longPressVideo(page, t.web.title ?: "Video")
              }

              // Used when the exact list cannot be read: the downloader picks the best quality up to the chosen height.
              private fun standardQualities(): List<Q> {
                  val list = mutableListOf<Q>()
                  list.add(Q("Original quality (best)", "bv*+ba/b", false, 0L, "best", ""))
                  for (h in listOf(2160, 1440, 1080, 720, 480, 360, 240, 144)) {
                      list.add(Q(h.toString() + "p (or the closest lower)", "bv*[height<=" + h + "]+ba/b[height<=" + h + "]", false, 0L, "h" + h, "auto"))
                  }
                  list.add(Q("Audio only (MP3)", "", true, 0L, "mp3", "audio"))
                  return list
              }

              private fun showQualities(link: String, page: String, title: String, qs: List<Q>) {
                  val vid = vidOf(link)
                  val labels = qs.map {
                      when (qStatus(vid, it.key)) {
                          2 -> "\u2714\u2714 " + it.label + "  (downloaded)"
                          1 -> it.label + "  (downloading...)"
                          else -> it.label
                      }
                  }.toTypedArray()
                  dlg().setTitle("Choose quality")
                      .setItems(labels) { _, i ->
                          val q = qs[i]
                          when (qStatus(vid, q.key)) {
                              2 -> toast("Already downloaded in this quality")
                              1 -> toast("This quality is already downloading")
                              else -> enqueue(link, page, title, q)
                          }
                      }
                      .show()
              }

              // Long-press on a YouTube video: read that video's own qualities and show only those.
              private fun longPressVideo(url: String, title: String = "Video") {
                  if (!ready) { toast("Downloader is starting, try again in a moment"); return }
                  val link = normalUrl(url)
                  val ck = cookieText(link, tabs.getOrNull(cur)?.profile ?: "")
                  val wait = dlg().setTitle("Please wait")
                      .setMessage("Checking this video's qualities...")
                      .setCancelable(true)
                      .setOnCancelListener {
                          try { YoutubeDL.getInstance().destroyProcessById(qPid) } catch (e: Exception) { }
                      }
                      .show()
                  Thread {
                      var err = ""
                      val res: List<Q> = try {
                          fetchQualities(link, ck)
                      } catch (e: Exception) {
                          err = e.message ?: ""
                          emptyList()
                      }
                      runOnUiThread {
                          if (!wait.isShowing) return@runOnUiThread
                          wait.dismiss()
                          if (res.isNotEmpty()) {
                              showQualities(link, url, title, res)
                          } else {
                              dlg().setTitle("Could not read qualities")
                                  .setMessage(if (err.isEmpty()) "The downloader could not read this video's quality list." else err.take(500))
                                  .setPositiveButton("Standard list") { _, _ -> showQualities(link, url, title, standardQualities()) }
                                  .setNegativeButton("Cancel", null)
                                  .show()
                          }
                      }
                  }.start()
              }

              private fun fetchQualities(link: String, cookies: String?): List<Q> {
                  val cf = File(cacheDir, "cookies_q.txt")
                  val pid = "q" + System.nanoTime()
                  qPid = pid
                  val finished = java.util.concurrent.atomic.AtomicBoolean(false)
                  Thread {
                      try { Thread.sleep(30000) } catch (e: Exception) { }
                      if (!finished.get()) {
                          try { YoutubeDL.getInstance().destroyProcessById(pid) } catch (e: Exception) { }
                      }
                  }.start()
                  try {
                      val req = YoutubeDLRequest(link)
                      req.addOption("--dump-single-json")
                      req.addOption("--no-playlist")
                      if (cookies != null) {
                          cf.writeText(cookies)
                          req.addOption("--cookies", cf.absolutePath)
                      }
                      val out = YoutubeDL.getInstance().execute(req, pid).out
                      val jsonLine = out.lines().lastOrNull { it.trimStart().startsWith("{") } ?: return emptyList()
                      val json = JSONObject(jsonLine)
                      val arr = json.optJSONArray("formats") ?: return emptyList()
                      val heights = java.util.TreeMap<Int, Long>()
                      val fpsBy = java.util.HashMap<Int, Int>()
                      var audioBest = 0L
                      for (i in 0 until arr.length()) {
                          val f = arr.getJSONObject(i)
                          val vc = f.optString("vcodec", "none")
                          val ac = f.optString("acodec", "none")
                          val h = f.optInt("height", 0)
                          val size = maxOf(f.optLong("filesize", 0L), f.optLong("filesize_approx", 0L))
                          if (vc != "none" && vc != "null" && h > 0) {
                              heights[h] = maxOf(heights[h] ?: 0L, size)
                              val fp = f.optDouble("fps", 0.0).toInt()
                              if (fp > (fpsBy[h] ?: 0)) fpsBy[h] = fp
                          } else if (vc == "none" && ac != "none" && ac != "null") {
                              audioBest = maxOf(audioBest, size)
                          }
                      }
                      if (heights.isEmpty()) return emptyList()
                      val list = mutableListOf<Q>()
                      val top = heights.lastKey()
                      val ab = audioBest
                      fun sz(v: Long): String = if (v > 0) " - ~" + fmtSize(v + ab) else ""
                      fun lab(h: Int): String {
                          val fp = fpsBy[h] ?: 0
                          return h.toString() + "p" + (if (fp > 30) fp.toString() else "")
                      }
                      val topSize = heights[top] ?: 0L
                      list.add(Q("Original quality (best) - " + lab(top) + sz(topSize), "bv*+ba/b", false, topSize + ab, "best", ""))
                      for (h in heights.descendingKeySet()) {
                          if (h == top) continue
                          val v = heights[h] ?: 0L
                          list.add(Q(lab(h) + sz(v), "bv*[height<=" + h + "]+ba/b[height<=" + h + "]", false, v + ab, "h" + h, h.toString() + "p"))
                      }
                      list.add(Q("Audio only (MP3)" + (if (ab > 0) " - ~" + fmtSize(ab) else ""), "", true, ab, "mp3", "audio"))
                      return list
                  } finally {
                      finished.set(true)
                      cf.delete()
                  }
              }

              private fun enqueue(link: String, page: String, title: String, q: Q) {
                  val d = DlItem(title, 0, 0, null, null, "")
                  d.kind = 0
                  d.link = link
                  d.page = page
                  d.audio = q.audio
                  d.fmt = q.fmt
                  d.total = q.bytes
                  d.vid = vidOf(link)
                  d.qkey = q.key
                  d.qtag = q.tag
                  d.profile = tabs.getOrNull(cur)?.profile ?: ""
                  items.add(0, d)
                  dlTab = 0
                  flyToDownload()
                  toast("Added to Downloads")
                  startRun(d)
              }

              private fun startRun(d: DlItem) {
                  d.stop = 0
                  d.state = 0
                  d.gen++
                  val g = d.gen
                  refreshDl()
                  if (d.kind == 0) {
                      val ck = cookieText(d.link, d.profile)
                      exec.execute { runDownload(d, ck, g) }
                  } else {
                      Thread { runDirect(d, g) }.start()
                  }
              }

              private fun pauseItem(d: DlItem) {
                  d.stop = 1
                  if (d.kind == 0) {
                      try { YoutubeDL.getInstance().destroyProcessById(d.id) } catch (e: Exception) { }
                  }
                  d.state = 4
                  saveItems()
                  refreshDl()
              }

              private fun askDelete(d: DlItem) {
                  val msg = if (d.state == 2) "This will delete the file from your phone." else "This will cancel the download and remove it."
                  dlg().setTitle("Delete?")
                      .setMessage(msg)
                      .setPositiveButton("Delete") { _, _ -> deleteItem(d) }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun deleteItem(d: DlItem) {
                  d.stop = 2
                  d.gen++
                  if (d.kind == 0) {
                      try { YoutubeDL.getInstance().destroyProcessById(d.id) } catch (e: Exception) { }
                  }
                  val us = d.uri
                  if (!us.isNullOrEmpty()) {
                      try {
                          val u = Uri.parse(us)
                          if (DocumentsContract.isDocumentUri(this, u)) DocumentsContract.deleteDocument(contentResolver, u)
                          else contentResolver.delete(u, null, null)
                      } catch (e: Exception) { }
                  }
                  File(filesDir, "parts/" + d.id).deleteRecursively()
                  items.remove(d)
                  saveItems()
                  refreshDl()
                  toast("Deleted")
              }

              private fun openPage(d: DlItem) {
                  val u = if (d.page.isNotEmpty()) d.page else d.link
                  if (u.isEmpty()) { toast("No page saved"); return }
                  hidePages()
                  newTab()
                  showTab(tabs.size - 1)
                  open(u)
              }

              private fun cookieText(link: String, profile: String): String? {
                  if (!cookiesOn) return null
                  val host = Uri.parse(link).host ?: return null
                  if (!host.endsWith("youtube.com") && host != "youtu.be") return null
                  val raw = cookiesFor(profile).getCookie("https://www.youtube.com") ?: return null
                  val sb = StringBuilder("# Netscape HTTP Cookie File\n")
                  for (part in raw.split(";")) {
                      val kv = part.trim().split("=", limit = 2)
                      if (kv.size == 2 && kv[0].isNotEmpty()) {
                          sb.append(".youtube.com\tTRUE\t/\tTRUE\t2000000000\t").append(kv[0]).append("\t").append(kv[1]).append("\n")
                      }
                  }
                  return sb.toString()
              }

              private fun ui() = runOnUiThread { refreshDl() }

              private fun runDownload(d: DlItem, cookies: String?, g: Int) {
                  if (d.stop != 0 || d.gen != g) return
                  d.state = 1
                  ui()
                  val dir = File(filesDir, "parts/" + d.id)
                  val cf = File(cacheDir, "cookies" + d.id + ".txt")
                  try {
                      dir.mkdirs()
                      val req = YoutubeDLRequest(d.link)
                      val tag = if (d.qtag.isEmpty() || d.qtag == "audio") "" else if (d.qtag == "auto") " [%(height)sp]" else " [" + d.qtag + "]"
                      req.addOption("-o", dir.absolutePath + "/%(title).80s" + tag + ".%(ext)s")
                      req.addOption("--no-playlist")
                      if (cookies != null) {
                          cf.writeText(cookies)
                          req.addOption("--cookies", cf.absolutePath)
                      }
                      if (d.audio) {
                          req.addOption("-x")
                          req.addOption("--audio-format", "mp3")
                          req.addOption("--audio-quality", "0")
                      } else {
                          req.addOption("-f", d.fmt)
                          req.addOption("-S", "res,ext:mp4:m4a")
                          req.addOption("--merge-output-format", "mp4")
                      }

                      YoutubeDL.getInstance().execute(req, d.id) { p, _, line ->
                          if (d.gen == g) {
                              if (p >= 0f) d.progress = p.toInt().coerceIn(0, 100)
                              val m = SIZE_RE.find(line)
                              if (m != null) d.sizeLabel = m.groupValues[2]
                              ui()
                          }
                      }

                      val f = (dir.listFiles() ?: emptyArray())
                          .filter { !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") && !it.name.contains(".part-") }
                          .maxByOrNull { it.length() }
                          ?: throw Exception("No file was downloaded")
                      if (d.gen != g) return
                      d.title = f.nameWithoutExtension
                      saveFile(d, f)
                      d.total = f.length()
                      d.state = 2
                      d.progress = 100
                      runOnUiThread { toast("Downloaded: " + d.title) }
                  } catch (e: Exception) {
                      if (d.gen == g) {
                          if (d.stop == 1) {
                              d.state = 4
                          } else if (d.stop != 2) {
                              d.state = 3
                              d.msg = (e.message ?: "Unknown error").take(700)
                          }
                      }
                  } finally {
                      if (d.state == 2 || d.stop == 2) dir.deleteRecursively()
                      cf.delete()
                      runOnUiThread { finishItem(d) }
                  }
              }

              private fun saveFile(d: DlItem, f: File) {
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(f.extension.lowercase())
                      ?: "application/octet-stream"
                  var uri: Uri? = null
                  val tree = prefs.getString("folder", "") ?: ""
                  if (tree.isNotEmpty()) {
                      try {
                          deleteExisting(f.name, tree)
                          val t = Uri.parse(tree)
                          val parent = DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                          uri = DocumentsContract.createDocument(contentResolver, parent, mime, f.name)
                      } catch (e: Exception) {
                          uri = null
                      }
                  }
                  if (uri == null) {
                      deleteExisting(f.name, "")
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, f.name)
                          put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      }
                      uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                  }
                  val u = uri ?: throw Exception("Could not create file in the download folder")
                  contentResolver.openOutputStream(u)?.use { out ->
                      f.inputStream().use { it.copyTo(out) }
                  }
                  d.uri = u.toString()
                  d.mime = mime
                  d.name = f.name
              }

              // Same file name downloaded again: delete the old file so the new one replaces it.
              private fun deleteExisting(name: String, tree: String) {
                  try {
                      if (tree.isNotEmpty()) {
                          val t = Uri.parse(tree)
                          val children = DocumentsContract.buildChildDocumentsUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                          val ids = mutableListOf<String>()
                          contentResolver.query(
                              children,
                              arrayOf(DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME),
                              null, null, null
                          )?.use { c ->
                              while (c.moveToNext()) {
                                  if (c.getString(1) == name) ids.add(c.getString(0))
                              }
                          }
                          for (id in ids) {
                              DocumentsContract.deleteDocument(contentResolver, DocumentsContract.buildDocumentUriUsingTree(t, id))
                          }
                      } else {
                          val base = MediaStore.Downloads.EXTERNAL_CONTENT_URI
                          val rows = mutableListOf<Long>()
                          contentResolver.query(
                              base,
                              arrayOf(MediaStore.MediaColumns._ID),
                              MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                              arrayOf(name, Environment.DIRECTORY_DOWNLOADS + "/"),
                              null
                          )?.use { c ->
                              while (c.moveToNext()) rows.add(c.getLong(0))
                          }
                          for (id in rows) contentResolver.delete(ContentUris.withAppendedId(base, id), null, null)
                      }
                  } catch (e: Exception) { }
              }

              private fun shown(): List<DlItem> = items.filter { (it.state != 2) == (dlTab == 0) }

              private fun refreshDl() {
                  val active = items.count { it.state != 2 }
                  val done = items.size - active
                  val a = findViewById<TextView>(R.id.tabActive)
                  val b = findViewById<TextView>(R.id.tabDone)
                  a.text = "Downloading ($active)"
                  b.text = "Downloaded ($done)"
                  val accent = 0xFF2D7FF9.toInt()
                  for ((v, sel) in listOf(a to (dlTab == 0), b to (dlTab == 1))) {
                      v.setTextColor(if (sel) accent else col.sec)
                      v.setTypeface(null, if (sel) Typeface.BOLD else Typeface.NORMAL)
                      v.background = if (sel) shape(col.card, 20) else null
                  }
                  findViewById<TextView>(R.id.dlEmpty).text =
                      if (dlTab == 0) "No active downloads" else "No downloaded files yet"
                  dlAdapter.notifyDataSetChanged()
              }

              private fun finishItem(d: DlItem) {
                  if (d.state == 2) items.removeAll { it !== d && it.state == 2 && it.name == d.name }
                  saveItems()
                  refreshDl()
              }

              // Small download icon flies to the top-right download button.
              private fun flyToDownload() {
                  val root = findViewById<FrameLayout>(R.id.root)
                  val target = findViewById<View>(R.id.bDl)
                  val rl = IntArray(2)
                  val tl = IntArray(2)
                  root.getLocationOnScreen(rl)
                  target.getLocationOnScreen(tl)
                  val size = dp(44)
                  val v = ImageView(this)
                  v.setBackgroundResource(R.drawable.bg_fab)
                  v.setImageResource(R.drawable.ic_download)
                  v.setPadding(dp(10), dp(10), dp(10), dp(10))
                  val sx: Float
                  val sy: Float
                  if (fab.visibility == View.VISIBLE) {
                      val fl = IntArray(2)
                      fab.getLocationOnScreen(fl)
                      sx = (fl[0] - rl[0] + (fab.width - size) / 2).toFloat()
                      sy = (fl[1] - rl[1] + (fab.height - size) / 2).toFloat()
                  } else {
                      sx = ((root.width - size) / 2).toFloat()
                      sy = (root.height * 0.6f)
                  }
                  root.addView(v, FrameLayout.LayoutParams(size, size))
                  v.x = sx
                  v.y = sy
                  val ex = (tl[0] - rl[0] + (target.width - size) / 2).toFloat()
                  val ey = (tl[1] - rl[1] + (target.height - size) / 2).toFloat()
                  v.animate().x(ex).y(ey).scaleX(0.35f).scaleY(0.35f).alpha(0.4f)
                      .setDuration(750)
                      .setInterpolator(AccelerateDecelerateInterpolator())
                      .withEndAction {
                          root.removeView(v)
                          target.animate().scaleX(1.3f).scaleY(1.3f).setDuration(120).withEndAction {
                              target.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                          }.start()
                      }
                      .start()
              }

              // ---------- direct file downloads (links inside web pages) ----------

              private fun startDirect(url: String, ua: String?, cd: String?, mimeHint: String?, page: String, profile: String) {
                  val name = URLUtil.guessFileName(url, cd, mimeHint)
                  val d = DlItem(name.substringBeforeLast("."), 0, 0, null, null, "")
                  d.kind = 1
                  d.link = url
                  d.page = page
                  d.profile = profile
                  d.ua = ua
                  d.name = name
                  items.add(0, d)
                  dlTab = 0
                  flyToDownload()
                  toast("Downloading " + name)
                  startRun(d)
              }

              private fun openFollow(start: String, ua: String?, offset: Long, profile: String): HttpURLConnection {
                  var url = start
                  for (hop in 0..10) {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      if (ua != null) c.setRequestProperty("User-Agent", ua)
                      val ck = cookiesFor(profile).getCookie(url)
                      if (ck != null) c.setRequestProperty("Cookie", ck)
                      if (offset > 0) c.setRequestProperty("Range", "bytes=" + offset + "-")
                      val code = c.responseCode
                      if (code in 300..399) {
                          val loc = c.getHeaderField("Location") ?: throw Exception("Bad redirect")
                          url = URL(URL(url), loc).toString()
                          c.disconnect()
                          continue
                      }
                      if (code !in 200..299) throw Exception("Server returned HTTP " + code)
                      return c
                  }
                  throw Exception("Too many redirects")
              }

              private fun runDirect(d: DlItem, g: Int) {
                  if (d.stop != 0 || d.gen != g) return
                  d.state = 1
                  ui()
                  val dir = File(filesDir, "parts/" + d.id)
                  try {
                      dir.mkdirs()
                      val part = File(dir, d.name)
                      var offset = if (part.exists()) part.length() else 0L
                      val conn = openFollow(d.link, d.ua, offset, d.profile)
                      val append = offset > 0 && conn.responseCode == 206
                      if (!append) offset = 0L
                      val len = conn.contentLengthLong
                      if (len > 0) d.total = offset + len
                      var done = offset
                      var last = 0L
                      var completed = false
                      conn.inputStream.use { ins ->
                          java.io.FileOutputStream(part, append).use { out ->
                              val buf = ByteArray(65536)
                              while (true) {
                                  val n = ins.read(buf)
                                  if (n < 0) { completed = true; break }
                                  if (d.stop != 0 || d.gen != g) break
                                  out.write(buf, 0, n)
                                  done += n
                                  d.done = done
                                  val now = System.currentTimeMillis()
                                  if (now - last > 400) {
                                      last = now
                                      if (d.total > 0) d.progress = (done * 100 / d.total).toInt().coerceIn(0, 100)
                                      ui()
                                  }
                              }
                          }
                      }
                      if (completed) {
                          if (d.gen != g) return
                          saveFile(d, part)
                          d.total = part.length()
                          d.done = d.total
                          d.title = part.nameWithoutExtension
                          d.state = 2
                          d.progress = 100
                          runOnUiThread { toast("Downloaded: " + d.title) }
                      } else if (d.gen == g && d.stop == 1) {
                          d.state = 4
                      }
                  } catch (e: Exception) {
                      if (d.gen == g) {
                          if (d.stop == 1) {
                              d.state = 4
                          } else if (d.stop != 2) {
                              d.state = 3
                              d.msg = (e.message ?: "Unknown error").take(300)
                          }
                      }
                  } finally {
                      if (d.state == 2 || d.stop == 2) dir.deleteRecursively()
                      runOnUiThread { finishItem(d) }
                  }
              }

              private fun openFile(d: DlItem) {
                  try {
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(Uri.parse(d.uri), d.mime ?: "*/*")
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(i)
                  } catch (e: Exception) {
                      toast("No app found to open this file")
                  }
              }

              private fun saveItems() {
                  val a = JSONArray()
                  for (d in items) {
                      val st = if (d.state == 0 || d.state == 1) 4 else d.state
                      a.put(
                          JSONObject().put("t", d.title).put("s", st).put("u", d.uri ?: "").put("m", d.mime ?: "")
                              .put("g", d.msg).put("n", d.name).put("i", d.id).put("k", d.kind).put("l", d.link)
                              .put("p", d.page).put("a", d.audio).put("f", d.fmt).put("ua", d.ua ?: "")
                              .put("z", d.total).put("d", d.done).put("r", d.progress)
                              .put("v", d.vid).put("q", d.qkey).put("tg", d.qtag).put("pf", d.profile)
                      )
                  }
                  prefs.edit().putString("dl", a.toString()).apply()
              }

              private fun loadItems() {
                  try {
                      val a = JSONArray(prefs.getString("dl", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          var st = o.getInt("s")
                          if (st == 0 || st == 1) st = 4
                          val it2 = DlItem(o.getString("t"), st, o.optInt("r", 100), o.optString("u"), o.optString("m"), o.optString("g"))
                          it2.name = o.optString("n")
                          val id = o.optString("i")
                          if (id.isNotEmpty()) it2.id = id
                          it2.kind = o.optInt("k", 0)
                          it2.link = o.optString("l")
                          it2.page = o.optString("p")
                          it2.audio = o.optBoolean("a", false)
                          it2.fmt = o.optString("f", "bv*+ba/b")
                          val ua = o.optString("ua")
                          it2.ua = if (ua.isEmpty()) null else ua
                          it2.total = o.optLong("z", 0L)
                          it2.done = o.optLong("d", 0L)
                          it2.vid = o.optString("v")
                          it2.qkey = o.optString("q")
                          it2.qtag = o.optString("tg")
                          it2.profile = o.optString("pf")
                          items.add(it2)
                      }
                  } catch (e: Exception) { }
              }

              private fun updateEngine(manual: Boolean) {
                  try {
                      val r = YoutubeDL.getInstance().updateYoutubeDL(application, YoutubeDL.UpdateChannel.NIGHTLY)
                      if (manual) runOnUiThread { toast("Engine update: $r") }
                  } catch (e: Exception) {
                      if (manual) runOnUiThread { toast("Update failed: ${e.message}") }
                  }
              }

              private fun progressText(d: DlItem): String {
                  if (d.kind == 1) {
                      return if (d.total > 0) fmtSize(d.done) + " / " + fmtSize(d.total) + " (" + d.progress + "%)" else fmtSize(d.done)
                  }
                  var s = d.progress.toString() + "%"
                  if (d.sizeLabel.isNotEmpty()) s += " of " + d.sizeLabel
                  if (d.total > 0) s += "  (total ~" + fmtSize(d.total) + ")"
                  return s
              }

              private fun statusText(d: DlItem): String = when (d.state) {
                  0 -> "Waiting..."
                  1 -> "Downloading - " + progressText(d)
                  4 -> "Paused - " + progressText(d)
                  2 -> "Downloaded" + (if (d.total > 0) " - " + fmtSize(d.total) else "") + " - tap to open"
                  else -> "Failed: " + d.msg
              }

              private fun act(label: String, color: Int = 0xFF2D7FF9.toInt(), f: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 14f
                  t.setTextColor(color)
                  t.setPadding(0, dp(10), dp(24), dp(4))
                  t.isFocusable = false
                  t.setOnClickListener { f() }
                  return t
              }

              inner class DlAdapter : BaseAdapter() {
                  override fun getCount() = shown().size
                  override fun getItem(position: Int): Any = shown()[position]
                  override fun getItemId(position: Int) = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val d = shown()[position]
                      val box = LinearLayout(this@MainActivity)
                      box.orientation = LinearLayout.VERTICAL
                      box.setPadding(dp(16), dp(12), dp(16), dp(8))
                      val t = TextView(this@MainActivity)
                      t.text = d.title
                      t.textSize = 16f
                      t.maxLines = 2
                      t.setTextColor(col.text)
                      val s = TextView(this@MainActivity)
                      s.text = statusText(d)
                      s.textSize = 13f
                      s.setTextColor(col.sec)
                      box.addView(t)
                      box.addView(s)
                      if (d.state == 0 || d.state == 1 || d.state == 4) {
                          val pb = ProgressBar(this@MainActivity, null, android.R.attr.progressBarStyleHorizontal)
                          pb.max = 100
                          pb.progress = d.progress
                          box.addView(pb)
                      }
                      val row = LinearLayout(this@MainActivity)
                      row.orientation = LinearLayout.HORIZONTAL
                      when (d.state) {
                          0, 1 -> row.addView(act("Pause") { pauseItem(d) })
                          4 -> row.addView(act("Resume") { startRun(d) })
                          3 -> row.addView(act("Retry") { startRun(d) })
                      }
                      row.addView(act("Open page") { openPage(d) })
                      row.addView(act("Delete", 0xFFE5534B.toInt()) { askDelete(d) })
                      box.addView(row)
                      return box
                  }
              }
          }
