              // ---------- folder & MP3 scanner (works across sites, with WebView fallback on 403/409/CF) ----------

              private fun handleLongPressLink(
                  url: String,
                  linkText: String,
                  sourceUrl: String,
                  sourceLinks: Set<String>,
                  profile: String,
                  webUa: String
              ) {
                  val cleanName = sanitizeName(linkText).ifEmpty { guessNameFromUrl(url) }
                  if (isAudioUrl(url)) {
                      dlg().setTitle(cleanName)
                          .setMessage("Download this audio file?")
                          .setPositiveButton("Download") { _, _ ->
                              startDirectNamed(url, cleanName, sourceUrl, profile, "", true, webUa)
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                      return
                  }
                  val cancelled = AtomicBoolean(false)
                  val wait = dlg().setTitle(cleanName)
                      .setMessage("Scanning folder & songs...")
                      .setCancelable(true)
                      .setOnCancelListener { cancelled.set(true) }
                      .show()
                  Thread {
                      try {
                          val (finalUrl, doc) = fetchHtml(url, webUa, profile, sourceUrl, cancelled)
                          if (cancelled.get()) return@Thread

                          val tmpl = HashSet<String>()
                          val needRootFetch = sourceLinks.isEmpty() ||
                              (sourceUrl.isNotEmpty() && normUrl(finalUrl) == normUrl(sourceUrl))
                          if (sourceUrl.isNotEmpty() && normUrl(finalUrl) != normUrl(sourceUrl)) {
                              tmpl.addAll(sourceLinks)
                          }
                          if (needRootFetch) {
                              val parsed = Uri.parse(finalUrl)
                              val rootUrl = "${parsed.scheme ?: "https"}://${parsed.host ?: ""}/"
                              if (normUrl(rootUrl) != normUrl(finalUrl)) {
                                  try {
                                      val (_, rootDoc) = fetchHtml(rootUrl, webUa, profile, finalUrl, cancelled)
                                      for (a in rootDoc.select("a[href]")) {
                                          val h = a.absUrl("href")
                                          if (h.startsWith("http")) tmpl.add(normUrl(h))
                                      }
                                  } catch (e: Exception) { }
                              }
                          }
                          if (cancelled.get()) return@Thread

                          val ignore = HashSet<String>(tmpl)
                          if (sourceUrl.isNotEmpty()) ignore.add(normUrl(sourceUrl))
                          ignore.add(normUrl(finalUrl))

                          val res = analyzePage(doc, finalUrl, ignore)
                          runOnUiThread {
                              if (cancelled.get() || !wait.isShowing) return@runOnUiThread
                              wait.dismiss()
                              if (res.audios.isEmpty() && res.folders.isEmpty()) {
                                  toast("No MP3 files or subfolders found in $cleanName")
                              } else if (res.folders.isNotEmpty()) {
                                  val hasAudios = res.audios.isNotEmpty()
                                  val choiceLabels = mutableListOf<String>()
                                  if (hasAudios) choiceLabels.add("Songs in this folder (${res.audios.size})")
                                  for (f in res.folders) choiceLabels.add(f.name)
                                  val checked = BooleanArray(choiceLabels.size) { false }
                                  val alert = dlg().setTitle(cleanName)
                                      .setMultiChoiceItems(choiceLabels.toTypedArray(), checked) { d, which, isChecked ->
                                          checked[which] = isChecked
                                          (d as? AlertDialog)?.getButton(AlertDialog.BUTTON_POSITIVE)?.isEnabled = checked.any { it }
                                      }
                                      .setPositiveButton("Download") { _, _ ->
                                          val includeAudios = hasAudios && checked[0]
                                          val offset = if (hasAudios) 1 else 0
                                          val pickedFolders = mutableListOf<FoundLink>()
                                          val skippedUrls = HashSet<String>()
                                          for (i in res.folders.indices) {
                                              if (checked[i + offset]) pickedFolders.add(res.folders[i])
                                              else skippedUrls.add(normUrl(res.folders[i].url))
                                          }
                                          if (includeAudios || pickedFolders.isNotEmpty()) {
                                              startFolderBatch(
                                                  cleanName,
                                                  finalUrl,
                                                  if (includeAudios) res.audios else emptyList(),
                                                  pickedFolders,
                                                  skippedUrls,
                                                  ignore,
                                                  webUa,
                                                  profile
                                              )
                                          }
                                      }
                                      .setNeutralButton("Select all", null)
                                      .setNegativeButton("Cancel", null)
                                      .show()
                                  val posBtn = alert.getButton(AlertDialog.BUTTON_POSITIVE)
                                  posBtn.isEnabled = false
                                  val neuBtn = alert.getButton(AlertDialog.BUTTON_NEUTRAL)
                                  neuBtn.setOnClickListener {
                                      val next = !checked.all { it }
                                      val lv = alert.listView
                                      for (i in checked.indices) {
                                          checked[i] = next
                                          lv.setItemChecked(i, next)
                                      }
                                      posBtn.isEnabled = checked.any { it }
                                      neuBtn.text = if (next) "Clear all" else "Select all"
                                  }
                              } else {
                                  dlg().setTitle(cleanName)
                                      .setMessage("$cleanName (${res.audios.size} songs) - Download all?")
                                      .setPositiveButton("Download all") { _, _ ->
                                          enqueueAudioList(res.audios, cleanName, finalUrl, webUa, profile, true)
                                      }
                                      .setNegativeButton("Cancel", null)
                                      .show()
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              if (wait.isShowing) wait.dismiss()
                              if (!cancelled.get()) toast("Could not scan folder: ${e.message}")
                          }
                      }
                  }.start()
              }

              private fun isChallengeHtml(html: String): Boolean {
                  val low = html.take(4000).lowercase(Locale.US)
                  return low.contains("just a moment") || low.contains("cf-browser-verification") ||
                      low.contains("challenge-platform") || low.contains("enable javascript and cookies")
              }

              private fun fetchHtml(
                  url: String,
                  ua: String?,
                  profile: String,
                  referer: String,
                  cancelled: AtomicBoolean
              ): Pair<String, Document> {
                  val host = (Uri.parse(url).host ?: "").lowercase(Locale.US)
                  if (host !in wvOnlyHosts) {
                      try {
                          val conn = openFollow(url, ua, 0L, profile, referer)
                          try {
                              val ct = (conn.contentType ?: "").lowercase(Locale.US)
                              if (ct.isNotEmpty() && !ct.contains("html") && !ct.contains("text") && !ct.contains("xml")) {
                                  throw Exception("Not an HTML folder page")
                              }
                              val finalUrl = conn.url.toString()
                              val html = conn.inputStream.bufferedReader(Charsets.UTF_8).use { r ->
                                  val buf = CharArray(65536)
                                  val sb = StringBuilder()
                                  var total = 0
                                  while (total < 1500000) {
                                      val n = r.read(buf)
                                      if (n < 0) break
                                      sb.append(buf, 0, n)
                                      total += n
                                  }
                                  sb.toString()
                              }
                              if (!isChallengeHtml(html)) {
                                  return finalUrl to Jsoup.parse(html, finalUrl)
                              }
                          } finally {
                              conn.disconnect()
                          }
                      } catch (e: HttpCodeException) {
                          if (e.code !in WV_FALLBACK_CODES) throw e
                          if (host.isNotEmpty()) wvOnlyHosts.add(host)
                      }
                  }
                  if (cancelled.get()) throw Exception("Cancelled")
                  return fetchHtmlViaWebView(url, profile, referer, cancelled)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun fetchHtmlViaWebView(
                  url: String,
                  profile: String,
                  referer: String,
                  cancelled: AtomicBoolean
              ): Pair<String, Document> {
                  val latch = CountDownLatch(1)
                  val done = AtomicBoolean(false)
                  var resUrl = url
                  var resHtml = ""
                  var resErr: String? = null
                  val holder = arrayOfNulls<WebView>(1)

                  fun cleanup(wv: WebView?) {
                      if (wv != null) {
                          try { wv.stopLoading() } catch (e: Exception) { }
                          try { wv.destroy() } catch (e: Exception) { }
                      }
                  }

                  fun extract(wv: WebView, attempt: Int) {
                      if (done.get() || cancelled.get()) {
                          if (done.compareAndSet(false, true)) {
                              cleanup(wv)
                              latch.countDown()
                          }
                          return
                      }
                      val js = "(function(){return JSON.stringify({u:location.href,h:document.documentElement.outerHTML});})();"
                      wv.evaluateJavascript(js) { raw ->
                          if (done.get()) return@evaluateJavascript
                          var u = url
                          var h = ""
                          try {
                              val s = JSONTokener(raw).nextValue() as? String
                              if (!s.isNullOrEmpty()) {
                                  val o = JSONObject(s)
                                  u = o.optString("u", url)
                                  h = o.optString("h", "")
                              }
                          } catch (e: Exception) { }
                          if ((h.length < 150 || isChallengeHtml(h)) && attempt < 6 && !cancelled.get()) {
                              mainHandler.postDelayed({ extract(wv, attempt + 1) }, 1200)
                          } else {
                              if (done.compareAndSet(false, true)) {
                                  resUrl = u
                                  resHtml = h
                                  cleanup(wv)
                                  latch.countDown()
                              }
                          }
                      }
                  }

                  runOnUiThread {
                      if (cancelled.get()) {
                          done.set(true)
                          latch.countDown()
                          return@runOnUiThread
                      }
                      try {
                          val wv = WebView(this@MainActivity)
                          holder[0] = wv
                          if (profile.isNotEmpty() && multiProfile) {
                              try { WebViewCompat.setProfile(wv, profile) } catch (e: Exception) { }
                          }
                          applyWeb(wv)
                          wv.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                  if (done.get()) return
                                  mainHandler.postDelayed({
                                      if (!done.get() && view != null) extract(view, 0)
                                  }, 350)
                              }
                          }
                          if (referer.isNotEmpty()) wv.loadUrl(url, mapOf("Referer" to referer))
                          else wv.loadUrl(url)
                      } catch (e: Exception) {
                          resErr = e.message ?: "WebView load error"
                          done.set(true)
                          latch.countDown()
                      }
                  }

                  latch.await(25, TimeUnit.SECONDS)
                  if (!done.get()) {
                      done.set(true)
                      runOnUiThread { cleanup(holder[0]) }
                  }
                  if (cancelled.get()) throw Exception("Cancelled")
                  if (resErr != null) throw Exception(resErr)
                  if (resHtml.isEmpty()) throw Exception("Could not load folder page")
                  return resUrl to Jsoup.parse(resHtml, resUrl)
              }

              private fun findSingleSongRow(el: Element?): Element? {
                  var cur = el?.parent()
                  var depth = 0
                  while (cur != null && depth < 6) {
                      val tag = cur.tagName().lowercase(Locale.US)
                      if (tag == "tr" || tag == "li" || tag == "div" || tag == "p") {
                          if (cur.select("a").size <= 6 && cur.select("tr").size <= 1) {
                              return cur
                          }
                          return null
                      }
                      cur = cur.parent()
                      depth++
                  }
                  return null
              }

              private fun extractInlineTitle(el: Element?): String {
                  if (el == null) return ""
                  val stopTags = setOf("br", "tr", "li", "div", "p", "hr", "table")
                  fun scanFrom(anchor: Element): String {
                      var best = ""
                      fun checkNode(n: Node) {
                          val raw = when (n) {
                              is TextNode -> n.text()
                              is Element -> n.text()
                              else -> ""
                          }
                          val t = sanitizeName(raw)
                          if (!isJunkTitle(t) && t.length > best.length) best = t
                      }
                      var cur: Node? = anchor.nextSibling()
                      var steps = 0
                      while (cur != null && steps < 10) {
                          if (cur is Element && cur.tagName().lowercase(Locale.US) in stopTags) break
                          checkNode(cur)
                          cur = cur.nextSibling()
                          steps++
                      }
                      if (best.isNotEmpty()) return best
                      cur = anchor.previousSibling()
                      steps = 0
                      while (cur != null && steps < 10) {
                          if (cur is Element && cur.tagName().lowercase(Locale.US) in stopTags) break
                          checkNode(cur)
                          cur = cur.previousSibling()
                          steps++
                      }
                      return best
                  }
                  val direct = scanFrom(el)
                  if (direct.isNotEmpty()) return direct
                  val p = el.parent()
                  if (p != null && p.tagName().lowercase(Locale.US) == "span" && p.select("a").size <= 2) {
                      return scanFrom(p)
                  }
                  return ""
              }

              private fun extractRowTitle(row: Element?): String {
                  if (row == null) return ""
                  if (row.select("a").size > 8) return ""
                  var best = ""
                  for (a in row.select("a")) {
                      val t = sanitizeName(a.text())
                      if (!isJunkTitle(t) && t.length > best.length) best = t
                  }
                  if (best.isNotEmpty()) return best
                  for (el in row.select("td, th, span, font, b, strong, p, div")) {
                      if (el.select("tr").size > 1) continue
                      val t = sanitizeName(el.ownText().ifEmpty { el.text() })
                      if (!isJunkTitle(t) && t.length > best.length) best = t
                  }
                  if (best.isNotEmpty()) return best
                  val rt = sanitizeName(row.text())
                  return if (!isJunkTitle(rt)) rt else ""
              }

              private fun analyzePage(doc: Document, baseUrl: String, ignoreUrls: Set<String>): ScanResult {
                  val audios = mutableListOf<FoundLink>()
                  val seenAudio = HashSet<String>()
                  val handledRows = HashSet<Element>()

                  fun addAudio(rawUrl: String, rawTitle: String, row: Element?, el: Element?): Boolean {
                      val u = rawUrl.substringBefore('#').trim()
                      if (!u.startsWith("http")) return false
                      val nu = normUrl(u)
                      if (nu in seenAudio) return false
                      if (row != null && row in handledRows) return false
                      val cleaned = sanitizeName(rawTitle)
                      val rowFallback = if (isJunkTitle(cleaned)) {
                          extractRowTitle(row).ifEmpty { extractInlineTitle(el) }
                      } else ""
                      val title = when {
                          !isJunkTitle(cleaned) -> cleaned
                          rowFallback.isNotEmpty() -> rowFallback
                          else -> guessNameFromUrl(u)
                      }
                      seenAudio.add(nu)
                      if (row != null) handledRows.add(row)
                      audios.add(FoundLink(u, title))
                      return true
                  }

                  // 1. Direct audio links
                  for (a in doc.select("a[href]")) {
                      val h = a.absUrl("href").substringBefore('#').trim()
                      if (!h.startsWith("http") || !isAudioUrl(h)) continue
                      val row = findSingleSongRow(a)
                      val rawT = sanitizeName(a.text())
                      val t = if (!isJunkTitle(rawT)) rawT else extractRowTitle(row).ifEmpty { extractInlineTitle(a) }
                      addAudio(h, t, row, a)
                  }

                  // 2. <audio> / <source> tags
                  for (el in doc.select("audio[src], source[src]")) {
                      val h = el.absUrl("src")
                      if (isAudioUrl(h)) addAudio(h, "", findSingleSongRow(el), el)
                  }

                  // 3. Embedded audio URLs in onclick / data-* attributes
                  val mp3Re = Regex("https?://[^'\"\\s)]+\\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\\?[^'\"\\s)]*)?", RegexOption.IGNORE_CASE)
                  val relMp3Re = Regex("['\"]([^'\"]+\\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\\?[^'\"]*)?)['\"]", RegexOption.IGNORE_CASE)
                  for (el in doc.select("[onclick], [data-src], [data-url], [data-file], [data-mp3], [data-audio]")) {
                      val row = findSingleSongRow(el)
                      val rawElText = sanitizeName(el.text())
                      val title = if (!isJunkTitle(rawElText)) rawElText else extractRowTitle(row).ifEmpty { extractInlineTitle(el) }
                      for (attr in listOf("data-src", "data-url", "data-file", "data-mp3", "data-audio", "onclick")) {
                          val v = el.attr(attr)
                          if (v.isEmpty()) continue
                          val m = mp3Re.find(v)
                          if (m != null) {
                              addAudio(m.value, title, row, el)
                          } else {
                              val m2 = relMp3Re.find(v)
                              if (m2 != null) {
                                  try {
                                      val abs = URL(URL(baseUrl), m2.groupValues[1]).toString()
                                      addAudio(abs, title, row, el)
                                  } catch (e: Exception) { }
                              }
                          }
                      }
                  }

                  // 4. Song rows with download-icon links (only single-song rows not handled in steps 1-3)
                  val sizeInRowRe = Regex("\\b[0-9]+(\\.[0-9]+)?\\s*(mb|kb|gb)\\b", RegexOption.IGNORE_CASE)
                  for (row in doc.select("tr, li, div, p")) {
                      if (row in handledRows) continue
                      val links = row.select("a[href]")
                      if (links.isEmpty() || links.size > 6 || row.select("tr").size > 1) continue
                      var dlHref = ""
                      var rowAlreadyHandled = false
                      val rowHasSize = sizeInRowRe.containsMatchIn(row.text())
                      for (la in links) {
                          val h = la.absUrl("href").substringBefore('#').trim()
                          if (normUrl(h) in seenAudio) { rowAlreadyHandled = true; break }
                          if (dlHref.isEmpty() && h.startsWith("http") && sameHost(h, baseUrl)) {
                              val img = la.selectFirst("img")
                              val hint = ((img?.attr("src") ?: "") + " " + (img?.attr("alt") ?: "") + " " +
                                  (img?.attr("title") ?: "") + " " + la.attr("title")).lowercase(Locale.US)
                              val hl = h.lowercase(Locale.US)
                              val isPlay = hint.contains("play") && !hint.contains("dl") && !hint.contains("down")
                              val isDl = hl.contains("download") || hl.contains("dl=") || hl.contains("file=") ||
                                  hl.contains("/dl/") || hint.contains("dl") || hint.contains("down") || hint.contains("save")
                              val isIconInSizedRow = rowHasSize && !isPlay && la.text().trim().isEmpty() && img != null && !hint.contains("plus") && !hint.contains("add")
                              if (isDl || isIconInSizedRow) {
                                  dlHref = h
                              }
                          }
                      }
                      if (!rowAlreadyHandled && dlHref.isNotEmpty()) {
                          val bestTitle = extractRowTitle(row)
                          if (bestTitle.isNotEmpty()) addAudio(dlHref, bestTitle, row, row)
                      }
                  }

                  // 5. Inline <script> playlists (e.g. jPlayer Jukebox)
                  val scriptMp3Re = Regex("['\"]([^'\"\\s<>]+\\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\\?[^'\"\\s<>]*)?)['\"]", RegexOption.IGNORE_CASE)
                  for (sc in doc.select("script")) {
                      val st = sc.data()
                      if (st.isEmpty() || st.length > 300000) continue
                      for (m in scriptMp3Re.findAll(st)) {
                          val raw = m.groupValues[1]
                          try {
                              val abs = URL(URL(baseUrl), raw).toString()
                              addAudio(abs, "", null, null)
                          } catch (e: Exception) { }
                      }
                  }

                  // 6. Subfolder links (if songs exist on this page, only keep strict child folders / folder-icon links)
                  val folders = mutableListOf<FoundLink>()
                  val seenFolders = HashSet<String>()
                  val hasAudios = audios.isNotEmpty()
                  for (a in doc.select("a[href]")) {
                      if (a.closest("header, nav, footer") != null) continue
                      val h = a.absUrl("href").substringBefore('#').trim()
                      if (!h.startsWith("http") || !sameHost(h, baseUrl)) continue
                      val ext = urlExt(h)
                      if (ext in AUDIO_EXTS || ext in SKIP_EXTS) continue
                      if (isParentUrl(h, baseUrl)) continue
                      val nu = normUrl(h)
                      if (nu in ignoreUrls || nu in seenAudio || nu in seenFolders) continue
                      if (hasAudios && !isLikelyChildFolder(a, h, baseUrl)) continue
                      val label = sanitizeName(
                          a.text().trim()
                              .ifEmpty { a.attr("title").trim() }
                              .ifEmpty { a.selectFirst("img")?.attr("alt")?.trim() ?: "" }
                      )
                      if (label.isEmpty()) continue
                      if (label.length == 1 && !label[0].isLetterOrDigit()) continue
                      val low = label.lowercase(Locale.US)
                      if (low in SKIP_WORDS) continue
                      val pathLow = (Uri.parse(h).path ?: "").lowercase(Locale.US)
                      if (pathLow.endsWith("/login") || pathLow.endsWith("/register") || pathLow.endsWith("/search") ||
                          pathLow.endsWith("/chat") || pathLow.endsWith("/forum")
                      ) continue
                      seenFolders.add(nu)
                      folders.add(FoundLink(h, label))
                  }

                  return ScanResult(audios, folders)
              }

              private fun startFolderBatch(
                  rootFolder: String,
                  rootUrl: String,
                  rootAudios: List<FoundLink>,
                  selectedFolders: List<FoundLink>,
                  skippedUrls: Set<String>,
                  templateLinks: Set<String>,
                  ua: String?,
                  profile: String
              ) {
                  val cleanRoot = sanitizeFolder(rootFolder)
                  val msg = if (selectedFolders.isNotEmpty()) {
                      "Scanning ${selectedFolders.size} folder(s) & starting downloads..."
                  } else {
                      "Starting ${rootAudios.size} song download(s)..."
                  }
                  toast(msg)
                  dlTab = 0
                  flyToDownload()
                  if (rootAudios.isNotEmpty()) {
                      enqueueAudioList(rootAudios, cleanRoot, rootUrl, ua, profile, false)
                  }
                  if (selectedFolders.isEmpty()) return
                  activeBatchCancel?.set(true)
                  val batchCancelled = AtomicBoolean(false)
                  activeBatchCancel = batchCancelled
                  Thread {
                      var queuedSongs = rootAudios.size
                      var scannedCount = 0
                      val visited = HashSet<String>(templateLinks)
                      visited.addAll(skippedUrls)
                      visited.add(normUrl(rootUrl))
                      val seenSongKeys = HashSet<String>()
                      val rootSlash = cleanRoot.count { it == '/' }
                      val queue = ArrayDeque<Triple<FoundLink, String, String>>()
                      for (sf in selectedFolders) {
                          queue.addLast(Triple(sf, sanitizeFolder("$cleanRoot/${sf.name}"), rootUrl))
                      }
                      while (!batchCancelled.get() && queue.isNotEmpty() && scannedCount < 200 && queuedSongs < 3000) {
                          val (folderLink, folderPath, refUrl) = queue.removeFirst()
                          val nf = normUrl(folderLink.url)
                          if (!visited.add(nf)) continue
                          scannedCount++
                          try {
                              val (subFinal, subDoc) = fetchHtml(folderLink.url, ua, profile, refUrl, batchCancelled)
                              if (batchCancelled.get()) break
                              visited.add(normUrl(subFinal))
                              val subRes = analyzePage(subDoc, subFinal, visited)
                              if (subRes.audios.isNotEmpty()) {
                                  val uniqueAudios = subRes.audios.filter {
                                      val k1 = "$folderPath|${normUrl(it.url)}"
                                      seenSongKeys.add(k1)
                                  }
                                  if (uniqueAudios.isNotEmpty()) {
                                      queuedSongs += uniqueAudios.size
                                      runOnUiThread {
                                          if (!batchCancelled.get()) {
                                              enqueueAudioList(uniqueAudios, folderPath, subFinal, ua, profile, false)
                                          }
                                      }
                                  }
                              }
                              val isLetterTab = folderLink.name.length == 1 || folderLink.name.equals("Other", ignoreCase = true)
                              if (subRes.folders.isNotEmpty()) {
                                  val relDepth = folderPath.count { it == '/' } - rootSlash
                                  if (relDepth < 6) {
                                      for (sub2 in subRes.folders) {
                                          if (isLetterTab && (sub2.name.length == 1 || sub2.name.equals("Other", ignoreCase = true))) continue
                                          if (normUrl(sub2.url) !in visited) {
                                              queue.addLast(Triple(sub2, sanitizeFolder("$folderPath/${sub2.name}"), subFinal))
                                          }
                                      }
                                  }
                              }
                          } catch (e: Exception) { }
                      }
                      if (!batchCancelled.get()) {
                          runOnUiThread {
                              toast("Queued $queuedSongs songs in $cleanRoot")
                          }
                      }
                  }.start()
              }

              private fun enqueueAudioList(
                  audios: List<FoundLink>,
                  folderPath: String,
                  pageUrl: String,
                  ua: String?,
                  profile: String,
                  animate: Boolean
              ) {
                  if (audios.isEmpty()) return
                  val cleanFolder = sanitizeFolder(folderPath)
                  val usedNames = HashSet<String>()
                  for (existing in items) {
                      if (existing.folder == cleanFolder && existing.title.isNotEmpty()) {
                          usedNames.add(existing.title.lowercase(Locale.US))
                      }
                  }
                  val toRun = mutableListOf<DlItem>()
                  for (a in audios) {
                      val ext = urlExt(a.url).let { if (it in AUDIO_EXTS) ".$it" else ".mp3" }
                      var cleanTitle = sanitizeName(a.name).ifEmpty { "Track" }
                      if (!usedNames.add(cleanTitle.lowercase(Locale.US))) {
                          val fromUrl = guessNameFromUrl(a.url)
                          if (!isJunkTitle(fromUrl) && usedNames.add(fromUrl.lowercase(Locale.US))) {
                              cleanTitle = fromUrl
                          } else {
                              var n = 2
                              while (!usedNames.add("$cleanTitle ($n)".lowercase(Locale.US))) n++
                              cleanTitle = "$cleanTitle ($n)"
                          }
                      }
                      val d = DlItem(cleanTitle, 0, 0, null, null, "")
                      d.kind = 1
                      d.link = a.url
                      d.page = pageUrl
                      d.profile = profile
                      d.ua = ua
                      d.name = cleanTitle + ext
                      d.folder = cleanFolder
                      d.customName = true
                      d.expectAudio = true
                      items.add(0, d)
                      toRun.add(d)
                  }
                  dlTab = 0
                  if (animate) {
                      flyToDownload()
                      toast("Added ${audios.size} songs to Downloads")
                  }
                  scheduleSaveItems()
                  if (dlPage.visibility == View.VISIBLE) refreshDl()
                  for (d in toRun) {
                      d.stop = 0
                      d.state = 0
                      d.gen++
                      val g = d.gen
                      directExec.execute { runDirect(d, g) }
                  }
              }

              // ---------- keep tabs when the app is closed / reopened ----------

              override fun onStop() {
                  super.onStop()
                  if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
                  saveTabs()
                  saveItemsAsync()
              }

              private fun saveTabs() {
                  try {
                      val dir = File(filesDir, "tabs")
                      dir.mkdirs()
                      dir.listFiles()?.forEach { it.delete() }
                      val arr = JSONArray()
                      for (i in 0 until tabs.size) {
                          val t = tabs[i]
                          val url = t.web.url ?: ""
                          arr.put(JSONObject().put("home", t.home).put("url", url).put("profile", t.profile))
                          if (url.isNotEmpty()) {
                              try {
                                  val b = Bundle()
                                  t.web.saveState(b)
                                  val p = Parcel.obtain()
                                  p.writeBundle(b)
                                  File(dir, "t" + i + ".bin").writeBytes(p.marshall())
                                  p.recycle()
                              } catch (e: Exception) { }
                          }
                          val bmp = t.thumb
                          if (bmp != null) {
                              try {
                                  FileOutputStream(File(dir, "thumb$i.jpg")).use { out ->
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 75, out)
                                  }
                              } catch (e: Exception) { }
                          }
                      }
                      for (t in tabs) {
                          try { cookiesFor(t.profile).flush() } catch (e: Exception) { }
                      }
                      prefs.edit().putString("tabs", arr.toString()).putInt("cur", cur).apply()
                  } catch (e: Exception) { }
              }

              private fun restoreTabs() {
                  try {
                      val arr = JSONArray(prefs.getString("tabs", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          newTab(o.optString("profile", ""))
                          val t = tabs[tabs.size - 1]
                          t.home = o.optBoolean("home", true)
                          val tf = File(filesDir, "tabs/thumb$i.jpg")
                          if (tf.exists()) {
                              try { t.thumb = BitmapFactory.decodeFile(tf.absolutePath) } catch (e: Exception) { }
                          }
                          val url = o.optString("url")
                          if (url.isNotEmpty()) {
                              var restored = false
                              val f = File(filesDir, "tabs/t" + i + ".bin")
                              if (f.exists()) {
                                  try {
                                      val bytes = f.readBytes()
                                      val p = Parcel.obtain()
                                      p.unmarshall(bytes, 0, bytes.size)
                                      p.setDataPosition(0)
                                      val b = p.readBundle(MainActivity::class.java.classLoader)
                                      p.recycle()
                                      if (b != null && t.web.restoreState(b) != null) restored = true
                                  } catch (e: Exception) { }
                              }
                              if (!restored) t.web.loadUrl(url)
                          }
                      }
                  } catch (e: Exception) { }
                  if (tabs.isEmpty()) newTab()
                  showTab(prefs.getInt("cur", 0).coerceIn(0, tabs.size - 1))
              }

              // ---------- separate logins per tab ----------

              private val multiProfile: Boolean by lazy {
                  try { WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE) } catch (e: Exception) { false }
              }

              private fun cookiesFor(profile: String): CookieManager {
                  if (profile.isNotEmpty() && multiProfile) {
                      try {
                          return ProfileStore.getInstance().getOrCreateProfile(profile).cookieManager
                      } catch (e: Exception) { }
                  }
                  return CookieManager.getInstance()
              }

              // Remove the stored logins of tabs that no longer exist.
              private fun cleanupProfiles() {
                  if (!multiProfile) return
                  try {
                      val store = ProfileStore.getInstance()
                      val used = tabs.map { it.profile }.toSet()
                      for (n in store.allProfileNames) {
                          if (n != "Default" && n !in used) {
                              try { store.deleteProfile(n) } catch (e: Exception) { }
                          }
                      }
                  } catch (e: Exception) { }
              }

              private fun deleteProfileLater(name: String) {
                  if (name.isEmpty() || !multiProfile) return
                  mainHandler.postDelayed({
                      try { ProfileStore.getInstance().deleteProfile(name) } catch (e: Exception) { }
                  }, 2000)
              }

              // ---------- pages ----------

              private fun showPage(p: View) {
                  setBarsHidden(false)
                  p.visibility = View.VISIBLE
                  if (p === setPage) updateSettingsUi()
                  if (p === dlPage) refreshDl()
                  updateFab()
              }

              private fun hidePages() {
                  dlPage.visibility = View.GONE
                  setPage.visibility = View.GONE
                  tabsPage.visibility = View.GONE
                  updateFab()
              }

              private fun updateFab() {
                  val show = !tabs[cur].home &&
                      dlPage.visibility != View.VISIBLE &&
                      setPage.visibility != View.VISIBLE &&
                      tabsPage.visibility != View.VISIBLE
                  fab.visibility = if (show) View.VISIBLE else View.GONE
              }

              override fun onBackPressed() {
                  if (customView != null) { hideCustom(); return }
                  if (dlPage.visibility == View.VISIBLE || setPage.visibility == View.VISIBLE || tabsPage.visibility == View.VISIBLE) {
                      hidePages()
                      return
                  }
                  val t = tabs[cur]
                  if (!t.home && t.web.canGoBack()) t.web.goBack()
                  else if (!t.home) { t.home = true; refresh() }
                  else super.onBackPressed()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == REQ_FILE) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCb = null
                  } else if (requestCode == REQ_TREE) {
                      val u = data?.data
                      if (resultCode == RESULT_OK && u != null) {
                          try {
                              contentResolver.takePersistableUriPermission(
                                  u, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              )
                          } catch (e: Exception) { }
                          prefs.edit().putString("folder", u.toString()).apply()
                          updateSettingsUi()
                          toast("Download folder changed")
                      }
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              // ---------- floating download button ----------

              @SuppressLint("ClickableViewAccessibility")
              private fun setupFab() {
                  var dx = 0f
                  var dy = 0f
                  var sx = 0f
                  var sy = 0f
                  var drag = false
                  var moved = false
                  val longPress = Runnable {
                      drag = true
                      fab.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                      fab.animate().scaleX(1.2f).scaleY(1.2f).setDuration(100).start()
                  }
                  fab.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY
                              dx = v.x - e.rawX; dy = v.y - e.rawY
                              drag = false; moved = false
                              mainHandler.postDelayed(longPress, 400)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!drag && (abs(e.rawX - sx) > 20 || abs(e.rawY - sy) > 20)) {
                                  mainHandler.removeCallbacks(longPress)
                                  moved = true
                              }
                              if (drag) {
                                  val p = v.parent as View
                                  v.x = (e.rawX + dx).coerceIn(0f, (p.width - v.width).toFloat())
                                  v.y = (e.rawY + dy).coerceIn(0f, (p.height - v.height).toFloat())
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              mainHandler.removeCallbacks(longPress)
                              v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                              if (!drag && !moved) askDownload()
                              drag = false
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              mainHandler.removeCallbacks(longPress)
                              v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                              drag = false
                          }
                      }
                      true
                  }
              }

              // ---------- bookmarks & menu ----------

              private fun addBookmark() {
                  val t = tabs[cur]
                  val u = if (t.home) null else t.web.url
                  if (u == null) { toast("Open a page first"); return }
                  val set = prefs.getStringSet("bmk", emptySet())!!.toMutableSet()
                  set.add(u)
                  prefs.edit().putStringSet("bmk", set).apply()
                  toast("Bookmarked")
              }

              private fun showMenu(anchor: View) {
                  val themed = ContextThemeWrapper(
                      this,
                      if (dark) android.R.style.Theme_Material else android.R.style.Theme_Material_Light
                  )
                  val pm = PopupMenu(themed, anchor)
                  pm.menu.add(0, 1, 0, if (desktop) "Desktop mode: ON" else "Desktop mode: OFF")
                  pm.menu.add(0, 6, 1, if (orient == 1) "Landscape mode: ON" else "Landscape mode: OFF")
                  pm.menu.add(0, 2, 2, "Downloads")
                  pm.menu.add(0, 3, 3, "Bookmarks")
                  pm.menu.add(0, 4, 4, "Share link")
                  pm.menu.add(0, 5, 5, "Settings")
                  pm.setOnMenuItemClickListener {
                      when (it.itemId) {
                          1 -> toggleDesktop()
                          6 -> {
                              orient = if (orient == 1) 0 else 1
                              prefs.edit().putInt("orient", orient).apply()
                              applyOrientation()
                              toast(if (orient == 1) "Landscape mode ON" else "Screen orientation: Auto")
                          }
                          2 -> showPage(dlPage)
                          3 -> {
                              val list = prefs.getStringSet("bmk", emptySet())!!.toTypedArray()
                              dlg().setTitle("Bookmarks")
                                  .setItems(list) { _, i -> open(list[i]) }
                                  .setNeutralButton("Clear all") { _, _ -> prefs.edit().remove("bmk").apply() }
                                  .show()
                          }
                          4 -> {
                              val t = tabs[cur]
                              val u = if (t.home) null else t.web.url
                              if (u != null) {
                                  val i = Intent(Intent.ACTION_SEND)
                                  i.type = "text/plain"
                                  i.putExtra(Intent.EXTRA_TEXT, u)
                                  startActivity(Intent.createChooser(i, "Share"))
                              }
                          }
                          5 -> showPage(setPage)
                      }
                      true
                  }
                  pm.show()
              }

              // ---------- downloads ----------

              private fun retryAllFailed() {
                  val toRun = items.filter { it.state == 3 || it.state == 4 }.reversed()
                  if (toRun.isEmpty()) return
                  for (d in toRun) {
                      d.stop = 0
                      d.state = 0
                      d.gen++
                      val g = d.gen
                      if (d.kind == 0) {
                          val ck = cookieText(d.link, d.profile)
                          exec.execute { runDownload(d, ck, g) }
                      } else {
                          directExec.execute { runDirect(d, g) }
                      }
                  }
                  refreshDl()
                  toast("Starting ${toRun.size} downloads")
              }

              private fun clearDownloadsTab() {
                  if (dlTab == 0) {
                      val active = items.filter { it.state != 2 }
                      if (active.isEmpty()) return
                      dlg().setTitle("Clear downloading list?")
                          .setMessage("Remove all ${active.size} active/failed items?")
                          .setPositiveButton("Clear") { _, _ ->
                              activeBatchCancel?.set(true)
                              for (d in active) {
                                  d.stop = 2
                                  d.gen++
                                  if (d.kind == 0) {
                                      try { YoutubeDL.getInstance().destroyProcessById(d.id) } catch (e: Exception) { }
                                  }
                                  File(filesDir, "parts/" + d.id).deleteRecursively()
                              }
                              items.removeAll { it.state != 2 }
                              saveItemsAsync()
                              refreshDl()
                              toast("Cleared")
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  } else {
                      val done = items.filter { it.state == 2 }
                      if (done.isEmpty()) return
                      dlg().setTitle("Clear history?")
                          .setMessage("Remove ${done.size} items from this list? (Files on your phone will stay)")
                          .setPositiveButton("Clear") { _, _ ->
                              items.removeAll { it.state == 2 }
                              saveItemsAsync()
                              refreshDl()
                              toast("Cleared")
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  }
              }

              private fun fmtSize(b: Long): String = when {
                  b >= 1073741824L -> String.format(Locale.US, "%.2f GB", b / 1073741824.0)
                  b >= 1048576L -> String.format(Locale.US, "%.1f MB", b / 1048576.0)
                  b >= 1024L -> String.format(Locale.US, "%.0f KB", b / 1024.0)
                  else -> b.toString() + " B"
              }

              private val ytRe = Regex("(?:[?&]v=|youtu\\.be/|/shorts/|/embed/|/live/)([A-Za-z0-9_-]{11})")

              private fun isYt(link: String): Boolean {
                  val h = Uri.parse(link).host ?: return false
                  return h.endsWith("youtube.com") || h == "youtu.be"
              }

              private fun ytId(link: String): String =
                  if (!isYt(link)) "" else (ytRe.find(link)?.groupValues?.get(1) ?: "")

              private fun vidOf(link: String): String = ytId(link).ifEmpty { link }

              private fun normalUrl(link: String): String {
                  val id = ytId(link)
                  return if (id.isEmpty()) link else "https://www.youtube.com/watch?v=" + id
              }

              private fun fileExists(d: DlItem): Boolean {
                  val u = d.uri ?: return false
                  return try {
                      contentResolver.openAssetFileDescriptor(Uri.parse(u), "r")?.use { true } ?: false
                  } catch (e: Exception) {
                      false
                  }
              }

              // 2 = already downloaded (file still exists), 1 = download in progress, 0 = free
              private fun qStatus(vid: String, key: String): Int {
                  for (d in items) {
                      if (d.kind == 0 && d.vid == vid && d.qkey == key) {
                          if (d.state == 2) {
                              if (fileExists(d)) return 2
                          } else if (d.state != 3) {
                              return 1
                          }
                      }
                  }
                  return 0
              }

              private fun askDownload() {
                  val t = tabs[cur]
                  val page = if (t.home) null else t.web.url
                  if (page == null) { toast("Open a video page first"); return }
                  if (!ready) { toast("Downloader is starting, try again in a moment"); return }
                  if (isYt(page) && ytId(page).isEmpty()) {
                      toast("Open a video first, then tap download")
                      return
                  }
                  longPressVideo(page, t.web.title ?: "Video")
              }

              // Used when the exact list cannot be read: the downloader picks the best quality up to the chosen height.
              private fun standardQualities(): List<Q> {
                  val list = mutableListOf<Q>()
                  list.add(Q("Original quality (best)", "bv*+ba/b", false, 0L, "best", ""))
                  for (h in listOf(2160, 1440, 1080, 720, 480, 360, 240, 144)) {
                      list.add(Q(h.toString() + "p (or the closest lower)", "bv*[height<=" + h + "]+ba/b[height<=" + h + "]", false, 0L, "h" + h, "auto"))
                  }
                  list.add(Q("Audio only (MP3)", "", true, 0L, "mp3", "audio"))
                  return list
              }

              private fun showQualities(link: String, page: String, title: String, qs: List<Q>) {
                  val vid = vidOf(link)
                  val labels = qs.map {
                      when (qStatus(vid, it.key)) {
                          2 -> "\u2714\u2714 " + it.label + "  (downloaded)"
                          1 -> it.label + "  (downloading...)"
                          else -> it.label
                      }
                  }.toTypedArray()
                  dlg().setTitle("Choose quality")
                      .setItems(labels) { _, i ->
                          val q = qs[i]
                          when (qStatus(vid, q.key)) {
                              2 -> toast("Already downloaded in this quality")
                              1 -> toast("This quality is already downloading")
                              else -> enqueue(link, page, title, q)
                          }
                      }
                      .show()
              }

              // Long-press on a YouTube video: read that video's own qualities and show only those.
              private fun longPressVideo(url: String, title: String = "Video") {
                  if (!ready) { toast("Downloader is starting, try again in a moment"); return }
                  val link = normalUrl(url)
                  val ck = cookieText(link, tabs.getOrNull(cur)?.profile ?: "")
                  val wait = dlg().setTitle("Please wait")
                      .setMessage("Checking this video's qualities...")
                      .setCancelable(true)
                      .setOnCancelListener {
                          try { YoutubeDL.getInstance().destroyProcessById(qPid) } catch (e: Exception) { }
                      }
                      .show()
                  Thread {
                      var err = ""
                      val res: List<Q> = try {
                          fetchQualities(link, ck)
                      } catch (e: Exception) {
                          err = e.message ?: ""
                          emptyList()
                      }
                      runOnUiThread {
                          if (!wait.isShowing) return@runOnUiThread
                          wait.dismiss()
                          if (res.isNotEmpty()) {
                              showQualities(link, url, title, res)
                          } else {
                              dlg().setTitle("Could not read qualities")
                                  .setMessage(if (err.isEmpty()) "The downloader could not read this video's quality list." else err.take(500))
                                  .setPositiveButton("Standard list") { _, _ -> showQualities(link, url, title, standardQualities()) }
                                  .setNegativeButton("Cancel", null)
                                  .show()
                          }
                      }
                  }.start()
              }

              private fun fetchQualities(link: String, cookies: String?): List<Q> {
                  val cf = File(cacheDir, "cookies_q.txt")
                  val pid = "q" + System.nanoTime()
                  qPid = pid
                  val finished = AtomicBoolean(false)
                  Thread {
                      try { Thread.sleep(30000) } catch (e: Exception) { }
                      if (!finished.get()) {
                          try { YoutubeDL.getInstance().destroyProcessById(pid) } catch (e: Exception) { }
                      }
                  }.start()
                  try {
                      val req = YoutubeDLRequest(link)
                      req.addOption("--dump-single-json")
                      req.addOption("--no-playlist")
                      if (cookies != null) {
                          cf.writeText(cookies)
                          req.addOption("--cookies", cf.absolutePath)
                      }
                      val out = YoutubeDL.getInstance().execute(req, pid).out
                      val jsonLine = out.lines().lastOrNull { it.trimStart().startsWith("{") } ?: return emptyList()
                      val json = JSONObject(jsonLine)
                      val arr = json.optJSONArray("formats") ?: return emptyList()
                      val heights = java.util.TreeMap<Int, Long>()
                      val fpsBy = java.util.HashMap<Int, Int>()
                      var audioBest = 0L
                      for (i in 0 until arr.length()) {
                          val f = arr.getJSONObject(i)
                          val vc = f.optString("vcodec", "none")
                          val ac = f.optString("acodec", "none")
                          val h = f.optInt("height", 0)
                          val size = maxOf(f.optLong("filesize", 0L), f.optLong("filesize_approx", 0L))
                          if (vc != "none" && vc != "null" && h > 0) {
                              heights[h] = maxOf(heights[h] ?: 0L, size)
                              val fp = f.optDouble("fps", 0.0).toInt()
                              if (fp > (fpsBy[h] ?: 0)) fpsBy[h] = fp
                          } else if (vc == "none" && ac != "none" && ac != "null") {
                              audioBest = maxOf(audioBest, size)
                          }
                      }
                      if (heights.isEmpty()) return emptyList()
                      val list = mutableListOf<Q>()
                      val top = heights.lastKey()
                      val ab = audioBest
                      fun sz(v: Long): String = if (v > 0) " - ~" + fmtSize(v + ab) else ""
                      fun lab(h: Int): String {
                          val fp = fpsBy[h] ?: 0
                          return h.toString() + "p" + (if (fp > 30) fp.toString() else "")
                      }
                      val topSize = heights[top] ?: 0L
                      list.add(Q("Original quality (best) - " + lab(top) + sz(topSize), "bv*+ba/b", false, topSize + ab, "best", ""))
                      for (h in heights.descendingKeySet()) {
                          if (h == top) continue
                          val v = heights[h] ?: 0L
                          list.add(Q(lab(h) + sz(v), "bv*[height<=" + h + "]+ba/b[height<=" + h + "]", false, v + ab, "h" + h, h.toString() + "p"))
                      }
                      list.add(Q("Audio only (MP3)" + (if (ab > 0) " - ~" + fmtSize(ab) else ""), "", true, ab, "mp3", "audio"))
                      return list
                  } finally {
                      finished.set(true)
                      cf.delete()
                  }
              }

              private fun enqueue(link: String, page: String, title: String, q: Q) {
                  val d = DlItem(title, 0, 0, null, null, "")
                  d.kind = 0
                  d.link = link
                  d.page = page
                  d.audio = q.audio
                  d.fmt = q.fmt
                  d.total = q.bytes
                  d.vid = vidOf(link)
                  d.qkey = q.key
                  d.qtag = q.tag
                  d.profile = tabs.getOrNull(cur)?.profile ?: ""
                  items.add(0, d)
                  dlTab = 0
                  flyToDownload()
                  toast("Added to Downloads")
                  startRun(d)
              }

              private fun startRun(d: DlItem) {
                  d.stop = 0
                  d.state = 0
                  d.gen++
                  val g = d.gen
                  if (dlPage.visibility == View.VISIBLE) refreshDl()
                  if (d.kind == 0) {
                      val ck = cookieText(d.link, d.profile)
                      exec.execute { runDownload(d, ck, g) }
                  } else {
                      directExec.execute { runDirect(d, g) }
                  }
              }

              private fun pauseItem(d: DlItem) {
                  d.stop = 1
                  if (d.kind == 0) {
                      try { YoutubeDL.getInstance().destroyProcessById(d.id) } catch (e: Exception) { }
                  }
                  d.state = 4
                  scheduleSaveItems()
                  refreshDl()
              }

              private fun askDelete(d: DlItem) {
                  val msg = if (d.state == 2) "This will delete the file from your phone." else "This will cancel the download and remove it."
                  dlg().setTitle("Delete?")
                      .setMessage(msg)
                      .setPositiveButton("Delete") { _, _ -> deleteItem(d) }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun deleteItem(d: DlItem) {
                  d.stop = 2
                  d.gen++
                  if (d.kind == 0) {
                      try { YoutubeDL.getInstance().destroyProcessById(d.id) } catch (e: Exception) { }
                  }
                  val us = d.uri
                  if (!us.isNullOrEmpty()) {
                      try {
                          val u = Uri.parse(us)
                          if (DocumentsContract.isDocumentUri(this, u)) DocumentsContract.deleteDocument(contentResolver, u)
                          else contentResolver.delete(u, null, null)
                      } catch (e: Exception) { }
                  }
                  File(filesDir, "parts/" + d.id).deleteRecursively()
                  items.remove(d)
                  scheduleSaveItems()
                  refreshDl()
                  toast("Deleted")
              }

              private fun openPage(d: DlItem) {
                  val u = if (d.page.isNotEmpty()) d.page else d.link
                  if (u.isEmpty()) { toast("No page saved"); return }
                  hidePages()
                  newTab()
                  showTab(tabs.size - 1)
                  open(u)
              }

              private fun cookieText(link: String, profile: String): String? {
                  if (!cookiesOn) return null
                  val host = Uri.parse(link).host ?: return null
                  if (!host.endsWith("youtube.com") && host != "youtu.be") return null
                  val raw = cookiesFor(profile).getCookie("https://www.youtube.com") ?: return null
                  val sb = StringBuilder("# Netscape HTTP Cookie File\n")
                  for (part in raw.split(";")) {
                      val kv = part.trim().split("=", limit = 2)
                      if (kv.size == 2 && kv[0].isNotEmpty()) {
                          sb.append(".youtube.com\tTRUE\t/\tTRUE\t2000000000\t").append(kv[0]).append("\t").append(kv[1]).append("\n")
                      }
                  }
                  return sb.toString()
              }

              private fun ui() {
                  if (dlPage.visibility != View.VISIBLE) return
                  val now = System.currentTimeMillis()
                  val prev = lastUiUpdate.get()
                  if (now - prev >= 450 && lastUiUpdate.compareAndSet(prev, now)) {
                      runOnUiThread {
                          if (dlPage.visibility == View.VISIBLE) refreshDl()
                      }
                  }
              }

              private fun runDownload(d: DlItem, cookies: String?, g: Int) {
                  if (d.stop != 0 || d.gen != g) return
                  d.state = 1
                  ui()
                  val dir = File(filesDir, "parts/" + d.id)
                  val cf = File(cacheDir, "cookies" + d.id + ".txt")
                  try {
                      dir.mkdirs()
                      val req = YoutubeDLRequest(d.link)
                      val tag = if (d.qtag.isEmpty() || d.qtag == "audio") "" else if (d.qtag == "auto") " [%(height)sp]" else " [" + d.qtag + "]"
                      req.addOption("-o", dir.absolutePath + "/%(title).80s" + tag + ".%(ext)s")
                      req.addOption("--no-playlist")
                      if (cookies != null) {
                          cf.writeText(cookies)
                          req.addOption("--cookies", cf.absolutePath)
                      }
                      if (d.audio) {
                          req.addOption("-x")
                          req.addOption("--audio-format", "mp3")
                          req.addOption("--audio-quality", "0")
                      } else {
                          req.addOption("-f", d.fmt)
                          req.addOption("-S", "res,ext:mp4:m4a")
                          req.addOption("--merge-output-format", "mp4")
                      }

                      YoutubeDL.getInstance().execute(req, d.id) { p, _, line ->
                          if (d.gen == g) {
                              if (p >= 0f) d.progress = p.toInt().coerceIn(0, 100)
                              val m = SIZE_RE.find(line)
                              if (m != null) d.sizeLabel = m.groupValues[2]
                              ui()
                          }
                      }

                      val f = (dir.listFiles() ?: emptyArray())
                          .filter { !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") && !it.name.contains(".part-") }
                          .maxByOrNull { it.length() }
                          ?: throw Exception("No file was downloaded")
                      if (d.gen != g) return
                      d.title = f.nameWithoutExtension
                      saveFile(d, f)
                      d.total = f.length()
                      d.state = 2
                      d.progress = 100
                      runOnUiThread { toast("Downloaded: " + d.title) }
                  } catch (e: Exception) {
                      if (d.gen == g) {
                          if (d.stop == 1) {
                              d.state = 4
                          } else if (d.stop != 2) {
                              d.state = 3
                              d.msg = (e.message ?: "Unknown error").take(700)
                          }
                      }
                  } finally {
                      if (d.state == 2 || d.stop == 2) dir.deleteRecursively()
                      cf.delete()
                      runOnUiThread { finishItem(d) }
                  }
              }

              private fun ensureSafDir(rootTree: Uri, relFolder: String): Uri? {
                  var curId = DocumentsContract.getTreeDocumentId(rootTree)
                  var curUri = DocumentsContract.buildDocumentUriUsingTree(rootTree, curId)
                  for (seg in relFolder.split("/").filter { it.isNotEmpty() }) {
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(rootTree, curId)
                      var foundId: String? = null
                      contentResolver.query(
                          children,
                          arrayOf(
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                              DocumentsContract.Document.COLUMN_MIME_TYPE
                          ),
                          null, null, null
                      )?.use { c ->
                          while (c.moveToNext()) {
                              if (c.getString(1) == seg && c.getString(2) == DocumentsContract.Document.MIME_TYPE_DIR) {
                                  foundId = c.getString(0)
                                  break
                              }
                          }
                      }
                      if (foundId != null) {
                          curId = foundId!!
                          curUri = DocumentsContract.buildDocumentUriUsingTree(rootTree, curId)
                      } else {
                          curUri = DocumentsContract.createDocument(
                              contentResolver, curUri, DocumentsContract.Document.MIME_TYPE_DIR, seg
                          ) ?: return null
                          curId = DocumentsContract.getDocumentId(curUri)
                      }
                  }
                  return curUri
              }

              private fun saveFile(d: DlItem, f: File) {
                  synchronized(saveLock) {
                      val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(f.extension.lowercase())
                          ?: "application/octet-stream"
                      val cleanFolder = sanitizeFolder(d.folder)
                      var uri: Uri? = null
                      val tree = prefs.getString("folder", "") ?: ""
                      if (tree.isNotEmpty()) {
                          try {
                              val t = Uri.parse(tree)
                              val parent = if (cleanFolder.isEmpty()) {
                                  DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                              } else {
                                  ensureSafDir(t, cleanFolder)
                              }
                              if (parent != null) {
                                  deleteExistingSaf(f.name, t, DocumentsContract.getDocumentId(parent))
                                  uri = DocumentsContract.createDocument(contentResolver, parent, mime, f.name)
                              }
                          } catch (e: Exception) {
                              uri = null
                          }
                      }
                      if (uri == null) {
                          val rel = if (cleanFolder.isEmpty()) Environment.DIRECTORY_DOWNLOADS
                          else Environment.DIRECTORY_DOWNLOADS + "/" + cleanFolder
                          deleteExistingMedia(f.name, rel)
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, f.name)
                              put(MediaStore.MediaColumns.MIME_TYPE, mime)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, rel)
                          }
                          uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      }
                      val u = uri ?: throw Exception("Could not create file in the download folder")
                      contentResolver.openOutputStream(u)?.use { out ->
                          f.inputStream().use { it.copyTo(out) }
                      }
                      d.uri = u.toString()
                      d.mime = mime
                      d.name = f.name
                  }
              }

              private fun deleteExistingSaf(name: String, tree: Uri, parentDocId: String) {
                  try {
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, parentDocId)
                      val ids = mutableListOf<String>()
                      contentResolver.query(
                          children,
                          arrayOf(DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME),
                          null, null, null
                      )?.use { c ->
                          while (c.moveToNext()) {
                              if (c.getString(1) == name) ids.add(c.getString(0))
                          }
                      }
                      for (id in ids) {
                          DocumentsContract.deleteDocument(contentResolver, DocumentsContract.buildDocumentUriUsingTree(tree, id))
                      }
                  } catch (e: Exception) { }
              }

              private fun deleteExistingMedia(name: String, relPath: String) {
                  try {
                      val base = MediaStore.Downloads.EXTERNAL_CONTENT_URI
                      val rows = mutableListOf<Long>()
                      contentResolver.query(
                          base,
                          arrayOf(MediaStore.MediaColumns._ID),
                          MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                          arrayOf(name, relPath + "/"),
                          null
                      )?.use { c ->
                          while (c.moveToNext()) rows.add(c.getLong(0))
                      }
                      for (id in rows) contentResolver.delete(ContentUris.withAppendedId(base, id), null, null)
                  } catch (e: Exception) { }
              }

              private fun refreshDl() {
                  var active = 0
                  var hasFailed = false
                  var hasPaused = false
                  val filtered = ArrayList<DlItem>()
                  val wantActive = dlTab == 0
                  for (d in items) {
                      val isDone = d.state == 2
                      if (!isDone) {
                          active++
                          if (d.state == 3) hasFailed = true
                          else if (d.state == 4) hasPaused = true
                      }
                      if (isDone != wantActive) filtered.add(d)
                  }
                  shownCache = filtered
                  val done = items.size - active
                  val a = findViewById<TextView>(R.id.tabActive)
                  val b = findViewById<TextView>(R.id.tabDone)
                  a.text = "Downloading ($active)"
                  b.text = "Downloaded ($done)"
                  val accent = 0xFF2D7FF9.toInt()
                  for ((v, sel) in listOf(a to (dlTab == 0), b to (dlTab == 1))) {
                      v.setTextColor(if (sel) accent else col.sec)
                      v.setTypeface(null, if (sel) Typeface.BOLD else Typeface.NORMAL)
                      v.background = if (sel) shape(col.card, 20) else null
                  }
                  val retryBtn = findViewById<TextView>(R.id.dlRetryAll)
                  if (dlTab == 0 && (hasFailed || hasPaused)) {
                      retryBtn.text = if (hasFailed && !hasPaused) "Retry all" else "Resume all"
                      retryBtn.visibility = View.VISIBLE
                  } else {
                      retryBtn.visibility = View.GONE
                  }
                  findViewById<TextView>(R.id.dlEmpty).text =
                      if (dlTab == 0) "No active downloads" else "No downloaded files yet"
                  dlAdapter.notifyDataSetChanged()
              }

              private fun finishItem(d: DlItem) {
                  if (d.state == 2) items.removeAll { it !== d && it.state == 2 && it.name == d.name && it.folder == d.folder }
                  scheduleSaveItems()
                  if (dlPage.visibility == View.VISIBLE) refreshDl()
              }

              // Small download icon flies to the top-right download button.
              private fun flyToDownload() {
                  val root = findViewById<FrameLayout>(R.id.root)
                  val target = findViewById<View>(R.id.bDl)
                  val rl = IntArray(2)
                  val tl = IntArray(2)
                  root.getLocationOnScreen(rl)
                  target.getLocationOnScreen(tl)
                  val size = dp(44)
                  val v = ImageView(this)
                  v.setBackgroundResource(R.drawable.bg_fab)
                  v.setImageResource(R.drawable.ic_download)
                  v.setPadding(dp(10), dp(10), dp(10), dp(10))
                  val sx: Float
                  val sy: Float
                  if (fab.visibility == View.VISIBLE) {
                      val fl = IntArray(2)
                      fab.getLocationOnScreen(fl)
                      sx = (fl[0] - rl[0] + (fab.width - size) / 2).toFloat()
                      sy = (fl[1] - rl[1] + (fab.height - size) / 2).toFloat()
                  } else {
                      sx = ((root.width - size) / 2).toFloat()
                      sy = (root.height * 0.6f)
                  }
                  root.addView(v, FrameLayout.LayoutParams(size, size))
                  v.x = sx
                  v.y = sy
                  val ex = (tl[0] - rl[0] + (target.width - size) / 2).toFloat()
                  val ey = (tl[1] - rl[1] + (target.height - size) / 2).toFloat()
                  v.animate().x(ex).y(ey).scaleX(0.35f).scaleY(0.35f).alpha(0.4f)
                      .setDuration(750)
                      .setInterpolator(AccelerateDecelerateInterpolator())
                      .withEndAction {
                          root.removeView(v)
                          target.animate().scaleX(1.3f).scaleY(1.3f).setDuration(120).withEndAction {
                              target.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                          }.start()
                      }
                      .start()
              }

              // ---------- direct file downloads (links inside web pages) ----------

              private fun startDirectNamed(
                  url: String,
                  titleHint: String,
                  page: String,
                  profile: String,
                  folderPath: String,
                  expectAudio: Boolean,
                  uaHint: String? = null
              ) {
                  val cleanTitle = sanitizeName(titleHint)
                  val rawName = URLUtil.guessFileName(url, null, if (expectAudio) "audio/mpeg" else null)
                  val ext = urlExt(url).let { if (it in AUDIO_EXTS) ".$it" else if (expectAudio) ".mp3" else "" }
                  val useCustom = !isJunkTitle(cleanTitle)
                  val finalName = if (useCustom) {
                      val e = ext.ifEmpty { "." + rawName.substringAfterLast('.', "mp3") }
                      cleanTitle + e
                  } else {
                      rawName
                  }
                  val d = DlItem(if (useCustom) cleanTitle else rawName.substringBeforeLast("."), 0, 0, null, null, "")
                  d.kind = 1
                  d.link = url
                  d.page = page
                  d.profile = profile
                  d.ua = uaHint ?: currentWebUa()
                  d.name = finalName
                  d.folder = sanitizeFolder(folderPath)
                  d.customName = useCustom
                  d.expectAudio = expectAudio
                  items.add(0, d)
                  dlTab = 0
                  flyToDownload()
                  toast("Downloading " + finalName)
                  startRun(d)
              }

              private fun startDirect(url: String, ua: String?, cd: String?, mimeHint: String?, page: String, profile: String) {
                  val guessed = URLUtil.guessFileName(url, cd, mimeHint)
                  val hintFresh = System.currentTimeMillis() - pendingClickTime < 5000
                  val cleanHint = if (hintFresh) sanitizeName(pendingClickName) else ""
                  val isAudio = isAudioUrl(url) || (mimeHint?.lowercase()?.startsWith("audio/") == true) ||
                      urlExt(guessed) in AUDIO_EXTS
                  val useCustom = isAudio && !isJunkTitle(cleanHint)
                  val ext = urlExt(url).let { if (it in AUDIO_EXTS) ".$it" else "." + guessed.substringAfterLast('.', "mp3") }
                  val finalName = if (useCustom) cleanHint + ext else guessed
                  val d = DlItem(if (useCustom) cleanHint else guessed.substringBeforeLast("."), 0, 0, null, null, "")
                  d.kind = 1
                  d.link = url
                  d.page = page
                  d.profile = profile
                  d.ua = ua ?: currentWebUa()
                  d.name = finalName
                  d.customName = useCustom
                  d.expectAudio = isAudio
                  items.add(0, d)
                  dlTab = 0
                  flyToDownload()
                  toast("Downloading " + finalName)
                  startRun(d)
              }

              private fun openFollow(
                  start: String,
                  ua: String?,
                  offset: Long,
                  profile: String,
                  referer: String = ""
              ): HttpURLConnection {
                  var url = start.trim().replace(" ", "%20")
                  for (hop in 0..10) {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      c.setRequestProperty("User-Agent", ua ?: MOBILE_UA)
                      c.setRequestProperty("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                      c.setRequestProperty("Accept-Language", "en-US,en;q=0.9")
                      if (referer.isNotEmpty()) c.setRequestProperty("Referer", referer)
                      val ck = cookiesFor(profile).getCookie(url)
                      if (ck != null) c.setRequestProperty("Cookie", ck)
                      if (offset > 0) c.setRequestProperty("Range", "bytes=" + offset + "-")
                      val code = c.responseCode
                      if (code in 300..399) {
                          val loc = c.getHeaderField("Location") ?: throw Exception("Bad redirect")
                          url = URL(URL(url), loc).toString().replace(" ", "%20")
                          c.disconnect()
                          continue
                      }
                      if (code !in 200..299) {
                          c.disconnect()
                          throw HttpCodeException(code)
                      }
                      return c
                  }
                  throw Exception("Too many redirects")
              }

              private fun audioExtFromMeta(cd: String?, url: String, ct: String): String {
                  val cdName = if (!cd.isNullOrEmpty()) URLUtil.guessFileName(url, cd, null) else ""
                  val e1 = urlExt(cdName)
                  if (e1 in AUDIO_EXTS) return ".$e1"
                  val e2 = urlExt(url)
                  if (e2 in AUDIO_EXTS) return ".$e2"
                  return when {
                      ct.contains("flac") -> ".flac"
                      ct.contains("mp4") || ct.contains("aac") || ct.contains("m4a") -> ".m4a"
                      ct.contains("ogg") -> ".ogg"
                      ct.contains("wav") -> ".wav"
                      else -> ".mp3"
                  }
              }

              inner class WvDlBridge {
                  @JavascriptInterface
                  fun onMeta(tok: String, total: Long, ct: String) {
                      if (tok != wvToken) return
                      val d = wvD ?: return
                      wvLastAct.set(System.currentTimeMillis())
                      if (total > 0) d.total = total
                      if (d.customName) {
                          val ext = audioExtFromMeta(null, d.link, ct)
                          d.name = sanitizeName(d.title).ifEmpty { "Track" } + ext
                      }
                  }

                  @JavascriptInterface
                  fun onChunk(tok: String, b64: String) {
                      if (tok != wvToken) return
                      val d = wvD ?: return
                      if (d.stop != 0 || d.gen != wvGen) return
                      wvLastAct.set(System.currentTimeMillis())
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      synchronized(wvFosLock) {
                          wvFos?.write(bytes)
                      }
                      wvDoneBytes += bytes.size
                      d.done = wvDoneBytes
                      if (d.total > 0) d.progress = (wvDoneBytes * 100 / d.total).toInt().coerceIn(0, 100)
                      ui()
                  }

                  @JavascriptInterface
                  fun onDone(tok: String) {
                      if (tok != wvToken) return
                      wvLastAct.set(System.currentTimeMillis())
                      if (wvFinished.compareAndSet(false, true)) {
                          wvCompleted = true
                          wvLatch?.countDown()
                      }
                  }

                  @JavascriptInterface
                  fun onFail(tok: String, msg: String) {
                      if (tok != wvToken) return
                      if (wvFinished.compareAndSet(false, true)) {
                          if (msg != "STOPPED") wvErr = msg
                          wvLatch?.countDown()
                      }
                  }

                  @JavascriptInterface
                  fun shouldStop(tok: String): Boolean {
                      if (tok != wvToken) return true
                      val d = wvD ?: return true
                      return d.stop != 0 || d.gen != wvGen
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun downloadViaWebView(d: DlItem, g: Int, tmpFile: File): Boolean {
                  synchronized(wvDlLock) {
                      if (d.stop != 0 || d.gen != g) return false
                      val linkUri = Uri.parse(d.link)
                      val linkHost = (linkUri.host ?: "").lowercase(Locale.US)
                      val pageUri = if (d.page.isNotEmpty()) Uri.parse(d.page) else null
                      val originUrl = if (pageUri != null && linkHost.equals(pageUri.host, ignoreCase = true)) {
                          d.page
                      } else {
                          "${linkUri.scheme ?: "https"}://${linkUri.host ?: ""}/"
                      }

                      val token = "${d.id}_$g"
                      val latch = CountDownLatch(1)
                      if (tmpFile.exists()) tmpFile.delete()
                      val fos = FileOutputStream(tmpFile, false)

                      wvD = d
                      wvGen = g
                      wvToken = token
                      synchronized(wvFosLock) { wvFos = fos }
                      wvLatch = latch
                      wvCompleted = false
                      wvErr = null
                      wvDoneBytes = 0L
                      wvLastAct.set(System.currentTimeMillis())
                      wvFinished.set(false)

                      val urlLiteral = JSONObject.quote(d.link)
                      val tokLiteral = JSONObject.quote(token)
                      val fetchJs = """
                      (async function(tok){
                        try {
                          var resp = null;
                          for (var tries = 0; tries < 3; tries++) {
                            if (DL.shouldStop(tok)) { DL.onFail(tok, 'STOPPED'); return; }
                            resp = await fetch($urlLiteral, { credentials: 'include' });
                            if (resp.ok) break;
                            if ((resp.status === 409 || resp.status === 429 || resp.status === 503) && tries < 2) {
                              var waitMs = (tries + 1) * 2000;
                              await new Promise(function(r){ setTimeout(r, waitMs); });
                              continue;
                            }
                            DL.onFail(tok, 'Server returned HTTP ' + resp.status);
                            return;
                          }
                          var ct = (resp.headers.get('content-type') || '').toLowerCase();
                          if (ct.indexOf('text/html') >= 0) { DL.onFail(tok, 'Server returned webpage instead of MP3'); return; }
                          var len = parseInt(resp.headers.get('content-length') || '0', 10) || 0;
                          DL.onMeta(tok, len, ct);
                          function u8ToB64(u8) {
                            var s = '';
                            for (var i = 0; i < u8.length; i += 8192) {
                              s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + 8192, u8.length)));
                            }
                            return btoa(s);
                          }
                          function sendChunks(u8) {
                            var CHUNK = 49152;
                            for (var i = 0; i < u8.length; i += CHUNK) {
                              if (DL.shouldStop(tok)) return false;
                              DL.onChunk(tok, u8ToB64(u8.subarray(i, Math.min(i + CHUNK, u8.length))));
                            }
                            return true;
                          }
                          if (!resp.body || !resp.body.getReader) {
                            var ab = new Uint8Array(await resp.arrayBuffer());
                            if (sendChunks(ab)) DL.onDone(tok);
                            else DL.onFail(tok, 'STOPPED');
                            return;
                          }
                          var reader = resp.body.getReader();
                          var pending = [];
                          var pendingLen = 0;
                          function flush() {
                            if (pendingLen === 0) return true;
                            var merged = new Uint8Array(pendingLen);
                            var off = 0;
                            for (var i = 0; i < pending.length; i++) {
                              merged.set(pending[i], off);
                              off += pending[i].length;
                            }
                            pending = [];
                            pendingLen = 0;
                            return sendChunks(merged);
                          }
                          while (true) {
                            if (DL.shouldStop(tok)) {
                              try { await reader.cancel(); } catch(e) {}
                              DL.onFail(tok, 'STOPPED');
                              return;
                            }
                            var r = await reader.read();
                            if (r.done) {
                              if (flush()) DL.onDone(tok);
                              else DL.onFail(tok, 'STOPPED');
                              return;
                            }
                            pending.push(r.value);
                            pendingLen += r.value.length;
                            if (pendingLen >= 49152) {
                              if (!flush()) {
                                try { await reader.cancel(); } catch(e) {}
                                DL.onFail(tok, 'STOPPED');
                                return;
                              }
                            }
                          }
                        } catch (e) {
                          DL.onFail(tok, e && e.message ? e.message : 'Download failed');
                        }
                      })($tokLiteral);
                      """.trimIndent()

                      fun tryStartFetch(wv: WebView, attempt: Int) {
                          if (wvFinished.get() || d.stop != 0 || d.gen != g || wvToken != token) return
                          wv.evaluateJavascript("document.documentElement.outerHTML.slice(0,2500)") { raw ->
                              if (wvFinished.get() || wvToken != token) return@evaluateJavascript
                              val snippet = (JSONTokener(raw).nextValue() as? String) ?: ""
                              if ((snippet.length < 100 || isChallengeHtml(snippet)) && attempt < 6) {
                                  mainHandler.postDelayed({ tryStartFetch(wv, attempt + 1) }, 1200)
                              } else {
                                  wvLastAct.set(System.currentTimeMillis())
                                  wv.evaluateJavascript(fetchJs, null)
                              }
                          }
                      }

                      runOnUiThread {
                          try {
                              val warm = dlWv != null && dlWvProfile == d.profile && dlWvHost == linkHost
                              if (warm) {
                                  wvLastAct.set(System.currentTimeMillis())
                                  dlWv!!.evaluateJavascript(fetchJs, null)
                              } else {
                                  try { dlWv?.destroy() } catch (e: Exception) { }
                                  val wv = WebView(this@MainActivity)
                                  dlWv = wv
                                  dlWvProfile = d.profile
                                  dlWvHost = linkHost
                                  if (d.profile.isNotEmpty() && multiProfile) {
                                      try { WebViewCompat.setProfile(wv, d.profile) } catch (e: Exception) { }
                                  }
                                  applyWeb(wv)
                                  wv.addJavascriptInterface(WvDlBridge(), "DL")
                                  wv.webViewClient = object : WebViewClient() {
                                      override fun onPageFinished(view: WebView?, url: String?) {
                                          if (wvFinished.get() || wvToken != token) return
                                          mainHandler.postDelayed({
                                              if (!wvFinished.get() && wvToken == token && view != null) tryStartFetch(view, 0)
                                          }, 300)
                                      }
                                  }
                                  wv.loadUrl(originUrl)
                              }
                          } catch (e: Exception) {
                              if (wvFinished.compareAndSet(false, true)) {
                                  wvErr = e.message ?: "WebView init error"
                                  latch.countDown()
                              }
                          }
                      }

                      try {
                          while (!latch.await(1500, TimeUnit.MILLISECONDS)) {
                              if (d.stop != 0 || d.gen != g) break
                              if (System.currentTimeMillis() - wvLastAct.get() > 35000) {
                                  wvErr = "Download timed out"
                                  break
                              }
                          }
                      } finally {
                          wvFinished.set(true)
                          wvToken = ""
                          synchronized(wvFosLock) {
                              wvFos = null
                              try { fos.flush() } catch (e: Exception) { }
                              try { fos.close() } catch (e: Exception) { }
                          }
                      }
                      if (d.stop != 0 || d.gen != g) return false
                      if (!wvCompleted) {
                          if (wvErr?.contains("HTTP 403") == true) {
                              dlWvHost = ""
                          }
                          throw Exception(wvErr ?: "Download failed")
                      }
                      try { Thread.sleep(350) } catch (e: Exception) { }
                      return true
                  }
              }

              private fun runDirect(d: DlItem, g: Int) {
                  if (d.stop != 0 || d.gen != g) return
                  d.state = 1
                  ui()
                  val dir = File(filesDir, "parts/" + d.id)
                  try {
                      dir.mkdirs()
                      val tmpFile = File(dir, "part.bin")
                      var completed = false
                      val host = (Uri.parse(d.link).host ?: "").lowercase(Locale.US)
                      var useWv = host in wvOnlyHosts
                      if (!useWv) {
                          try {
                              var offset = if (tmpFile.exists()) tmpFile.length() else 0L
                              var conn = openFollow(d.link, d.ua, offset, d.profile, d.page)
                              var ct = (conn.contentType ?: "").lowercase(Locale.US)
                              if (d.expectAudio && ct.contains("text/html")) {
                                  val html = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText().take(200000) }
                                  val base = conn.url.toString()
                                  conn.disconnect()
                                  val doc = Jsoup.parse(html, base)
                                  var redir = doc.selectFirst("meta[http-equiv=refresh]")?.attr("content")
                                      ?.substringAfter("url=", "")?.trim('"', '\'', ' ') ?: ""
                                  if (redir.isEmpty()) {
                                      redir = doc.select("a[href], source[src], audio[src]")
                                          .map { it.absUrl(if (it.hasAttr("href")) "href" else "src") }
                                          .firstOrNull { isAudioUrl(it) } ?: ""
                                  }
                                  if (redir.isEmpty()) throw Exception("Server returned webpage instead of MP3")
                                  val resolved = URL(URL(base), redir).toString()
                                  offset = 0L
                                  conn = openFollow(resolved, d.ua, 0L, d.profile, base)
                                  ct = (conn.contentType ?: "").lowercase(Locale.US)
                                  if (ct.contains("text/html")) {
                                      conn.disconnect()
                                      throw Exception("Server returned webpage instead of MP3")
                                  }
                              }
                              if (offset == 0L && d.customName) {
                                  val ext = audioExtFromMeta(conn.getHeaderField("Content-Disposition"), conn.url.toString(), ct)
                                  d.name = sanitizeName(d.title).ifEmpty { "Track" } + ext
                              }
                              val append = offset > 0 && conn.responseCode == 206
                              if (!append) offset = 0L
                              val len = conn.contentLengthLong
                              if (len > 0) d.total = offset + len
                              var done = offset
                              conn.inputStream.use { ins ->
                                  FileOutputStream(tmpFile, append).use { out ->
                                      val buf = ByteArray(65536)
                                      while (true) {
                                          val n = ins.read(buf)
                                          if (n < 0) { completed = true; break }
                                          if (d.stop != 0 || d.gen != g) break
                                          out.write(buf, 0, n)
                                          done += n
                                          d.done = done
                                          if (d.total > 0) d.progress = (done * 100 / d.total).toInt().coerceIn(0, 100)
                                          ui()
                                      }
                                  }
                              }
                              conn.disconnect()
                          } catch (e: HttpCodeException) {
                              if (e.code in WV_FALLBACK_CODES) {
                                  if (host.isNotEmpty()) wvOnlyHosts.add(host)
                                  useWv = true
                              } else {
                                  throw e
                              }
                          }
                      }
                      if (useWv) {
                          completed = downloadViaWebView(d, g, tmpFile)
                      }
                      if (completed) {
                          if (d.gen != g) return
                          val finalFile = File(dir, sanitizeName(d.name).ifEmpty { "download.bin" })
                          if (finalFile.exists()) finalFile.delete()
                          if (!tmpFile.renameTo(finalFile)) {
                              tmpFile.copyTo(finalFile, overwrite = true)
                              tmpFile.delete()
                          }
                          saveFile(d, finalFile)
                          d.total = finalFile.length()
                          d.done = d.total
                          if (!d.customName) d.title = finalFile.nameWithoutExtension
                          d.state = 2
                          d.progress = 100
                          if (d.folder.isEmpty()) runOnUiThread { toast("Downloaded: " + d.title) }
                      } else if (d.gen == g && d.stop == 1) {
                          d.state = 4
                      }
                  } catch (e: Exception) {
                      if (d.gen == g) {
                          if (d.stop == 1) {
                              d.state = 4
                          } else if (d.stop != 2) {
                              d.state = 3
                              d.msg = (e.message ?: "Unknown error").take(300)
                          }
                      }
                  } finally {
                      if (d.state == 2 || d.stop == 2) dir.deleteRecursively()
                      runOnUiThread { finishItem(d) }
                  }
              }

              private fun openFile(d: DlItem) {
                  try {
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(Uri.parse(d.uri), d.mime ?: "*/*")
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(i)
                  } catch (e: Exception) {
                      toast("No app found to open this file")
                  }
              }

              private fun snapshotJson(): String {
                  val a = JSONArray()
                  for (d in items) {
                      val st = if (d.state == 0 || d.state == 1) 4 else d.state
                      a.put(
                          JSONObject().put("t", d.title).put("s", st).put("u", d.uri ?: "").put("m", d.mime ?: "")
                              .put("g", d.msg).put("n", d.name).put("i", d.id).put("k", d.kind).put("l", d.link)
                              .put("p", d.page).put("a", d.audio).put("f", d.fmt).put("ua", d.ua ?: "")
                              .put("z", d.total).put("d", d.done).put("r", d.progress)
                              .put("v", d.vid).put("q", d.qkey).put("tg", d.qtag).put("pf", d.profile)
                              .put("fd", d.folder).put("cn", d.customName).put("ea", d.expectAudio)
                      )
                  }
                  return a.toString()
              }

              private fun saveItemsAsync() {
                  val json = try { snapshotJson() } catch (e: Exception) { return }
                  saveExec.execute {
                      try {
                          val tmp = File(filesDir, "dl.json.tmp")
                          tmp.writeText(json, Charsets.UTF_8)
                          tmp.renameTo(File(filesDir, "dl.json"))
                      } catch (e: Exception) { }
                  }
              }

              private fun scheduleSaveItems() {
                  if (savePending.compareAndSet(false, true)) {
                      mainHandler.postDelayed({
                          savePending.set(false)
                          saveItemsAsync()
                      }, 2500)
                  }
              }

              private fun loadItems() {
                  try {
                      val f = File(filesDir, "dl.json")
                      val raw = if (f.exists()) f.readText(Charsets.UTF_8) else prefs.getString("dl", "[]")
                      val a = JSONArray(raw)
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          var st = o.getInt("s")
                          if (st == 0 || st == 1) st = 4
                          val it2 = DlItem(o.getString("t"), st, o.optInt("r", 100), o.optString("u"), o.optString("m"), o.optString("g"))
                          it2.name = o.optString("n")
                          val id = o.optString("i")
                          if (id.isNotEmpty()) it2.id = id
                          it2.kind = o.optInt("k", 0)
                          it2.link = o.optString("l")
                          it2.page = o.optString("p")
                          it2.audio = o.optBoolean("a", false)
                          it2.fmt = o.optString("f", "bv*+ba/b")
                          val ua = o.optString("ua")
                          it2.ua = if (ua.isEmpty()) null else ua
                          it2.total = o.optLong("z", 0L)
                          it2.done = o.optLong("d", 0L)
                          it2.vid = o.optString("v")
                          it2.qkey = o.optString("q")
                          it2.qtag = o.optString("tg")
                          it2.profile = o.optString("pf")
                          it2.folder = o.optString("fd")
                          it2.customName = o.optBoolean("cn", false)
                          it2.expectAudio = o.optBoolean("ea", false)
                          items.add(it2)
                      }
                  } catch (e: Exception) { }
              }

              private fun updateEngine(manual: Boolean) {
                  try {
                      val r = YoutubeDL.getInstance().updateYoutubeDL(application, YoutubeDL.UpdateChannel.NIGHTLY)
                      if (manual) runOnUiThread { toast("Engine update: $r") }
                  } catch (e: Exception) {
                      if (manual) runOnUiThread { toast("Update failed: ${e.message}") }
                  }
              }

              private fun progressText(d: DlItem): String {
                  if (d.kind == 1) {
                      return if (d.total > 0) fmtSize(d.done) + " / " + fmtSize(d.total) + " (" + d.progress + "%)" else fmtSize(d.done)
                  }
                  var s = d.progress.toString() + "%"
                  if (d.sizeLabel.isNotEmpty()) s += " of " + d.sizeLabel
                  if (d.total > 0) s += "  (total ~" + fmtSize(d.total) + ")"
                  return s
              }

              private fun statusText(d: DlItem): String = when (d.state) {
                  0 -> "Waiting..."
                  1 -> "Downloading - " + progressText(d)
                  4 -> "Paused - " + progressText(d)
                  2 -> "Downloaded" + (if (d.total > 0) " - " + fmtSize(d.total) else "") + " - tap to open"
                  else -> "Failed: " + d.msg
              }

              private fun act(label: String, color: Int = 0xFF2D7FF9.toInt(), f: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 14f
                  t.setTextColor(color)
                  t.setPadding(0, dp(10), dp(24), dp(4))
                  t.isFocusable = false
                  t.setOnClickListener { f() }
                  return t
              }

              inner class DlAdapter : BaseAdapter() {
                  override fun getCount() = shownCache.size
                  override fun getItem(position: Int): Any = shownCache[position]
                  override fun getItemId(position: Int) = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val d = shownCache[position]
                      val box: LinearLayout
                      val h: DlHolder
                      if (convertView == null) {
                          box = LinearLayout(this@MainActivity)
                          box.orientation = LinearLayout.VERTICAL
                          box.setPadding(dp(16), dp(12), dp(16), dp(8))
                          val t = TextView(this@MainActivity)
                          t.textSize = 16f
                          t.maxLines = 2
                          val s = TextView(this@MainActivity)
                          s.textSize = 13f
                          val pb = ProgressBar(this@MainActivity, null, android.R.attr.progressBarStyleHorizontal)
                          pb.max = 100
                          val row = LinearLayout(this@MainActivity)
                          row.orientation = LinearLayout.HORIZONTAL
                          val btnAct = act("") { }
                          val btnOpen = act("Open page") { }
                          val btnDel = act("Delete", 0xFFE5534B.toInt()) { }
                          row.addView(btnAct)
                          row.addView(btnOpen)
                          row.addView(btnDel)
                          box.addView(t)
                          box.addView(s)
                          box.addView(pb)
                          box.addView(row)
                          h = DlHolder(t, s, pb, btnAct, btnOpen, btnDel)
                          box.tag = h
                      } else {
                          box = convertView as LinearLayout
                          h = box.tag as DlHolder
                      }
                      h.title.setTextColor(col.text)
                      h.title.text = d.title
                      h.sub.setTextColor(col.sec)
                      h.sub.text = (if (d.folder.isNotEmpty()) d.folder + "\n" else "") + statusText(d)
                      if (d.state == 0 || d.state == 1 || d.state == 4) {
                          h.pb.visibility = View.VISIBLE
                          h.pb.progress = d.progress
                      } else {
                          h.pb.visibility = View.GONE
                      }
                      when (d.state) {
                          0, 1 -> {
                              h.btnAct.visibility = View.VISIBLE
                              h.btnAct.text = "Pause"
                              h.btnAct.setOnClickListener { pauseItem(d) }
                          }
                          4 -> {
                              h.btnAct.visibility = View.VISIBLE
                              h.btnAct.text = "Resume"
                              h.btnAct.setOnClickListener { startRun(d) }
                          }
                          3 -> {
                              h.btnAct.visibility = View.VISIBLE
                              h.btnAct.text = "Retry"
                              h.btnAct.setOnClickListener { startRun(d) }
                          }
                          else -> h.btnAct.visibility = View.GONE
                      }
                      h.btnOpen.setOnClickListener { openPage(d) }
                      h.btnDel.setOnClickListener { askDelete(d) }
                      return box
                  }
              }
          }
