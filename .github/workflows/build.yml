            private fun urlExt(u: String): String { val seg = u.substringBefore('#').substringBefore('?').substringAfterLast('/', ""); return if (seg.contains('.')) seg.substringAfterLast('.').lowercase(Locale.US) else "" }
            private fun isAudioUrl(u: String) = urlExt(u) in AUDIO_EXTS

            private fun normUrl(u: String): String {
              val uri = Uri.parse(u.substringBefore('#').trim())
              val host = (uri.host ?: "").lowercase(Locale.US).removePrefix("www.")
              val rawPath = Uri.decode(uri.path ?: "")
              val path = when { rawPath.isEmpty() -> "/"; rawPath.length > 1 -> rawPath.trimEnd('/'); else -> rawPath }
              val rawQ = uri.encodedQuery; val q = if (!rawQ.isNullOrEmpty()) Uri.decode(rawQ) else ""
              return "$host$path" + (if (q.isNotEmpty()) "?$q" else "")
            }

            private fun sameHost(a: String, b: String): Boolean {
              val ha = (Uri.parse(a).host ?: "").lowercase(Locale.US).removePrefix("www.")
              val hb = (Uri.parse(b).host ?: "").lowercase(Locale.US).removePrefix("www.")
              return ha.isNotEmpty() && ha == hb
            }

            private fun guessNameFromUrl(u: String) = sanitizeName(Uri.decode((Uri.parse(u).lastPathSegment ?: "Folder").substringBeforeLast('.')).replace('_', ' ').replace('-', ' ')).ifEmpty { "Folder" }

            private fun dirSignature(u: String): String {
              val uri = Uri.parse(u)
              val qDir = uri.getQueryParameter("dir") ?: uri.getQueryParameter("folder") ?: uri.getQueryParameter("path") ?: uri.getQueryParameter("album")
              return if (!qDir.isNullOrEmpty()) Uri.decode(qDir).trim('/').lowercase(Locale.US) else Uri.decode(uri.path ?: "").trim('/').lowercase(Locale.US)
            }

            private fun isChildPath(childUrl: String, baseUrl: String): Boolean { val c = dirSignature(childUrl); val b = dirSignature(baseUrl); return b.isNotEmpty() && c.length > b.length && c.startsWith("$b/") }
            private fun isParentUrl(candidateUrl: String, baseUrl: String): Boolean { val c = dirSignature(candidateUrl); val b = dirSignature(baseUrl); if (c.isEmpty() && b.isNotEmpty()) return true; return b.isNotEmpty() && c.length < b.length && b.startsWith("$c/") }

            private fun isLikelyChildFolder(a: Element, href: String, baseUrl: String): Boolean {
              if (isChildPath(href, baseUrl)) return true
              val box = a.closest("tr, li, div") ?: a
              val imgs = if (box.select("a").size <= 2) box.select("img") else a.select("img")
              for (img in imgs) { val h = (img.attr("src") + " " + img.attr("alt") + " " + img.attr("title")).lowercase(Locale.US); if (h.contains("folder") || h.contains("dir")) return true }
              return false
            }

            private fun applyOrientation() {
              requestedOrientation = when (orient) { 1 -> ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE; 2 -> ActivityInfo.SCREEN_ORIENTATION_PORTRAIT; else -> ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED }
              updateSettingsUi()
            }

            private fun setBarsHidden(hide: Boolean) {
              val wantHide = hide && resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE && tabs.getOrNull(cur)?.home == false && dlPage.visibility != View.VISIBLE && setPage.visibility != View.VISIBLE && tabsPage.visibility != View.VISIBLE
              if (barsHidden == wantHide) return; barsHidden = wantHide
              val vis = if (wantHide) View.GONE else View.VISIBLE; topBar.visibility = vis; bottomBar.visibility = vis; lastBarToggle = System.currentTimeMillis()
            }

            private fun applyTheme() {
              col = if (dark) DARK else LIGHT; themeTree(findViewById(R.id.root)); window.statusBarColor = col.bg; window.navigationBarColor = col.bg; bars()
              for (t in tabs) applyWeb(t.web); refreshDl(); if (tabsPage.visibility == View.VISIBLE) tabsAdapter.notifyDataSetChanged(); updateSettingsUi()
            }

            private fun bars() { var f = View.SYSTEM_UI_FLAG_VISIBLE; if (!dark) f = f or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR; window.decorView.systemUiVisibility = f }

            private fun themeTree(v: View) {
              val tag = v.tag as? String
              when (tag) { "bg" -> v.setBackgroundColor(col.bg); "pill" -> v.background = shape(col.pill, 24); "card" -> v.background = shape(col.card, 24); "outline" -> v.background = shape(Color.TRANSPARENT, 28, col.stroke, dp(1)); "tab" -> v.background = shape(Color.TRANSPARENT, 6, col.text, dp(2)) }
              if (v is EditText) { v.setTextColor(col.text); v.setHintTextColor(col.sec) }
              else if (v is TextView && tag != "logo") v.setTextColor(when (tag) { "sec" -> col.sec; "accent" -> 0xFF2D7FF9.toInt(); else -> col.text })
              if (v is ImageButton) v.setColorFilter(col.text)
              if (v is ViewGroup) for (i in 0 until v.childCount) themeTree(v.getChildAt(i))
            }

            private fun updateSettingsUi() {
              val folder = prefs.getString("folder", "") ?: ""
              findViewById<TextView>(R.id.folderVal).text = if (folder.isEmpty()) "Downloads (default)" else (Uri.parse(folder).lastPathSegment ?: folder)
              findViewById<TextView>(R.id.themeVal).text = when (theme) { 1 -> "Light (day)"; 2 -> "Dark (night)"; else -> "Auto (follow system)" }
              findViewById<TextView>(R.id.orientVal).text = when (orient) { 1 -> "Landscape"; 2 -> "Portrait"; else -> "Auto (follow phone)" }
              findViewById<TextView>(R.id.desktopVal).text = if (desktop) "ON" else "OFF"
              findViewById<TextView>(R.id.cookiesVal).text = if (cookiesOn) "ON" else "OFF - turn ON if you see sign in / not a bot errors"
            }

            override fun onConfigurationChanged(newConfig: Configuration) {
              super.onConfigurationChanged(newConfig); if (theme == 0) applyTheme()
              if (newConfig.orientation != Configuration.ORIENTATION_LANDSCAPE) setBarsHidden(false)
              if (tabsPage.visibility == View.VISIBLE) { tabsGrid.numColumns = if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) 3 else 2; tabsAdapter.notifyDataSetChanged() }
            }

            inner class JsBridge(private val profile: String) {
              @JavascriptInterface fun onAudioLink(url: String, title: String) {
                if (url.isBlank()) return
                runOnUiThread { val t = tabs.find { it.profile == profile }; startDirectNamed(url, title, t?.web?.url ?: url, profile, "", true, t?.web?.settings?.userAgentString ?: currentWebUa()) }
              }
              @JavascriptInterface fun setPendingName(title: String) { val clean = sanitizeName(title); if (!isJunkTitle(clean)) { pendingClickName = clean; pendingClickTime = System.currentTimeMillis() } }
              @JavascriptInterface fun onPickGithubWebFolder() { runOnUiThread { startFolderPick(0) } }
            }

            private fun injectSiteHelper(w: WebView?) {
              if (w == null) return
              val js = """
              (function(){
                if (location.hostname === 'github.com' && /\/upload(\/|$)/.test(location.pathname)) {
                  var fa = document.querySelector('file-attachment') || document.querySelector('.js-upload-manifest-file-container');
