              private fun normUrl(s: String): String {
                  val t = s.trim()
                  return when { t.startsWith("http://", true) || t.startsWith("https://", true) -> t; !t.contains(" ") && t.contains(".") -> "https://$t"; else -> "https://www.google.com/search?q=" + Uri.encode(t) }
              }
              private fun goUrl() {
                  val r = urlInput.text.toString().trim(); if (r.isEmpty()) return
                  (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).hideSoftInputFromWindow(urlInput.windowToken, 0)
                  urlInput.clearFocus(); activeTab()?.webView?.loadUrl(normUrl(r))
              }
              private fun createTab(u: String, sw: Boolean) {
                  val fu = normUrl(u); val wv = createWebView(); tabs.add(BrowserTab(UUID.randomUUID().toString(), fu, fu, wv)); wv.loadUrl(fu)
                  if (sw) switchTab(tabs.lastIndex) else btnTabs.text = tabs.size.toString()
                  AppStorage.saveTabs(tabs.map { it.url }, activeIdx.coerceAtLeast(0))
              }
              private fun switchTab(i: Int) {
                  if (i !in tabs.indices) return; activeIdx = i; val t = tabs[i]
                  webBox.removeAllViews(); (t.webView.parent as? ViewGroup)?.removeView(t.webView); webBox.addView(t.webView, FrameLayout.LayoutParams(-1, -1))
                  urlInput.setText(t.url); btnTabs.text = tabs.size.toString(); updateStar()
                  btnBack.alpha = if (t.webView.canGoBack()) 1f else 0.4f; btnFwd.alpha = if (t.webView.canGoForward()) 1f else 0.4f
                  AppStorage.saveTabs(tabs.map { it.url }, activeIdx)
              }
              private fun closeTab(i: Int) {
                  if (i !in tabs.indices) return; val rem = tabs.removeAt(i); webBox.removeView(rem.webView); rem.webView.destroy()
                  if (tabs.isEmpty()) createTab(AppStorage.getHomeUrl(), true) else switchTab(i.coerceAtMost(tabs.lastIndex))
              }
              private fun updateStar() {
                  val s = AppStorage.isBookmarked(activeTab()?.url ?: ""); btnStar.text = if (s) "★" else "☆"
                  btnStar.setTextColor(if (s) Color.parseColor("#FFB300") else if (isNight()) Color.WHITE else Color.parseColor("#111111"))
              }
              private fun updateDlBadge() {
                  val c = DownloadCenter.activeCount(); btnDl.text = if (c > 0) "⬇$c" else "⬇"
                  btnDl.setTextColor(if (c > 0) Color.parseColor("#2979FF") else if (isNight()) Color.WHITE else Color.parseColor("#111111"))
              }
              private fun toggleBm() {
                  val t = activeTab() ?: return
                  if (AppStorage.isBookmarked(t.url)) { AppStorage.removeBookmark(t.url); Toast.makeText(this, "Bookmark removed", Toast.LENGTH_SHORT).show() }
                  else { AppStorage.addBookmark(t.title, t.url); Toast.makeText(this, "Bookmark added!", Toast.LENGTH_SHORT).show() }
                  updateStar()
              }

              private fun showTabsDialog() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(10), dp(14), dp(10)) }
                  val add = Button(this).apply { text = "➕ Add Page (New Tab)" }; box.addView(add)
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }; box.addView(ScrollView(this).apply { addView(col) })
                  val d = AlertDialog.Builder(this).setTitle("Open Pages (${tabs.size})").setView(box).setNegativeButton("Close", null).create()
                  add.setOnClickListener { d.dismiss(); createTab(AppStorage.getHomeUrl(), true) }
                  tabs.forEachIndexed { idx, t ->
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(dp(8), dp(8), dp(8), dp(8)); if (idx == activeIdx) setBackgroundColor(Color.parseColor("#222979FF")) }
                      r.addView(TextView(this).apply { text = "${idx + 1}. ${t.title.take(35)}\n${t.url.take(45)}"; textSize = 13f; layoutParams = LinearLayout.LayoutParams(0, -2, 1f); setOnClickListener { switchTab(idx); d.dismiss() } })
                      r.addView(Button(this).apply { text = "✕"; setOnClickListener { d.dismiss(); closeTab(idx) } })
                      col.addView(r)
                  }
                  d.show()
              }

              private fun showBookmarksDialog() {
                  val bms = AppStorage.getBookmarks(); val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(10), dp(14), dp(10)) }
                  val d = AlertDialog.Builder(this).setTitle("Bookmarks (${bms.size})").setView(ScrollView(this).apply { addView(col) })
                      .setPositiveButton("Add Current Page") { _, _ -> activeTab()?.let { AppStorage.addBookmark(it.title, it.url); updateStar(); Toast.makeText(this, "Saved!", Toast.LENGTH_SHORT).show() } }
                      .setNegativeButton("Close", null).create()
                  if (bms.isEmpty()) col.addView(TextView(this).apply { text = "No bookmarks yet." })
                  bms.forEach { bm ->
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(dp(6), dp(8), dp(6), dp(8)) }
                      r.addView(TextView(this).apply { text = "★ ${bm.title}\n${bm.url.take(50)}"; textSize = 13f; layoutParams = LinearLayout.LayoutParams(0, -2, 1f); setOnClickListener { activeTab()?.webView?.loadUrl(bm.url); d.dismiss() } })
                      r.addView(Button(this).apply { text = "🗑"; setOnClickListener { AppStorage.removeBookmark(bm.url); updateStar(); d.dismiss(); showBookmarksDialog() } })
                      col.addView(r)
                  }
                  d.show()
              }

              private fun showMainMenu() {
                  val dm = if (AppStorage.isDesktopMode()) "🖥 Desktop Mode: ON ✓" else "🖥 Desktop Mode: OFF"
                  val tm = when (AppStorage.getThemeMode()) { 1 -> "☀ Theme: Day"; 2 -> "🌙 Theme: Night"; else -> "🌗 Theme: Auto" }
                  AlertDialog.Builder(this).setTitle("Menu").setItems(arrayOf("★ Bookmarks", "☆ Add Bookmark", "➕ Add Page", dm, tm, "⬇ Downloader / Downloaded", "⚙ Settings")) { _, w ->
                      when (w) {
                          0 -> showBookmarksDialog()
                          1 -> activeTab()?.let { AppStorage.addBookmark(it.title, it.url); updateStar(); Toast.makeText(this, "Bookmarked!", Toast.LENGTH_SHORT).show() }
                          2 -> createTab(AppStorage.getHomeUrl(), true)
                          3 -> toggleDesktop()
                          4 -> showThemePicker()
                          5 -> showDownloadsDialog(0)
                          6 -> showSettings()
                      }
                  }.show()
              }

              private fun toggleDesktop() {
                  val n = !AppStorage.isDesktopMode(); AppStorage.setDesktopMode(n)
                  tabs.forEach { applyWvSettings(it.webView) }; activeTab()?.webView?.reload()
                  Toast.makeText(this, if (n) "Desktop Mode ON" else "Mobile Mode ON", Toast.LENGTH_SHORT).show()
              }
              private fun showThemePicker() {
                  AlertDialog.Builder(this).setTitle("Day / Night / Auto").setSingleChoiceItems(arrayOf("Auto", "Day Mode", "Night Mode"), AppStorage.getThemeMode()) { d, w ->
                      AppStorage.setThemeMode(w); AppStorage.applySavedTheme(); d.dismiss()
                  }.show()
              }
              private fun showSettings() {
                  AlertDialog.Builder(this).setTitle("Settings").setItems(arrayOf("🌗 Theme: Day / Night / Auto", "🖥 Toggle Desktop Mode", "🏠 Set Home URL", "🔄 Update yt-dlp Engine", "🧹 Clear Cache & Cookies", "🗑 Clear Download History")) { _, w ->
                      when (w) {
                          0 -> showThemePicker()
                          1 -> toggleDesktop()
                          2 -> { val et = EditText(this).apply { setText(AppStorage.getHomeUrl()) }; AlertDialog.Builder(this).setTitle("Home URL").setView(et).setPositiveButton("Save") { _, _ -> AppStorage.setHomeUrl(et.text.toString()) }.setNegativeButton("Cancel", null).show() }
                          3 -> {
                              if (!engineReady) { Toast.makeText(this, "Wait...", Toast.LENGTH_SHORT).show(); return@setItems }
                              val d = AlertDialog.Builder(this).setTitle("Updating yt-dlp...").setCancelable(false).show()
                              Thread {
                                  val msg = try { "Update: ${YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.NIGHTLY)?.name ?: "DONE"}" } catch (e: Exception) { "Error: ${e.message}" }
                                  handler.post { d.dismiss(); Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
                              }.start()
                          }
                          4 -> { activeTab()?.webView?.clearCache(true); CookieManager.getInstance().removeAllCookies(null); Toast.makeText(this, "Cleared", Toast.LENGTH_SHORT).show() }
                          5 -> { AppStorage.clearAllHistory(); Toast.makeText(this, "History cleared", Toast.LENGTH_SHORT).show() }
                      }
                  }.show()
              }

