                              if (tabs.isNotEmpty()) AppStorage.saveTabs(tabs.map { it.url }, activeIdx.coerceAtLeast(0))
                          }
                      }
                      override fun shouldInterceptRequest(v: WebView?, r: WebResourceRequest?): WebResourceResponse? {
                          val ru = r?.url?.toString() ?: return null; val l = ru.lowercase()
                          if ((l.contains(".mp4") || l.contains(".m3u8") || l.contains(".webm")) && !l.endsWith(".ts") && !l.contains(".js") && !l.contains(".css")) {
                              tabs.find { it.webView == v }?.let { if (it.detectedMedia.size < 20) it.detectedMedia.add(ru) }
