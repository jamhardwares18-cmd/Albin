            private fun parseGithubUrl(rawUrl: String): Triple<String, String, String> {
              if (rawUrl.isEmpty()) return Triple("", "", "")
              val uri = Uri.parse(rawUrl); val host = (uri.host ?: "").lowercase(Locale.US); if (host != "github.com" && host != "www.github.com") return Triple("", "", "")
              val segs = uri.pathSegments ?: return Triple("", "", "")
              if (segs.size < 2 || segs[0].lowercase(Locale.US) in setOf("settings", "marketplace", "explore", "notifications", "pulls", "issues", "new", "login", "signup", "orgs", "topics", "search", "trending")) return Triple("", "", "")
              var branch = ""; var sub = ""
              if (segs.size >= 4 && (segs[2] == "tree" || segs[2] == "blob" || segs[2] == "upload")) { branch = segs[3]; if (segs[2] == "tree" && segs.size > 4) sub = segs.drop(4).joinToString("/") }
              return Triple("${segs[0]}/${segs[1]}", branch, sub)
            }

