                    var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '\uD83D\uDCC1 Upload Folder (with subfolders)';
                    btn.style.cssText = 'background:#238636;color:#fff;border:1px solid rgba(240,246,252,0.1);border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;';
                    btn.onclick = function(e) { e.preventDefault(); e.stopPropagation(); ABH.onPickGithubWebFolder(); };
                    wrap.appendChild(btn); fa.parentNode.insertBefore(wrap, fa);
                  }
                }
                if (window.__abhHooked) return;
                window.__abhHooked = true;
                function isAudioHref(h) { if (!h) return false; return /\.(mp3|m4a|flac|wav|aac|ogg|opus)$/.test(h.split('#')[0].split('?')[0].toLowerCase()); }
                function isDlHref(h) { if (!h) return false; var l = h.toLowerCase(); return isAudioHref(h) || l.indexOf('download') >= 0 || l.indexOf('dl=') >= 0 || l.indexOf('file=') >= 0 || l.indexOf('/dl/') >= 0; }
                function isPlayElem(el) { if (!el) return false; var s = ((el.alt||'') + ' ' + (el.title||'') + ' ' + (el.className||'') + ' ' + (el.id||'') + ' ' + (el.src||'')).toLowerCase(); return s.indexOf('play') >= 0 && s.indexOf('down') < 0 && s.indexOf('dl') < 0; }
                function isJunkTxt(s) { if (!s) return true; var l = s.trim().toLowerCase(); return l.length <= 2 || /^(play|dl|download|save|add|mp3|song|track|audio|listen)$/.test(l) || /^[0-9]+(\.[0-9]+)?\s*(mb|kb|gb|kbps)?$/.test(l); }
                function normKey(s) { return (s || '').toLowerCase().replace(/\.[a-z0-9]{2,4}$/, '').replace(/[^a-z0-9]/g, ''); }
                function findSingleRow(el) { var cur = el ? el.parentElement : null, d = 0; while (cur && d < 6) { var tag = (cur.tagName || '').toUpperCase(); if (tag === 'TR' || tag === 'LI' || tag === 'DIV' || tag === 'P') return (cur.querySelectorAll('a').length <= 6 && cur.querySelectorAll('tr').length <= 1) ? cur : null; cur = cur.parentElement; d++; } return null; }
                function inlineTitle(el) { if (!el) return ''; var best = '', stop = {BR:1,TR:1,LI:1,DIV:1,P:1,HR:1,TABLE:1}; function scan(f){ var n = f ? el.nextSibling : el.previousSibling, s = 0; while (n && s < 10) { if (n.nodeType === 1 && stop[n.tagName]) break; var t = (n.textContent || '').trim(); if (!isJunkTxt(t) && t.length > best.length) best = t; n = f ? n.nextSibling : n.previousSibling; s++; } } scan(true); if (!best) scan(false); return best; }
                function rowTitle(row, skipA, refEl) {
                  if (!row) return inlineTitle(refEl);
                  var best = '', as = row.querySelectorAll('a');
                  for (var i = 0; i < as.length; i++) { if (as[i] === skipA) continue; var txt = (as[i].innerText || as[i].textContent || '').trim(); if (!isJunkTxt(txt) && txt.length > best.length) best = txt; }
                  if (best) return best;
                  var cells = row.querySelectorAll('td, th, span, font, b, strong, p, div');
                  for (var j = 0; j < cells.length; j++) { var t = (cells[j].innerText || cells[j].textContent || '').trim(); if (!isJunkTxt(t) && t.length > best.length && t.indexOf('\n') < 0) best = t; }
                  if (best) return best;
                  var parts = (row.innerText || row.textContent || '').split(/[\n\t]+/);
                  for (var k = 0; k < parts.length; k++) { var p = parts[k].trim(); if (!isJunkTxt(p) && p.length > best.length) best = p; }
                  return best;
                }
                function findRowDlLink(row, skipA) {
                  if (!row) return null; var links = row.querySelectorAll('a[href]'); if (!links.length || links.length > 6) return null;
                  for (var i = 0; i < links.length; i++) { var sib = links[i]; if (sib === skipA) continue; var img = sib.querySelector('img'); var h = img ? ((img.src||'') + ' ' + (img.alt||'') + ' ' + (img.title||'')).toLowerCase() : ''; if (sib.href && (isDlHref(sib.href) || h.indexOf('dl') >= 0 || h.indexOf('down') >= 0 || h.indexOf('save') >= 0)) return sib; }
                  return null;
                }
                function findMp3InAttr(el) {
                  if (!el) return ''; var attrs = ['data-src','data-url','data-file','data-mp3','data-audio','onclick'];
                  for (var i = 0; i < attrs.length; i++) { var v = el.getAttribute(attrs[i]) || ''; var m = v.match(/https?:\/\/[^'"\s)]+\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\?[^'"\s)]*)?/i); if (m) return m[0]; var m2 = v.match(/['"]([^'"]+\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\?[^'"]*)?)['"]/i); if (m2) { try { return new URL(m2[1], location.href).href; } catch(e) {} } }
                  return '';
                }
                function findUrlInEl(el) { if (!el) return ''; var a = el.closest ? el.closest('a[href]') : null; if (a && a.href && a.href.indexOf('http') === 0) return a.href; var oc = el.getAttribute ? (el.getAttribute('onclick') || '') : ''; if (!oc && el.parentElement) oc = el.parentElement.getAttribute('onclick') || ''; var m = oc.match(/['"]((?:https?:\/\/|\/|\?)[^'"]+)['"]/); if (m) { try { return new URL(m[1], location.href).href; } catch(e) {} } return ''; }
                function findAudioOnPageByTitle(title) {
                  var key = normKey(title); if (!key || key.length < 3) return ''; var as = document.querySelectorAll('a[href]');
                  for (var i = 0; i < as.length; i++) { var h = as[i].href; if (!isAudioHref(h)) continue; var fk = normKey(decodeURIComponent(h.split('#')[0].split('?')[0].split('/').pop() || '')); if (fk && (fk === key || fk.indexOf(key) >= 0 || key.indexOf(fk) >= 0)) return h; }
                  var re = /['"]([^'"\s<>]+\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\?[^'"\s<>]*)?)['"]/ig, scripts = document.scripts;
                  for (var s = 0; s < scripts.length; s++) { var txt = scripts[s].textContent || ''; if (txt.length > 300000) continue; re.lastIndex = 0; var m; while ((m = re.exec(txt)) !== null) { var raw = m[1], fk2 = normKey(decodeURIComponent(raw.split('#')[0].split('?')[0].split('/').pop() || '')); if (fk2 && (fk2 === key || fk2.indexOf(key) >= 0 || key.indexOf(fk2) >= 0)) { try { return new URL(raw, location.href).href; } catch(e) {} } } }
                  return '';
                }
                document.addEventListener('touchstart', function(e) {
                  var t = e.target, a = t && t.closest ? t.closest('a') : null, row = findSingleRow(a || t);
                  var u = (a && a.href && a.href.indexOf('http') === 0) ? a.href : findUrlInEl(t);
                  var txt = a ? (a.innerText || a.textContent || a.title || '').trim() : ''; if (isJunkTxt(txt)) txt = rowTitle(row, a, a || t);
                  window.__abhLastUrl = u || ''; window.__abhLastText = txt || '';
                }, true);
                document.addEventListener('click', function(e) {
                  var t = e.target; if (!t || !t.closest) return; var a = t.closest('a'), row = findSingleRow(a || t), dlSib = row ? findRowDlLink(row, a) : null;
                  if (dlSib && (isPlayElem(t) || (a && isPlayElem(a)))) return;
                  if (a && a.href) {
                    var txt = (a.innerText || a.textContent || a.title || '').trim(), rowName = !isJunkTxt(txt) ? txt : rowTitle(row, a, a);
                    if (isAudioHref(a.href)) { e.preventDefault(); e.stopPropagation(); ABH.onAudioLink(a.href, rowName); return; }
                    var emb = findMp3InAttr(a) || findMp3InAttr(t); if (emb) { e.preventDefault(); e.stopPropagation(); ABH.onAudioLink(emb, rowName); return; }
                    var hrefL = (a.getAttribute('href') || '').trim().toLowerCase(), isScr = !hrefL || hrefL === '#' || hrefL.indexOf('javascript:') === 0 || hrefL.indexOf('play') >= 0;
                    if (dlSib && (isScr || row.querySelector('img[src*="play" i], img[alt*="play" i]') || isAudioHref(dlSib.href))) { e.preventDefault(); e.stopPropagation(); ABH.onAudioLink(dlSib.href, rowName); return; }
                    if (isScr && !isJunkTxt(rowName)) { var m1 = findAudioOnPageByTitle(rowName); if (m1) { e.preventDefault(); e.stopPropagation(); ABH.onAudioLink(m1, rowName); return; } }
                    if (rowName) ABH.setPendingName(rowName);
                  } else {
                    var mp3 = findMp3InAttr(t) || (row ? findMp3InAttr(row) : '');
                    if (mp3) { e.preventDefault(); e.stopPropagation(); var n2 = (t.innerText || t.textContent || '').trim(); ABH.onAudioLink(mp3, !isJunkTxt(n2) ? n2 : rowTitle(row, null, t)); return; }
                    var ct = (t.innerText || t.textContent || '').trim();
                    if (!isJunkTxt(ct)) {
                      if (dlSib && (row.querySelector('img[src*="play" i], img[alt*="play" i]') || isAudioHref(dlSib.href))) { e.preventDefault(); e.stopPropagation(); ABH.onAudioLink(dlSib.href, rowTitle(row, null, t) || ct); return; }
                      var m2 = findAudioOnPageByTitle(ct); if (m2) { e.preventDefault(); e.stopPropagation(); ABH.onAudioLink(m2, ct); }
                    }
                  }
                }, true);
              })();
              """.trimIndent()
              w.evaluateJavascript(js, null)
            }

            private fun applyWeb(w: WebView) {
              val s = w.settings; s.javaScriptEnabled = true; s.domStorageEnabled = true; s.mediaPlaybackRequiresUserGesture = false
              s.userAgentString = if (desktop) DESKTOP_UA else null; s.useWideViewPort = desktop; s.loadWithOverviewMode = desktop
              s.setSupportZoom(true); s.builtInZoomControls = true; s.displayZoomControls = false; s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
              if (Build.VERSION.SDK_INT >= 33) s.isAlgorithmicDarkeningAllowed = dark else s.forceDark = if (dark) WebSettings.FORCE_DARK_ON else WebSettings.FORCE_DARK_OFF
            }

            private fun toggleDesktop() {
              desktop = !desktop; prefs.edit().putBoolean("desktop", desktop).apply(); for (t in tabs) applyWeb(t.web)
              if (!tabs[cur].home) tabs[cur].web.reload(); updateSettingsUi(); toast(if (desktop) "Desktop mode ON" else "Desktop mode OFF")
            }

            @SuppressLint("SetJavaScriptEnabled", "ClickableViewAccessibility")
            private fun newTab(profile: String? = null) {
              val w = WebView(this); var pname = profile ?: (if (multiProfile) "t" + System.currentTimeMillis() + tabs.size else "")
              if (pname.isNotEmpty()) { if (multiProfile) try { WebViewCompat.setProfile(w, pname) } catch (e: Exception) { pname = "" } else pname = "" }
              val pf = pname; applyWeb(w); w.addJavascriptInterface(JsBridge(pf), "ABH")
              var touchLastY = 0f; var scrollAcc = 0f
              w.setOnTouchListener { _, ev ->
                if (ev.pointerCount > 1) { scrollAcc = 0f; return@setOnTouchListener false }
                when (ev.actionMasked) {
                  MotionEvent.ACTION_DOWN -> { touchLastY = ev.rawY; scrollAcc = 0f }
                  MotionEvent.ACTION_MOVE -> if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE && tabs.getOrNull(cur)?.home == false) {
                    val dy = ev.rawY - touchLastY; touchLastY = ev.rawY; if ((dy > 0 && scrollAcc < 0) || (dy < 0 && scrollAcc > 0)) scrollAcc = 0f
                    scrollAcc += dy; val now = System.currentTimeMillis(); val thresh = dp(28).toFloat()
                    if (now - lastBarToggle > 250) { if (scrollAcc < -thresh && !barsHidden) { setBarsHidden(true); scrollAcc = 0f } else if (scrollAcc > thresh && barsHidden) { setBarsHidden(false); scrollAcc = 0f } }
                  }
                }
                false
              }
              w.setOnLongClickListener {
                val r = w.hitTestResult; val ex = r.extra; var vid = ""; val t = r.type
                if (ex != null && ex.startsWith("http") && (t == WebView.HitTestResult.SRC_ANCHOR_TYPE || t == WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE || t == WebView.HitTestResult.IMAGE_TYPE)) {
                  if (isYt(ex)) vid = ytId(ex)
                  if (vid.isEmpty()) vid = Regex("/(?:vi|vi_webp|an_webp)/([A-Za-z0-9_-]{11})/").find(ex)?.groupValues?.get(1) ?: ""
                }
                if (vid.isNotEmpty()) { longPressVideo("https://www.youtube.com/watch?v=" + vid); true }
                else {
                  val infoJs = "(function(){var as=document.querySelectorAll('a[href]');var ls=[];for(var i=0;i<as.length;i++){var h=as[i].href;if(h&&h.indexOf('http')===0)ls.push(h.split('#')[0]);}return JSON.stringify({t:window.__abhLastText||'',u:window.__abhLastUrl||'',links:ls});})();"
                  val pageUrl = w.url ?: ""; val webUa = w.settings.userAgentString ?: MOBILE_UA; val hitUrl = if (ex != null && (ex.startsWith("http://") || ex.startsWith("https://"))) ex else ""
                  w.evaluateJavascript(infoJs) { raw ->
                    var linkText = ""; var jsUrl = ""; val pageLinks = HashSet<String>()
                    try {
                      val jsStr = JSONTokener(raw).nextValue() as? String
                      if (!jsStr.isNullOrEmpty()) {
                        val o = JSONObject(jsStr); jsUrl = o.optString("u", "")
                        if (hitUrl.isEmpty() || jsUrl.isEmpty() || normUrl(jsUrl) == normUrl(hitUrl)) linkText = o.optString("t", "")
                        val arr = o.optJSONArray("links"); if (arr != null) for (i in 0 until arr.length()) pageLinks.add(normUrl(arr.getString(i)))
                      }
                    } catch (e: Exception) { }
                    val targetUrl = hitUrl.ifEmpty { if (jsUrl.startsWith("http")) jsUrl else "" }
                    if (targetUrl.isNotEmpty()) handleLongPressLink(targetUrl, linkText, pageUrl, pageLinks, pf, webUa)
                  }
                  hitUrl.isNotEmpty()
                }
              }
              w.setDownloadListener { url, userAgent, contentDisposition, mimetype, _ -> startDirect(url, userAgent, contentDisposition, mimetype, w.url ?: url, pf) }
              w.webViewClient = object : WebViewClient() {
                override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                  val u = request?.url?.toString() ?: return false
                  if (isAudioUrl(u)) {
                    val titleHint = if (System.currentTimeMillis() - pendingClickTime < 5000) pendingClickName else ""
                    startDirectNamed(u, titleHint, view?.url ?: u, pf, "", true, view?.settings?.userAgentString ?: currentWebUa()); return true
                  }
                  return false
                }
                override fun doUpdateVisitedHistory(view: WebView?, url: String?, isReload: Boolean) { if (view != null && tabs.getOrNull(cur)?.web == view && url != null) urlBox.setText(url); forceDesktopViewport(view); injectSiteHelper(view) }
                override fun onPageCommitVisible(view: WebView?, url: String?) { forceDesktopViewport(view); injectSiteHelper(view) }
                override fun onPageFinished(view: WebView?, url: String?) { forceDesktopViewport(view); injectSiteHelper(view) }
              }
              w.webChromeClient = object : WebChromeClient() {
                override fun onShowCustomView(view: View?, callback: WebChromeClient.CustomViewCallback?) {
                  if (view == null) return; customView = view; customCb = callback
                  (window.decorView as FrameLayout).addView(view, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                }
                override fun onHideCustomView() { hideCustom() }
                override fun onProgressChanged(view: WebView?, newProgress: Int) { if (view != null && tabs.getOrNull(cur)?.web == view) { pageBar.progress = newProgress; pageBar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE } }
                override fun onShowFileChooser(webView: WebView?, filePathCallback: ValueCallback<Array<Uri>>?, fileChooserParams: WebChromeClient.FileChooserParams?): Boolean {
                  val curU = webView?.url ?: ""
                  if (parseGithubUrl(curU).first.isNotEmpty() && curU.contains("/upload")) {
                    fileCb?.onReceiveValue(null); fileCb = filePathCallback
                    dlg().setTitle("GitHub Upload").setItems(arrayOf("Choose Files", "Choose Folder (with subfolders)")) { _, i ->
                      if (i == 0) { try { startActivityForResult(fileChooserParams!!.createIntent(), REQ_FILE) } catch (e: Exception) { fileCb?.onReceiveValue(null); fileCb = null } }
                      else { fileCb?.onReceiveValue(null); fileCb = null; startFolderPick(0) }
                    }.setOnCancelListener { fileCb?.onReceiveValue(null); fileCb = null }.show()
                    return true
                  }
                  fileCb?.onReceiveValue(null); fileCb = filePathCallback
                  return try { startActivityForResult(fileChooserParams!!.createIntent(), REQ_FILE); true } catch (e: Exception) { fileCb = null; false }
                }
              }
              val tab = Tab(w); tab.profile = pf; tabs.add(tab)
            }

            private fun forceDesktopViewport(w: WebView?) {
              if (!desktop || w == null) return
              w.evaluateJavascript("(function(){function fix(){var ms=document.querySelectorAll('meta[name=viewport]');var m=ms[0];if(!m){m=document.createElement('meta');m.setAttribute('name','viewport');(document.head||document.documentElement).appendChild(m);}for(var i=1;i<ms.length;i++){ms[i].parentNode.removeChild(ms[i]);}if(m.getAttribute('content')!=='width=1024')m.setAttribute('content','width=1024');}fix();if(!window.__abhDesk){window.__abhDesk=1;new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['content','name']});}})();", null)
            }

            private fun hideCustom() { val v = customView ?: return; (window.decorView as FrameLayout).removeView(v); customCb?.onCustomViewHidden(); customView = null; customCb = null; bars() }

            private fun captureThumb(t: Tab) {
              if (t.home) return; val v = t.web; if (v.width <= 0 || v.height <= 0) return
              try { val targetW = 360; val scale = targetW.toFloat() / v.width.toFloat(); val bmp = Bitmap.createBitmap(targetW, (v.height * scale).toInt().coerceIn(120, 640), Bitmap.Config.RGB_565); val c = Canvas(bmp); c.scale(scale, scale); v.draw(c); t.thumb = bmp } catch (e: Exception) { }
            }

            private fun showTab(i: Int) {
              if (cur != i && cur in tabs.indices) captureThumb(tabs[cur]); cur = i
              for (j in content.childCount - 1 downTo 0) if (content.getChildAt(j) is WebView) content.removeViewAt(j)
              content.addView(tabs[i].web, 0, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); refresh()
            }

            private fun refresh() {
              val t = tabs[cur]; home.visibility = if (t.home) View.VISIBLE else View.GONE; urlBox.setText(if (t.home) "" else (t.web.url ?: "")); tabCount.text = tabs.size.toString()
              val pr = t.web.progress; pageBar.progress = pr; pageBar.visibility = if (!t.home && pr in 1..99) View.VISIBLE else View.GONE; setBarsHidden(false); updateFab()
            }

            private fun open(raw: String) {
              val s = raw.trim(); if (s.isEmpty()) return
              val url = when { s.startsWith("http://") || s.startsWith("https://") -> s; !s.contains(" ") && s.contains(".") -> "https://$s"; else -> "https://www.google.com/search?q=" + Uri.encode(s) }
              val t = tabs[cur]; t.home = false; t.web.loadUrl(url); refresh(); urlBox.setText(url)
            }

            private fun showTabs() {
              if (tabs.getOrNull(cur) != null) captureThumb(tabs[cur])
              tabsGrid.numColumns = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) 3 else 2
              findViewById<TextView>(R.id.tabsTitle).text = "Tabs (${tabs.size})"; tabsAdapter.notifyDataSetChanged(); showPage(tabsPage)
            }

            private fun closeTab(pos: Int) {
              if (pos !in tabs.indices) return
              if (tabs.size > 1) {
                val removed = tabs.removeAt(pos); content.removeView(removed.web); removed.web.destroy(); deleteProfileLater(removed.profile)
                val next = when { cur == pos -> minOf(pos, tabs.size - 1); cur > pos -> cur - 1; else -> cur }; if (cur == pos) cur = -1; showTab(next)
              } else { tabs[0].home = true; tabs[0].thumb = null; refresh(); hidePages(); return }
              findViewById<TextView>(R.id.tabsTitle).text = "Tabs (${tabs.size})"; tabsAdapter.notifyDataSetChanged()
            }

            inner class TabsAdapter : BaseAdapter() {
              override fun getCount() = tabs.size; override fun getItem(position: Int) = tabs[position]; override fun getItemId(position: Int) = position.toLong()
              override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                val t = tabs[position]; val isCur = position == cur
                val card = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL; background = shape(col.card, 14, if (isCur) 0xFF2D7FF9.toInt() else col.stroke, if (isCur) dp(2) else dp(1)); setPadding(dp(2), dp(2), dp(2), dp(2)) }
                val header = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(dp(10), dp(4), dp(4), dp(4)) }
                val title = TextView(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f); text = if (t.home) "Home" else (t.web.title?.takeIf { it.isNotBlank() } ?: t.web.url ?: "Tab"); textSize = 13f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END; setTextColor(col.text); if (isCur) setTypeface(null, Typeface.BOLD) }
                val closeBtn = TextView(this@MainActivity).apply { text = "\u2715"; textSize = 14f; setTextColor(col.sec); setPadding(dp(8), dp(4), dp(8), dp(4)); setOnClickListener { closeTab(position) } }
                header.addView(title); header.addView(closeBtn); card.addView(header)
                val previewBox = FrameLayout(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) dp(125) else dp(165)); background = shape(col.bg, 10) }
                val bmp = t.thumb
                if (!t.home && bmp != null) previewBox.addView(ImageView(this@MainActivity).apply { layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT); scaleType = ImageView.ScaleType.CENTER_CROP; setImageBitmap(bmp) })
                else if (t.home) previewBox.addView(ImageView(this@MainActivity).apply { layoutParams = FrameLayout.LayoutParams(dp(56), dp(56)).apply { gravity = Gravity.CENTER }; setImageResource(R.drawable.ic_logo) })
                else previewBox.addView(TextView(this@MainActivity).apply { layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { gravity = Gravity.CENTER }; setPadding(dp(12), dp(8), dp(12), dp(8)); text = Uri.parse(t.web.url ?: "").host ?: "Tab"; textSize = 13f; setTextColor(col.sec) })
                card.addView(previewBox); card.setOnClickListener { showTab(position); hidePages() }; return card
              }
            }

            private fun handleLongPressLink(url: String, linkText: String, sourceUrl: String, sourceLinks: Set<String>, profile: String, webUa: String) {
              val cleanName = sanitizeName(linkText).ifEmpty { guessNameFromUrl(url) }
              if (isAudioUrl(url)) { dlg().setTitle(cleanName).setMessage("Download this audio file?").setPositiveButton("Download") { _, _ -> startDirectNamed(url, cleanName, sourceUrl, profile, "", true, webUa) }.setNegativeButton("Cancel", null).show(); return }
              val cancelled = AtomicBoolean(false); val wait = dlg().setTitle(cleanName).setMessage("Scanning folder & songs...").setCancelable(true).setOnCancelListener { cancelled.set(true) }.show()
              Thread {
                try {
                  val (finalUrl, doc) = fetchHtml(url, webUa, profile, sourceUrl, cancelled); if (cancelled.get()) return@Thread
                  val tmpl = HashSet<String>(); val needRootFetch = sourceLinks.isEmpty() || (sourceUrl.isNotEmpty() && normUrl(finalUrl) == normUrl(sourceUrl))
                  if (sourceUrl.isNotEmpty() && normUrl(finalUrl) != normUrl(sourceUrl)) tmpl.addAll(sourceLinks)
                  if (needRootFetch) {
                    val parsed = Uri.parse(finalUrl); val rootUrl = "${parsed.scheme ?: "https"}://${parsed.host ?: ""}/"
                    if (normUrl(rootUrl) != normUrl(finalUrl)) try { val (_, rootDoc) = fetchHtml(rootUrl, webUa, profile, finalUrl, cancelled); for (a in rootDoc.select("a[href]")) { val h = a.absUrl("href"); if (h.startsWith("http")) tmpl.add(normUrl(h)) } } catch (e: Exception) { }
                  }
                  if (cancelled.get()) return@Thread
                  val ignore = HashSet<String>(tmpl); if (sourceUrl.isNotEmpty()) ignore.add(normUrl(sourceUrl)); ignore.add(normUrl(finalUrl))
                  val res = analyzePage(doc, finalUrl, ignore)
                  runOnUiThread {
                    if (cancelled.get() || !wait.isShowing) return@runOnUiThread; wait.dismiss()
                    if (res.audios.isEmpty() && res.folders.isEmpty()) toast("No MP3 files or subfolders found in $cleanName")
                    else if (res.folders.isNotEmpty()) {
                      val hasAudios = res.audios.isNotEmpty(); val singleLetters = res.folders.filter { it.name.length == 1 && it.name[0] in 'A'..'Z' }.map { it.name[0] }.toSet()
                      val missingLetters = ('A'..'Z').filter { it !in singleLetters }; val isAzIndex = singleLetters.size >= 15 && missingLetters.size == 1
                      val activeLetter = if (isAzIndex) missingLetters[0].toString() else ""; val azItems = mutableListOf<Pair<String, FoundLink?>>(); val activeSubfolders = mutableListOf<FoundLink>()
                      if (isAzIndex) {
                        val letterLinks = HashMap<Char, FoundLink>(); var otherLink: FoundLink? = null
                        for (f in res.folders) { if (f.name.length == 1 && f.name[0] in 'A'..'Z') { if (f.name[0] !in letterLinks) letterLinks[f.name[0]] = f } else if (f.name.equals("Other", ignoreCase = true)) { if (otherLink == null) otherLink = f } else activeSubfolders.add(f) }
                        for (ch in 'A'..'Z') { if (ch == missingLetters[0]) { if (activeSubfolders.isNotEmpty()) azItems.add(activeLetter to null) } else { val lf = letterLinks[ch]; if (lf != null) azItems.add(lf.name to lf) } }
                        if (otherLink != null) azItems.add(otherLink.name to otherLink)
                      }
                      val choiceLabels = mutableListOf<String>(); if (hasAudios) choiceLabels.add("Songs in this folder (${res.audios.size})")
                      if (isAzIndex) for ((lab, _) in azItems) choiceLabels.add(lab) else for (f in res.folders) choiceLabels.add(f.name)
                      val checked = BooleanArray(choiceLabels.size) { false }
                      val alert = dlg().setTitle(cleanName).setMultiChoiceItems(choiceLabels.toTypedArray(), checked) { d, which, isChecked -> checked[which] = isChecked; (d as? AlertDialog)?.getButton(AlertDialog.BUTTON_POSITIVE)?.isEnabled = checked.any { it } }
                        .setPositiveButton("Download") { _, _ ->
                          val includeAudios = hasAudios && checked[0]; val offset = if (hasAudios) 1 else 0
                          val pickedFolders = mutableListOf<FoundLink>(); val preloadedSubs = mutableListOf<FoundLink>(); val skippedUrls = HashSet<String>()
                          if (isAzIndex) { for (i in azItems.indices) { val (_, linkObj) = azItems[i]; val isPicked = checked[i + offset]; if (linkObj == null) { if (isPicked) preloadedSubs.addAll(activeSubfolders) else for (sf in activeSubfolders) skippedUrls.add(normUrl(sf.url)) } else { if (isPicked) pickedFolders.add(linkObj) else skippedUrls.add(normUrl(linkObj.url)) } } }
                          else { for (i in res.folders.indices) { if (checked[i + offset]) pickedFolders.add(res.folders[i]) else skippedUrls.add(normUrl(res.folders[i].url)) } }
                          if (includeAudios || pickedFolders.isNotEmpty() || preloadedSubs.isNotEmpty()) startFolderBatch(cleanName, finalUrl, if (includeAudios) res.audios else emptyList(), pickedFolders, activeLetter, preloadedSubs, skippedUrls, ignore, webUa, profile)
                        }.setNeutralButton("Select all", null).setNegativeButton("Cancel", null).show()
                      val posBtn = alert.getButton(AlertDialog.BUTTON_POSITIVE); posBtn.isEnabled = false; val neuBtn = alert.getButton(AlertDialog.BUTTON_NEUTRAL)
                      neuBtn.setOnClickListener { val next = !checked.all { it }; val lv = alert.listView; for (i in checked.indices) { checked[i] = next; lv.setItemChecked(i, next) }; posBtn.isEnabled = checked.any { it }; neuBtn.text = if (next) "Clear all" else "Select all" }
                    } else dlg().setTitle(cleanName).setMessage("$cleanName (${res.audios.size} songs) - Download all?").setPositiveButton("Download all") { _, _ -> enqueueAudioList(res.audios, cleanName, finalUrl, webUa, profile, true) }.setNegativeButton("Cancel", null).show()
                  }
                } catch (e: Exception) { runOnUiThread { if (wait.isShowing) wait.dismiss(); if (!cancelled.get()) toast("Could not scan folder: ${e.message}") } }
              }.start()
            }

            private fun isChallengeHtml(html: String): Boolean { val low = html.take(4000).lowercase(Locale.US); return low.contains("just a moment") || low.contains("cf-browser-verification") || low.contains("challenge-platform") || low.contains("enable javascript and cookies") }

            private fun fetchHtml(url: String, ua: String?, profile: String, referer: String, cancelled: AtomicBoolean): Pair<String, Document> {
              val host = (Uri.parse(url).host ?: "").lowercase(Locale.US)
              if (host !in wvOnlyHosts) {
                try {
                  val conn = openFollow(url, ua, 0L, profile, referer)
                  try {
                    val ct = (conn.contentType ?: "").lowercase(Locale.US); if (ct.isNotEmpty() && !ct.contains("html") && !ct.contains("text") && !ct.contains("xml")) throw Exception("Not an HTML folder page")
                    val finalUrl = conn.url.toString()
                    val html = conn.inputStream.bufferedReader(Charsets.UTF_8).use { r -> val buf = CharArray(65536); val sb = StringBuilder(); var total = 0; while (total < 1500000) { val n = r.read(buf); if (n < 0) break; sb.append(buf, 0, n); total += n }; sb.toString() }
                    if (!isChallengeHtml(html)) return finalUrl to Jsoup.parse(html, finalUrl)
                  } finally { conn.disconnect() }
                } catch (e: HttpCodeException) { if (e.code !in WV_FALLBACK_CODES) throw e; if (host.isNotEmpty()) wvOnlyHosts.add(host) }
              }
              if (cancelled.get()) throw Exception("Cancelled"); return fetchHtmlViaWebView(url, profile, referer, cancelled)
            }

            @SuppressLint("SetJavaScriptEnabled")
            private fun fetchHtmlViaWebView(url: String, profile: String, referer: String, cancelled: AtomicBoolean): Pair<String, Document> {
              val latch = CountDownLatch(1); val done = AtomicBoolean(false); var resUrl = url; var resHtml = ""; var resErr: String? = null; val holder = arrayOfNulls<WebView>(1)
              fun cleanup(wv: WebView?) { if (wv != null) { try { wv.stopLoading() } catch (e: Exception) { }; try { wv.destroy() } catch (e: Exception) { } } }
              fun extract(wv: WebView, attempt: Int) {
                if (done.get() || cancelled.get()) { if (done.compareAndSet(false, true)) { cleanup(wv); latch.countDown() }; return }
                wv.evaluateJavascript("(function(){return JSON.stringify({u:location.href,h:document.documentElement.outerHTML});})();") { raw ->
                  if (done.get()) return@evaluateJavascript; var u = url; var h = ""
                  try { val s = JSONTokener(raw).nextValue() as? String; if (!s.isNullOrEmpty()) { val o = JSONObject(s); u = o.optString("u", url); h = o.optString("h", "") } } catch (e: Exception) { }
                  if ((h.length < 150 || isChallengeHtml(h)) && attempt < 6 && !cancelled.get()) mainHandler.postDelayed({ extract(wv, attempt + 1) }, 1200)
                  else if (done.compareAndSet(false, true)) { resUrl = u; resHtml = h; cleanup(wv); latch.countDown() }
                }
              }
              runOnUiThread {
                if (cancelled.get()) { done.set(true); latch.countDown(); return@runOnUiThread }
                try {
                  val wv = WebView(this@MainActivity); holder[0] = wv; if (profile.isNotEmpty() && multiProfile) try { WebViewCompat.setProfile(wv, profile) } catch (e: Exception) { }; applyWeb(wv)
                  wv.webViewClient = object : WebViewClient() { override fun onPageFinished(view: WebView?, loadedUrl: String?) { if (!done.get()) mainHandler.postDelayed({ if (!done.get() && view != null) extract(view, 0) }, 350) } }
                  if (referer.isNotEmpty()) wv.loadUrl(url, mapOf("Referer" to referer)) else wv.loadUrl(url)
                } catch (e: Exception) { resErr = e.message ?: "WebView load error"; done.set(true); latch.countDown() }
              }
              latch.await(25, TimeUnit.SECONDS); if (!done.get()) { done.set(true); runOnUiThread { cleanup(holder[0]) } }
              if (cancelled.get()) throw Exception("Cancelled"); if (resErr != null) throw Exception(resErr); if (resHtml.isEmpty()) throw Exception("Could not load folder page")
              return resUrl to Jsoup.parse(resHtml, resUrl)
            }

            private fun findSingleSongRow(el: Element?): Element? {
              var cur = el?.parent(); var depth = 0
              while (cur != null && depth < 6) {
                val tag = cur.tagName().lowercase(Locale.US)
                if (tag == "tr" || tag == "li" || tag == "div" || tag == "p") return if (cur.select("a").size <= 6 && cur.select("tr").size <= 1) cur else null
                cur = cur.parent(); depth++
              }
              return null
            }

            private fun extractInlineTitle(el: Element?): String {
              if (el == null) return ""; val stopTags = setOf("br", "tr", "li", "div", "p", "hr", "table")
              fun scanFrom(anchor: Element): String {
                var best = ""; fun checkNode(n: Node) { val raw = when (n) { is TextNode -> n.text(); is Element -> n.text(); else -> "" }; val t = sanitizeName(raw); if (!isJunkTitle(t) && t.length > best.length) best = t }
                var cur: Node? = anchor.nextSibling(); var steps = 0; while (cur != null && steps < 10) { if (cur is Element && cur.tagName().lowercase(Locale.US) in stopTags) break; checkNode(cur); cur = cur.nextSibling(); steps++ }
                if (best.isNotEmpty()) return best; cur = anchor.previousSibling(); steps = 0
                while (cur != null && steps < 10) { if (cur is Element && cur.tagName().lowercase(Locale.US) in stopTags) break; checkNode(cur); cur = cur.previousSibling(); steps++ }
                return best
              }
              val direct = scanFrom(el); if (direct.isNotEmpty()) return direct; val p = el.parent()
              return if (p != null && p.tagName().lowercase(Locale.US) == "span" && p.select("a").size <= 2) scanFrom(p) else ""
            }

            private fun extractRowTitle(row: Element?): String {
              if (row == null || row.select("a").size > 8) return ""; var best = ""
              for (a in row.select("a")) { val t = sanitizeName(a.text()); if (!isJunkTitle(t) && t.length > best.length) best = t }; if (best.isNotEmpty()) return best
              for (el in row.select("td, th, span, font, b, strong, p, div")) { if (el.select("tr").size > 1) continue; val t = sanitizeName(el.ownText().ifEmpty { el.text() }); if (!isJunkTitle(t) && t.length > best.length) best = t }
              if (best.isNotEmpty()) return best; val rt = sanitizeName(row.text()); return if (!isJunkTitle(rt)) rt else ""
            }

            private fun analyzePage(doc: Document, baseUrl: String, ignoreUrls: Set<String>): ScanResult {
              val audios = mutableListOf<FoundLink>(); val seenAudio = HashSet<String>(); val handledRows = HashSet<Element>()
              fun addAudio(rawUrl: String, rawTitle: String, row: Element?, el: Element?): Boolean {
                val u = rawUrl.substringBefore('#').trim(); if (!u.startsWith("http")) return false
                val nu = normUrl(u); if (nu in seenAudio || (row != null && row in handledRows)) return false
                val cleaned = sanitizeName(rawTitle); val rowFallback = if (isJunkTitle(cleaned)) extractRowTitle(row).ifEmpty { extractInlineTitle(el) } else ""
                val title = when { !isJunkTitle(cleaned) -> cleaned; rowFallback.isNotEmpty() -> rowFallback; else -> guessNameFromUrl(u) }
                seenAudio.add(nu); if (row != null) handledRows.add(row); audios.add(FoundLink(u, title)); return true
              }
              for (a in doc.select("a[href]")) { val h = a.absUrl("href").substringBefore('#').trim(); if (!h.startsWith("http") || !isAudioUrl(h)) continue; val row = findSingleSongRow(a); val rawT = sanitizeName(a.text()); addAudio(h, if (!isJunkTitle(rawT)) rawT else extractRowTitle(row).ifEmpty { extractInlineTitle(a) }, row, a) }
              for (el in doc.select("audio[src], source[src]")) { val h = el.absUrl("src"); if (isAudioUrl(h)) addAudio(h, "", findSingleSongRow(el), el) }
              val mp3Re = Regex("https?://[^'\"\\s)]+\\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\\?[^'\"\\s)]*)?", RegexOption.IGNORE_CASE)
              val relMp3Re = Regex("['\"]([^'\"]+\\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\\?[^'\"]*)?)['\"]", RegexOption.IGNORE_CASE)
              for (el in doc.select("[onclick], [data-src], [data-url], [data-file], [data-mp3], [data-audio]")) {
                val row = findSingleSongRow(el); val rawElText = sanitizeName(el.text()); val title = if (!isJunkTitle(rawElText)) rawElText else extractRowTitle(row).ifEmpty { extractInlineTitle(el) }
                for (attr in listOf("data-src", "data-url", "data-file", "data-mp3", "data-audio", "onclick")) {
                  val v = el.attr(attr); if (v.isEmpty()) continue; val m = mp3Re.find(v)
                  if (m != null) addAudio(m.value, title, row, el) else { val m2 = relMp3Re.find(v); if (m2 != null) try { addAudio(URL(URL(baseUrl), m2.groupValues[1]).toString(), title, row, el) } catch (e: Exception) { } }
                }
              }
              val sizeInRowRe = Regex("\\b[0-9]+(\\.[0-9]+)?\\s*(mb|kb|gb)\\b", RegexOption.IGNORE_CASE)
              for (row in doc.select("tr, li, div, p")) {
                if (row in handledRows) continue; val links = row.select("a[href]"); if (links.isEmpty() || links.size > 6 || row.select("tr").size > 1) continue
                var dlHref = ""; var rowAlreadyHandled = false; val rowHasSize = sizeInRowRe.containsMatchIn(row.text())
                for (la in links) {
                  val h = la.absUrl("href").substringBefore('#').trim(); if (normUrl(h) in seenAudio) { rowAlreadyHandled = true; break }
                  if (dlHref.isEmpty() && h.startsWith("http") && sameHost(h, baseUrl)) {
                    val img = la.selectFirst("img"); val hint = ((img?.attr("src") ?: "") + " " + (img?.attr("alt") ?: "") + " " + (img?.attr("title") ?: "") + " " + la.attr("title")).lowercase(Locale.US)
                    val hl = h.lowercase(Locale.US); val isPlay = hint.contains("play") && !hint.contains("dl") && !hint.contains("down")
                    val isDl = hl.contains("download") || hl.contains("dl=") || hl.contains("file=") || hl.contains("/dl/") || hint.contains("dl") || hint.contains("down") || hint.contains("save")
                    if (isDl || (rowHasSize && !isPlay && la.text().trim().isEmpty() && img != null && !hint.contains("plus") && !hint.contains("add"))) dlHref = h
                  }
                }
                if (!rowAlreadyHandled && dlHref.isNotEmpty()) { val bestTitle = extractRowTitle(row); if (bestTitle.isNotEmpty()) addAudio(dlHref, bestTitle, row, row) }
              }
              val scriptMp3Re = Regex("['\"]([^'\"\\s<>]+\\.(?:mp3|m4a|flac|wav|aac|ogg|opus)(?:\\?[^'\"\\s<>]*)?)['\"]", RegexOption.IGNORE_CASE)
              for (sc in doc.select("script")) { val st = sc.data(); if (st.isEmpty() || st.length > 300000) continue; for (m in scriptMp3Re.findAll(st)) try { addAudio(URL(URL(baseUrl), m.groupValues[1]).toString(), "", null, null) } catch (e: Exception) { } }
              val folders = mutableListOf<FoundLink>(); val seenFolders = HashSet<String>(); val hasAudios = audios.isNotEmpty()
              for (a in doc.select("a[href]")) {
                if (a.closest("header, nav, footer") != null) continue; val h = a.absUrl("href").substringBefore('#').trim()
                if (!h.startsWith("http") || !sameHost(h, baseUrl)) continue; val ext = urlExt(h); if (ext in AUDIO_EXTS || ext in SKIP_EXTS || isParentUrl(h, baseUrl)) continue
                val nu = normUrl(h); if (nu in ignoreUrls || nu in seenAudio || nu in seenFolders) continue; if (hasAudios && !isLikelyChildFolder(a, h, baseUrl)) continue
                val label = sanitizeName(a.text().trim().ifEmpty { a.attr("title").trim() }.ifEmpty { a.selectFirst("img")?.attr("alt")?.trim() ?: "" })
                if (label.isEmpty() || (label.length == 1 && !label[0].isLetterOrDigit()) || label.lowercase(Locale.US) in SKIP_WORDS) continue
                val pathLow = (Uri.parse(h).path ?: "").lowercase(Locale.US); if (pathLow.endsWith("/login") || pathLow.endsWith("/register") || pathLow.endsWith("/search") || pathLow.endsWith("/chat") || pathLow.endsWith("/forum")) continue
                seenFolders.add(nu); folders.add(FoundLink(h, label))
              }
              return ScanResult(audios, folders)
            }

            private fun startFolderBatch(rootFolder: String, rootUrl: String, rootAudios: List<FoundLink>, selectedFolders: List<FoundLink>, preloadedPrefix: String, preloadedSubs: List<FoundLink>, skippedUrls: Set<String>, templateLinks: Set<String>, ua: String?, profile: String) {
              val cleanRoot = sanitizeFolder(rootFolder); val totalPicked = selectedFolders.size + (if (preloadedSubs.isNotEmpty()) 1 else 0)
              toast(if (totalPicked > 0) "Scanning $totalPicked folder(s) & starting downloads..." else "Starting ${rootAudios.size} song download(s)...")
              dlTab = 0; flyToDownload(); if (rootAudios.isNotEmpty()) enqueueAudioList(rootAudios, cleanRoot, rootUrl, ua, profile, false)
              if (selectedFolders.isEmpty() && preloadedSubs.isEmpty()) return; activeBatchCancel?.set(true); val batchCancelled = AtomicBoolean(false); activeBatchCancel = batchCancelled
              Thread {
                var queuedSongs = rootAudios.size; var scannedCount = 0; val visited = HashSet<String>(templateLinks); visited.addAll(skippedUrls); visited.add(normUrl(rootUrl))
                val seenSongKeys = HashSet<String>(); val rootSlash = cleanRoot.count { it == '/' }; val queue = ArrayDeque<Triple<FoundLink, String, String>>()
                for (sf in preloadedSubs) queue.addLast(Triple(sf, sanitizeFolder("$cleanRoot/$preloadedPrefix/${sf.name}"), rootUrl))
                for (sf in selectedFolders) queue.addLast(Triple(sf, sanitizeFolder("$cleanRoot/${sf.name}"), rootUrl))
                while (!batchCancelled.get() && queue.isNotEmpty() && scannedCount < 2000 && queuedSongs < 10000) {
                  val (folderLink, folderPath, refUrl) = queue.removeFirst(); val nf = normUrl(folderLink.url); if (!visited.add(nf)) continue; scannedCount++
                  try {
                    val (subFinal, subDoc) = fetchHtml(folderLink.url, ua, profile, refUrl, batchCancelled); if (batchCancelled.get()) break; visited.add(normUrl(subFinal))
                    val subRes = analyzePage(subDoc, subFinal, visited)
                    if (subRes.audios.isNotEmpty()) { val uniqueAudios = subRes.audios.filter { seenSongKeys.add("$folderPath|${normUrl(it.url)}") }; if (uniqueAudios.isNotEmpty()) { queuedSongs += uniqueAudios.size; runOnUiThread { if (!batchCancelled.get()) enqueueAudioList(uniqueAudios, folderPath, subFinal, ua, profile, false) } } }
                    val isLetterTab = folderLink.name.length == 1 || folderLink.name.equals("Other", ignoreCase = true); val hasAzBar = subRes.folders.count { it.name.length == 1 && it.name[0] in 'A'..'Z' } >= 10
                    if (subRes.folders.isNotEmpty() && folderPath.count { it == '/' } - rootSlash < 6) {
                      for (sub2 in subRes.folders) { if ((isLetterTab || hasAzBar) && (sub2.name.length == 1 || sub2.name.equals("Other", ignoreCase = true))) continue; if (normUrl(sub2.url) !in visited) queue.addLast(Triple(sub2, sanitizeFolder("$folderPath/${sub2.name}"), subFinal)) }
                    }
                  } catch (e: Exception) { }
                }
                if (!batchCancelled.get()) runOnUiThread { toast("Queued $queuedSongs songs in $cleanRoot") }
              }.start()
            }

            private fun enqueueAudioList(audios: List<FoundLink>, folderPath: String, pageUrl: String, ua: String?, profile: String, animate: Boolean) {
              if (audios.isEmpty()) return; val cleanFolder = sanitizeFolder(folderPath); val usedNames = HashSet<String>()
              for (existing in items) if (existing.folder == cleanFolder && existing.title.isNotEmpty()) usedNames.add(existing.title.lowercase(Locale.US))
              val toRun = mutableListOf<DlItem>()
              for (a in audios) {
                val ext = urlExt(a.url).let { if (it in AUDIO_EXTS) ".$it" else ".mp3" }; var cleanTitle = sanitizeName(a.name).ifEmpty { "Track" }
                if (!usedNames.add(cleanTitle.lowercase(Locale.US))) { val fromUrl = guessNameFromUrl(a.url); if (!isJunkTitle(fromUrl) && usedNames.add(fromUrl.lowercase(Locale.US))) cleanTitle = fromUrl else { var n = 2; while (!usedNames.add("$cleanTitle ($n)".lowercase(Locale.US))) n++; cleanTitle = "$cleanTitle ($n)" } }
                val d = DlItem(cleanTitle, 0, 0, null, null, ""); d.kind = 1; d.link = a.url; d.page = pageUrl; d.profile = profile; d.ua = ua; d.name = cleanTitle + ext; d.folder = cleanFolder; d.customName = true; d.expectAudio = true; items.add(0, d); toRun.add(d)
              }
              dlTab = 0; if (animate) { flyToDownload(); toast("Added ${audios.size} songs to Downloads") }; scheduleSaveItems(); if (dlPage.visibility == View.VISIBLE) refreshDl()
              for (d in toRun) { d.stop = 0; d.state = 0; d.gen++; val g = d.gen; directExec.execute { runDirect(d, g) } }
            }

            // ---------- In-app folder picker + GitHub Web & API upload ----------

            private fun hasStorageAccess(): Boolean =
              if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
              else checkSelfPermission(android.Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED

            private fun launchSystemFolderPicker() {
              try { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT_TREE), if (folderPickMode == 0) REQ_WEB_TREE else REQ_GH_TREE) }
              catch (e: Exception) { toast("Could not open folder picker") }
            }

            private fun startFolderPick(mode: Int) {
              folderPickMode = mode
              if (hasStorageAccess()) { showInAppFolderPicker(Environment.getExternalStorageDirectory()); return }
              dlg().setTitle("Folder access needed").setMessage("Allow file access once so you can pick any folder & subfolder easily (including Downloads).")
                .setPositiveButton("Allow access") { _, _ ->
                  if (Build.VERSION.SDK_INT >= 30) {
                    try { startActivityForResult(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName")), REQ_ALL_FILES) }
                    catch (e: Exception) { startActivityForResult(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION), REQ_ALL_FILES) }
                  } else requestPermissions(arrayOf(android.Manifest.permission.READ_EXTERNAL_STORAGE), REQ_PERM)
                }.setNeutralButton("System picker") { _, _ -> launchSystemFolderPicker() }.setNegativeButton("Cancel", null).show()
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
              if (requestCode == REQ_PERM) { if (hasStorageAccess()) showInAppFolderPicker(Environment.getExternalStorageDirectory()) else toast("Permission denied - try System picker") }
              else super.onRequestPermissionsResult(requestCode, permissions, grantResults)
            }

            private fun showInAppFolderPicker(startDir: File) {
              var curDir = startDir; val rootDir = Environment.getExternalStorageDirectory()
              val titleTv = TextView(this).apply { textSize = 13f; setTextColor(col.sec); setPadding(dp(18), dp(12), dp(18), dp(8)) }
              val lv = ListView(this); val rows = mutableListOf<Pair<String, File?>>()
              val adapter = object : BaseAdapter() {
                override fun getCount() = rows.size; override fun getItem(p: Int) = rows[p]; override fun getItemId(p: Int) = p.toLong()
                override fun getView(p: Int, cv: View?, parent: ViewGroup?) = ((cv as? TextView) ?: TextView(this@MainActivity).apply { textSize = 15f; setPadding(dp(18), dp(13), dp(18), dp(13)) }).apply { setTextColor(col.text); text = rows[p].first }
              }
              lv.adapter = adapter
              fun loadDir(d: File) {
                curDir = d; titleTv.text = d.absolutePath.removePrefix(rootDir.absolutePath).ifEmpty { "/Internal Storage" }; rows.clear()
                if (d.absolutePath != rootDir.absolutePath && d.parentFile != null) rows.add("..  (Back)" to d.parentFile)
                for (s in (d.listFiles() ?: emptyArray()).filter { it.isDirectory && !it.name.startsWith(".") }.sortedBy { it.name.lowercase(Locale.US) }) rows.add("\uD83D\uDCC1  ${s.name}  (${s.listFiles()?.size ?: 0})" to s)
                if (rows.isEmpty()) rows.add("(No subfolders - tap Select this folder)" to null)
                adapter.notifyDataSetChanged()
              }
              val wrap = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; addView(titleTv); addView(lv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(340))) }
              loadDir(startDir)
              dlg().setTitle("Select folder to upload").setView(wrap)
                .setPositiveButton("Select this folder") { _, _ -> scanAndRunUpload(curDir, null, folderPickMode == 0) }
                .setNeutralButton("System picker") { _, _ -> launchSystemFolderPicker() }.setNegativeButton("Cancel", null).show()
              lv.setOnItemClickListener { _, _, p, _ -> val target = rows[p].second; if (target != null && target.isDirectory) loadDir(target) }
            }

            private fun scanAndRunUpload(dirFile: File?, treeUri: Uri?, webDrop: Boolean) {
              val cancelled = AtomicBoolean(false); val wait = dlg().setTitle("Scanning folder...").setMessage("Reading files and subfolders...").setCancelable(true).setOnCancelListener { cancelled.set(true) }.show()
              Thread {
                try {
                  val entries = mutableListOf<UploadEntry>(); val folderSet = HashSet<String>(); var rootName = "Folder"
                  if (dirFile != null) {
                    rootName = dirFile.name.ifEmpty { "Folder" }
                    fun walkF(d: File, prefix: String) {
                      if (cancelled.get()) return
                      for (ch in (d.listFiles() ?: emptyArray()).sortedBy { it.name.lowercase(Locale.US) }) {
                        if (cancelled.get()) break; if (ch.name == ".git") continue
                        val rel = if (prefix.isEmpty()) ch.name else "$prefix/${ch.name}"
                        if (ch.isDirectory) { folderSet.add(rel); walkF(ch, rel) } else if (ch.isFile) entries.add(UploadEntry(rel, ch.length(), ch, null))
                      }
                    }
                    walkF(dirFile, "")
                  } else if (treeUri != null) {
                    val rootId = DocumentsContract.getTreeDocumentId(treeUri)
                    contentResolver.query(DocumentsContract.buildDocumentUriUsingTree(treeUri, rootId), arrayOf(DocumentsContract.Document.COLUMN_DISPLAY_NAME), null, null, null)?.use { c -> if (c.moveToFirst() && !c.getString(0).isNullOrBlank()) rootName = c.getString(0) }
                    fun walkU(docId: String, prefix: String) {
                      if (cancelled.get()) return
                      contentResolver.query(DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, docId), arrayOf(DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_MIME_TYPE, DocumentsContract.Document.COLUMN_SIZE), null, null, null)?.use { c ->
                        while (c.moveToNext() && !cancelled.get()) {
                          val id = c.getString(0) ?: continue; val name = c.getString(1) ?: continue; val mime = c.getString(2) ?: ""; val size = if (!c.isNull(3)) c.getLong(3) else 0L
                          if (name == ".git") continue; val rel = if (prefix.isEmpty()) name else "$prefix/$name"
                          if (mime == DocumentsContract.Document.MIME_TYPE_DIR) { folderSet.add(rel); walkU(id, rel) } else entries.add(UploadEntry(rel, size, null, DocumentsContract.buildDocumentUriUsingTree(treeUri, id)))
                        }
                      }
                    }
                    walkU(rootId, "")
                  }
                  if (cancelled.get()) return@Thread
                  val basePrefix = if (webDrop) sanitizeName(rootName).ifEmpty { "Folder" } else listOfNotNull(ghSubpath.takeIf { it.isNotEmpty() }, if (ghKeepRoot) sanitizeName(rootName).takeIf { it.isNotEmpty() } else null).joinToString("/")
                  val mapped = entries.map { e -> UploadEntry(if (basePrefix.isEmpty()) e.relPath else "$basePrefix/${e.relPath}", e.size, e.file, e.uri) }
                  runOnUiThread {
                    if (cancelled.get() || !wait.isShowing) return@runOnUiThread; wait.dismiss()
                    if (mapped.isEmpty()) { toast("No files found in $rootName"); return@runOnUiThread }
                    if (webDrop) {
                      if (mapped.size > 100) dlg().setTitle("$rootName (${mapped.size} files)").setMessage("GitHub web page allows max 100 files at once.\n\nUse Menu -> Upload folder to GitHub (API) for all ${mapped.size} files, or attach first 100 here.").setPositiveButton("Attach first 100") { _, _ -> dropFolderIntoGithubWeb(mapped.take(100)) }.setNeutralButton("Use API upload") { _, _ -> openGithubUploadDialog() }.setNegativeButton("Cancel", null).show()
                      else dropFolderIntoGithubWeb(mapped)
                    } else {
                      val brLabel = ghBranch.ifEmpty { "default" }; val dest = if (basePrefix.isEmpty()) "root" else basePrefix
                      dlg().setTitle("Upload to GitHub?").setMessage("Folder: $rootName\nFiles: ${mapped.size} (subfolders: ${folderSet.size})\nRepo: $ghRepo ($brLabel)\nPath: /$dest").setPositiveButton("Upload") { _, _ -> runGithubUpload(mapped, ghRepo, ghBranch, ghMsg, ghToken) }.setNegativeButton("Cancel", null).show()
                    }
                  }
                } catch (e: Exception) { runOnUiThread { if (wait.isShowing) wait.dismiss(); if (!cancelled.get()) toast("Could not read folder: ${e.message}") } }
              }.start()
            }

            private fun readEntryBytes(e: UploadEntry): ByteArray? = if (e.file != null) e.file.readBytes() else e.uri?.let { contentResolver.openInputStream(it)?.use { ins -> ins.readBytes() } }

